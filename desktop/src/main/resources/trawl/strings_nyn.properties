addon_speech_cost=%1$s aha kompyuta egi.
addons_status_included=Birimu
addons_bundled_on=Bije na fayiro ya modeli za Trawl, kandi nibikora. Ebirikugambwa by'Orungyereza byonka nibihindurwa kuba ebigambo.
addons_bundled_off=Bije na fayiro ya modeli za Trawl, ei kompyuta egi etakiine. Yongyereho fayiro ya modeli esembayo ebirikugambwa bitandike kukora.
addons_add_from_file=Toorana fayiro…
addons_look_in_downloads=Reeba omu Downloads
addons_remove_body=Eki nikihamu %1$s kandi kikiziimya. Ebiriho ebyakozirwe nibishangurwa, kandi noobaasa kugiteekaho obundi obwire bwona.
addons_found_one=Hazoorwa %1$s omu Downloads.
addons_found_other=Hazoorwa fayiro %1$s omu Downloads ezirikubaasa kuba ekyongyerwaho eki.
addons_declined=Wahire ekyongyerwaho eki. Trawl teriikigarukamu yenyini.
addons_checked=Buri fayiro nekeberwa aha saini nari ekimanyiso ekitahinduka kitakakozesibwa. Fayiro etakwatana nezemerwa.
