leave_body_one=Fayiro egi emanyisiibwe nk'ey'obusherekyerize. Kugikopera, kugigabanisa nari kugiguruha omu app endi nikigireeta hanze y'ekikingi kya Trawl.
leave_body_other=Fayiro %1$s omuri ezi zimanyisiibwe nk'eza obusherekyerize. Kuzikopera, kuzigabanisa nari kuziguruha omu app endi nikizireeta hanze y'ekikingi kya Trawl.
leave_confirm=Gumizamu
leave_cancel=Reka
lock_offer_title=Kinga Trawl nayo?
lock_offer_body=Omanyisiize fayiro nk'ey'obusherekyerize. Ekikingi kya app nikisherekera ebyazoorwa byaawe inyuma y'okuguruha kwa kompyuta yaawe nari ekigambo ky'ekyama yaaba oyetaire. Nikisherekera aha kureeba byonka. Tikihisha kintu kyona.
lock_offer_set=Teekateeka ekikingi
lock_offer_later=Ti hati
settings_privacy_intro=Toorana ebi Trawl eshereka n'oweikirwe kureeba ebyazoorwa byaawe. Tihariho ekirugayo aha kompyuta egi.
privacy_lock_label=Ekikingi kya app
