settings_recordings_hint=Amajwi agitsirwe, ebitsirwe n'amajwi g'omu vidiyo. Ebigambo by'Orungyereza byonka nibihindurwa ebigambo ebyandiikire.
settings_media_no_ffmpeg=Vidiyo n'amajwi agitsirwe nibyetaaga ffmpeg, kandi teri aha kompyuta egi. Giteekeho (nka: sudo apt install ffmpeg) Trawl etandike kubishoma.
settings_media_no_decoder=Kompyuta egi teine eky'okuguruha vidiyo n'amajwi agitsirwe ah'ebya Trawl. Bisigara omu lukalala, kyonka nibirekwa.
settings_media_no_speech=Modeli z'ebirikugambwa tizirateekwaho, n'ahabw'ekyo amajwi agitsirwe n'amajwi g'omu vidiyo nibizoorwa ahabw'ebimanyiso by'amajwi byonka. Teekaho fayiro ya modeli ya Trawl esembayo kuguruha ebirikugambwa.
settings_storage_media=N'ebindi: %1$s, %2$s
settings_heic_missing_linux=Kompyuta egi teguruha bishushani bya HEIC, HEIF nari AVIF (ebi simu nyingi na iPhone zikora), n'ahabw'ekyo Trawl nizizoora ahabw'eiziina ryazo byonka. Kukiriza, teekaho libheif (poguramu ya heif-convert, ey'orundi eri omu paakeji libheif-examples) nari ImageMagick eine HEIC, reero otandike Trawl obundi.
settings_heic_missing_windows=Kompyuta egi teguruha bishushani bya HEIC, HEIF nari AVIF (ebi simu nyingi na iPhone zikora), n'ahabw'ekyo Trawl nizizoora ahabw'eiziina ryazo byonka. Kukiriza, yongyeraho HEIF Image Extensions ya Microsoft ey'obuhene ey'omu Microsoft Store, reero otandike Trawl obundi.
settings_kinds_all_off=Buri kimwe kiziimirwe, n'ahabw'ekyo Trawl teshoma kandi tezoora kintu. Teekaho kimwe kusherura obundi.
settings_excluded_add=Yaara foluda
settings_excluded_pick=Toorana foluda y'okuyaara
settings_excluded_not_inside=Toorana foluda eri omuri emwe washerura.
settings_excluded_is_chosen=Foluda egyo yoona neesherurwa. Koresa Ihaho haguru kureka kugishoma.
settings_excluded_not_folder=Egyo ti foluda.
learn_speed_title=Esipiidi y'omurimo
learn_gentle_hint=Emigaso y'ekyokushoma mike, kandi tihariho kushoma kompyuta egi yaaba eri aha betiri. Ebbugumu n'oruyoogaano rw'ekipepe nkye; ebihyaka nibitegyereza chaaja.
learn_balanced_hint=Omuringo gw'abantu bona: injini neetoorera esipiidi yayo, kompyuta yaaba eri aha betiri nari ndagi.
learn_fast_hint=Neha omurimo emigaso y'ekyokushoma nyingi nk'ezirikuyamba, n'aha betiri. Ebugumira kandi eyoogana munonga, kandi aha kompyuta ezimwe tikira Ahagati.
settings_speed_rate_one=Obwire obu: nka fayiro %1$s omu dakiika.
settings_speed_rate_other=Obwire obu: nka fayiro %1$s omu dakiika.
pause_not_charging_detail=Esipiidi Empora neeshoma kompyuta egi yaaba eri aha muriro byonka. Okusherura nikukora omu bwire obu.
settings_storage_cache=Ekyokubika kya injini
settings_storage_files=Fayiro Trawl eyetegyereza: %1$s, %2$s, %3$s
settings_delete_hint=Neihaho olukalala Trawl yaatungire aha fayiro zaawe: amaziina gazo, ebigambo omuri ebyandiikwa byaawe, ebigambo ebyashomirwe omu bishushani n'ebi AI yaahandiikire aha fayiro yoona. Fayiro zaawe, entebeekanisa zaawe (hamwe na foluda ezirekirwe) na modeli tibikwataho. Trawl neegaruka kushoma foluda zaawe kuruga aha kutandika.
settings_language_system=Kurikira kompyuta yange
settings_startup_title=Kutandika
settings_startup_label=Tandika Trawl nyine kwingira
settings_startup_hint=Eri off ku otagiteekaho. Trawl neeguruha idirisa ryayo noyingira omu kompyuta egi, kandi neegumizamu kushoma foluda zaawe kuruga aho.
settings_startup_failed=Kompyuta egi etaareketire Trawl kuhindura ekyo. Tihariho kyahindwirwe.
settings_report_hint=Nikopera alipoota ngufu aha clipboard: emiringo ya Trawl na sisitemu, obunene bwa kompyuta egi, ebibalirwa bya fayiro, obuhango bw'olukalala, esipiidi y'okushoma yasembayo n'ensobi zisembayo. Teine mazina ga fayiro, foluda nari ebigambo ebiri omu fayiro zaawe, kandi tihariho kirikutumwa. Kiteeke ahu orikuranga oburemeezi.
settings_report_copy=Kopera alipoota y'okukebera
settings_report_copied=Okopere alipoota y'okukebera. Tihariho kyatumirwe.
settings_report_copy_failed=Kompyuta egi etaareketire Trawl kuhika aha clipboard yaayo.
settings_report_logs=Igura foluda ya lokigi
settings_report_logs_failed=Tikibaasikire kuguruha foluda ya lokigi.
settings_about_runtime=Java runtime: %1$s
settings_about_model=Okusherura nikukora aha EmbeddingGemma 2 ya Google (Apache 2.0), aha kompyuta egi yoona.
licences_intro=%1$s yakozirwe aha murimo ogu hansi. Ebigambo ebi nibyetaagisa n'amateeka g'orukusa, kandi niyo nzira y'okwebaza.
licences_section_components=Ebindi byona omuri %1$s
licences_includes=Ebitabo bya koodi: %1$s
dialog_remove_folder_title=Reka kusherura foluda egi?
dialog_remove_folder_body=Trawl neeba ebi yaayegire aha %1$s. Fayiro zenyini tizirikukwataho.
dialog_remove_confirm=Reka kugisherura
dialog_forget_title=Eba byona?
dialog_forget_body=Trawl neishangura ebi yaayegire kandi egaruke kushoma foluda zaawe kuruga aha kutandika. Fayiro zaawe tizirikukwataho.
dialog_forget_confirm=Gieba
lock_scope_does=Ekikingi nikisherekera ebyazoorwa byaawe n'ebirikuboneka aha skrini kuhikya ogiguruhire.
lock_scope_doesnt=Tikihisha kintu kyona. Omuntu yoona arikubaasa kuguruha fayiro za kompyuta egi nakyabaasa kushoma olukalala, entebeekanisa za Trawl na fayiro zaawe. Ahabw'ekyo, teekaho okuhisha disiki ya kompyuta yaawe (FileVault, BitLocker nari LUKS).
