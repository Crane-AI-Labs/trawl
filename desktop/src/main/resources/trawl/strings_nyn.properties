first_models_title=Modeli
first_models_body=Trawl neetaaga fayiro ya modeli kwetegyereza ebishushani n'amakuru. Ni fayiro y'emwe esainiirwe esimu erikukozesa. Trawl teriine ekirikuhanura: ogitunga n'eburaawuza yaawe, Trawl ekabanza kukebera esaini yaayo.
first_models_found=Hazoorwa %1$s omuri %2$s (%3$s).
first_models_none=Tihazoirwe fayiro ya modeli omu Downloads. Hanura trawl-models.zip, nari otoorane fayiro eyahairwe.
first_models_none_named=Tihazoirwe fayiro ya modeli omu Downloads. Hanura %1$s, nari otoorane fayiro eyahairwe.
models_choice_standard_body=Okusherura okurungi omu ndimi zoona, n'ebirikugambwa omu vidiyo n'amajwi agitsirwe.
models_choice_save_body=Ebyandiikwa n'ebishushani bya skrini nibizoorwa kurungi nka kimwe omu Orungyereza. Ebishushani nibizoorwa ahabw'ebigambo ebiri omuri byonka, ti ahabi birikworeka, n'ahabw'ekyo ekishushani ekitaine bigambo kizoorwa ahabw'eiziina ryakyo byonka. Okusherura omu Oruganda n'Oruswahiri kwakyendeera, kandi tihaine ebirikugambwa omu vidiyo nari amajwi agitsirwe. Noobaasa kwongyeraho ebindi bwanyima.
models_installed_standard=Modeli za Standard: okusherura okurungi omu ndimi zoona, hamwe n'ebirikugambwa omu vidiyo n'amajwi agitsirwe.
models_installed_save=Modeli za Okutaasa data: ebyandiikwa n'ebishushani bya skrini nibizoorwa kurungi nka Standard omu Orungyereza. Ebishushani nibizoorwa ahabw'ebigambo ebiri omuri, ti ahabi birikworeka. Okusherura omu Oruganda n'Oruswahiri kwakyendeera, kandi tihaine ebirikugambwa omu vidiyo nari amajwi agitsirwe.
models_upgrade_note=Kutunga modeli za Standard (%1$s MB), tunga trawl-models.zip oyitoorane hanu. Olukalala rwa fayiro ruguma: okusherura ahabw'eiziina rya fayiro nikugumizamu kukora. Ebigambo omuri ebyandiikwa n'ebishushani, n'okusherura ahabw'amakuru, nibigaruka fayiro buri imwe yaaba eshomwa obundi.
models_upgraded=Modeli za Standard ziteekwaho. Trawl hati neegaruka kushoma fayiro zaawe n'emodeli erikukira. Amaziina ga fayiro nigagumizamu kukora; ebigambo omuri ebyandiikwa n'ebishushani nibigaruka fayiro yaaba eshomwa.
first_zip_question=Shangura %1$s hati? Eri %2$s kandi Trawl teriyetaaga obundi. Noobaasa kugihanura obundi bwanyima.
first_zip_delete=Gishangure
first_zip_keep=Girekyeho
first_zip_deleted=Yashangurwa %1$s, hakwigwa omwanya gwa %2$s.
first_zip_delete_failed=Trawl terabaasize kushangura %1$s. Noobaasa kugishangura wenyini.
first_models_ready=Modeli ziteekwaho. Trawl neshoma ebishushani n'ebyandiikwa ahabw'amakuru.
first_models_installing=Kukebera n'okuteekaho %1$s ahari %2$s
first_addons_body=Ebi nibiheesa Trawl kukora kurungi kyonka tibirikwetaagisa. Nka modeli, buri kimwe ni fayiro eyo oteekateeka ogikopere aha kompyuta egi.
first_addons_skip=Bireke hati. Noobaasa kwongyeraho ekyosiima bwanyima omuri Entebeekanisa.
first_models_skip_note=Noobaasa kutandika otaine modeli. Okusherura kwija kukora aha maziina n'ebigambo, n'amakuru gatandike ku wamala kuzongyeraho.
first_start_hint=Toorana foluda emwe nari kukira kutandika.
