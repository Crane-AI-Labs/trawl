addon_problem_not_found=Trawl terabaasize kuzoora ekyongyerwaho eki omu Downloads. Gikopere aho, nari ogitoorane, reero oteeraho obundi.
addon_problem_bad_files=Fayiro ehendekire nari ti yo, n'ahabw'ekyo Trawl terigikozesize. Gikopere obundi, reero oteeraho obundi.
