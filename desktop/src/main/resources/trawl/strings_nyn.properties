lock_wait=Wateeriho emirundi nyingi. Teeraho obundi omu sekondi %1$s.
lock_not_set=Tihariho kigambo ky'ekyama. Ziimya ekikingi, reero okiteekeho obundi omuri Entebeekanisa, Obusherekyerize.
