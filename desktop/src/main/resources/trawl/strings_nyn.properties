welcome_point_private_title=Neguma aha kompyuta egi
welcome_point_private_body=AI eyetegyereza fayiro zaawe nekora hanu. Trawl terikwegyendera aha intaneeti: tihariho akaunti, obuhyaka, nari okukonda.
