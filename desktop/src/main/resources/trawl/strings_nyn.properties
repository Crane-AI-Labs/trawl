demo_aria=Trawl, nisherura aha kompyuta. Ekijaguzo ky'okuzaarwa nikizoora ebishushani bisatu by'okuzaarwa: keeki, omukazi n'ab'omuka ye, n'omusaija aha kijaguzo. Ekigambo ky'ekyama kya wifi nikizoora ekishushani kya skrini ky'okuseruliza hamwe n'ekigambo ky'ekyama kya wifi. Risiiti kuruga aha dduuka ry'esimu nikizoora risiiti ya PDF. Vidiyo y'embwa erikusekyesa nikizoora vidiyo ibiri z'embwa. Ejwi eritsirwe aha kodi y'enju nikizoora ejwi eritsirwe, aha 0:42.
