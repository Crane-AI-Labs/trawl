privacy_os_unavailable=%1$s teteekirweho aha kompyuta egi, n'ahabw'ekyo ekigambo ky'ekyama nikikozesibwa.
privacy_os_none=Kompyuta egi teine okuguruha kw'ekikumu nari ekyoyo ekya Trawl ekibaasa kukoresa hanu, n'ahabw'ekyo ekikingi nikikozesa ekigambo ky'ekyama.
privacy_pass_new=Ekigambo ky'ekyama ekihyaka
privacy_pass_again=Kihandiike obundi
privacy_pass_min=Koresa byonka obuhandiiko %1$s nari kukira.
privacy_pass_mismatch=Ebi bibiri tibikwatana.
privacy_pass_blank=Ekigambo ky'ekyama tikibaasa kuba emyanya yonka.
privacy_pass_forgot=Trawl tebaasa kugarura ekigambo ky'ekyama ekyerebiirwe. Waakibura, shangura fayiro privacy.json omu foluda ya data ya Trawl: eyo neihaho ekikingi n'ebimanyiso by'obusherekyerize. Fayiro zaawe n'olukalala tibikwataho.
privacy_need_proof=Banza oguruhe kuhindura ekikingi.
privacy_blur_label=Huumika ebishushani ebirikureebeka nk'eby'obusherekyerize
privacy_blur_hint=Ekishushani nikihuumikwa omu lukalala n'omu kureebaho kuhikya okyoreka. Kigumaho omu byazoorwa byaawe n'omu mutindo gwabyo.
privacy_blur_needs_pack=Yongyeraho Ekibinja kya Obusherekyerize omu Byongyerwaho kukiteekaho.
privacy_capture_label=Teeka Trawl hanze y'ebishushani bya skrini n'okugabana skrini
privacy_capture_hint_windows=Trawl yaaba eri kworeka ebyesherekere nari eby'obusherekyerize, Windows nikisabwa kuteeka idirisa hanze y'ebishushani bya skrini n'okugabana skrini (emiringo ehyakare nigyoreka nk'ekyanya ekiragura).
privacy_capture_hint_mac=Trawl yaaba eri kworeka ebyesherekere nari eby'obusherekyerize, macOS nikisabwa kuteeka idirisa hanze y'ebishushani bya skrini. Ebikozesebwa ebimwe nibikyabaasa kuriireeba.
privacy_capture_hint_linux=Linux tiha apps ngira eyesigwa y'okukora ekyo, n'ahabw'ekyo Trawl terageza.
privacy_marked_one=Fayiro %1$s emanyisiibwe nk'ey'obusherekyerize.
privacy_marked_other=Fayiro %1$s zimanyisiibwe nk'eza obusherekyerize.
privacy_damaged=Trawl terabaasize kushoma entebeekanisa zaayo z'obusherekyerize, n'ahabw'ekyo yatandikire obundi: ekikingi tikiri aha kandi tihariho kimanyisiibwe.
privacy_recovered=Entebeekanisa za Trawl z'obusherekyerize zahendekire. Zagarurwa kuruga aha kopi ya mazima esembayo.
privacy_folders_hint=Ebishushani ebiri omu foluda ezi nibireebwa buri bwire nk'eby'obusherekyerize.
privacy_folders_empty=Tihariho foluda y'obusherekyerize hati.
privacy_folders_add=Yongyeraho foluda y'obusherekyerize
privacy_folders_pick=Toorana foluda y'okugumisa nk'ey'obusherekyerize
privacy_folders_bad=Toorana foluda eri omuri emwe Trawl erikusherura. Kureka kusherura foluda yoona, giihe omuri Foluda.
privacy_folders_invalid=Eryo ti izina rya foluda ei kompyuta egi eshobora kushoma. Toorana foluda omu rukalala.
report_card_title=Trawl yahweire butunguuru. Kiranga?
report_card_body=Alipoota teine mazina ga fayiro, okusherura nari ebigambo bya fayiro zaawe. Wowe obanza kugishoma. Tihariho kirikutumwa: wakikopere nari okitereke, kandi wowe okitume.
report_card_not_now=Ti hati
settings_report_open_hint=Netungisa alipoota eyoobaasa kushoma, reero okopere nari oterekere. Eine emiringo ya Trawl na sisitemu, obunene bwa kompyuta egi, ebibalirwa, entebeekanisa nka nikora nari tikora, n'ebimanyiso by'ensobi bitaine bigambo byazo. Tihariho kirikutumwa.
report_hint=Ebi nibyo byona alipoota eine. Fayiro zaawe, foluda nari okusherura kwaawe tibiri omuri.
report_note_hint=Ekigambo kyaawe nikiteekwamu nk'oku wakiranga, n'ahabw'ekyo oreke ekyesherekire kyona. Ekirikureebeka nka ngira ya fayiro kiihwaho.
report_copy=Kopera alipoota
report_copied=Alipoota ekoperwa. Tihariho kyatumirwe.
report_copy_failed=Kompyuta egi etaareketire Trawl kuhika aha clipboard yaayo. Koresa Terekera.
report_mail=Igura imeeri
report_mail_lead=Alipoota yoona eri aha clipboard yange. Nyija kugiteeka hansi y'olunyiriri oru.
report_mail_opened=Nkopere alipoota kandi ngurure app yaawe ya imeeri. Giteeke omu imeeri, reero ogitume wenyini. Trawl tetumire kintu.
report_mail_opened_not_copied=Ngurure app yaawe ya imeeri, kyonka kompyuta egi etaareketire Trawl kuhika aha clipboard yaayo. Koresa Terekera nka fayiro oyiteekeho.
report_mail_failed=Trawl terabaasize kuguruha app ya imeeri. Alipoota ekoperwe clipboard yaaba yaareka: giteeke omu imeeri eri aha %1$s.
report_save=Terekera nka fayiro
report_saved=Alipoota eterekirwe. Tihariho kyatumirwe.
report_save_failed=Trawl terabaasize kuterekera alipoota aho.
report_send_to=Kugitumira, teekaho fayiro nari giteeke ebigambo omu imeeri eri aha %1$s.
report_kept=Trawl eterekera alipoota 10 z'okuhweera aha kompyuta egi, nka KB 100. "Eba byona" neizishangura.
report_logs=Igura foluda ya lokigi
addons_intro=Ebyongyerwaho by'okwesima ebiheesa Trawl kukora kurungi. Trawl terikwegyendera aha intaneeti, n'ahabw'ekyo buri kimwe ni fayiro oteekateeka ogikopere aha kompyuta egi. Downloads nigyo foluda ey'orundi. Byona nibiguma aha kompyuta egi.
addon_privacy_name=Ekibinja kya Obusherekyerize
addon_privacy_benefit=Nihuumika ebishushani ebirikureebeka nk'eby'obusherekyerize kuhikya otoorane kubyoreka.
addon_privacy_cost=%1$s aha kompyuta egi. Teetaaga intaneeti waamara kutunga fayiro.
addon_speech_name=Ebirikugambwa
