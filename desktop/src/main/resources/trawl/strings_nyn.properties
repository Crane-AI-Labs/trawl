blocked_fix_mac=Kureka Trawl eyingire, igura System Settings, reero Privacy & Security, reero Files & Folders (nari Full Disk Access), otekeho Trawl. Reero toorana Reeba obundi.
blocked_fix=Kureka Trawl eyingire, hindura obushoboorozi bwa foluda ezo kugira akaunti yaawe ebaase kuziguruha. Reero toorana Reeba obundi.
