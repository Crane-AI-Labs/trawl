blocked_fix_mac=Okuleka Trawl eyingire, ggulawo System Settings, oluvannyuma Privacy & Security, oluvannyuma Files & Folders (oba Full Disk Access), olyoke ozuukize Trawl. Oluvannyuma londa Kebera nate.
blocked_fix=Okuleka Trawl eyingire, kyusa olukusa lwa ffolda ezo akawunti yo eziggulewo. Oluvannyuma londa Kebera nate.
blocked_other_one=Ffolda %1$s tesobose kuggulwawo kaakano (drive eggiddwawo, oba netiwaaka eyagwa). Trawl ekuuma bye yamanya ku yo era ejikebera nate ku kukebera okuddako.
blocked_other_other=Ffolda %1$s tezisobose kuggulwawo kaakano (drive eggiddwawo, oba netiwaaka eyagwa). Trawl ekuuma bye yamanya ku zo era ezikebera nate ku kukebera okuddako.
