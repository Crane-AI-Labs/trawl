privacy_capture_hint_windows=Trawl bw'eraga ebikisiddwa oba eby'ekyama, Windows eragirwa okukweka ddirisa mu sikrinsyoti ne mu kugabana sikirini (enkyusa enkadde ziriraga nga ekkoona eddugavu).
privacy_capture_hint_mac=Trawl bw'eraga ebikisiddwa oba eby'ekyama, macOS eragirwa okukweka ddirisa mu sikrinsyoti. Ebikozesebwa ebimu bikyalyalaba.
privacy_capture_hint_linux=Linux tewa app ngeri esobola okwesigibwa kukola kino, n'olwekyo Trawl tegezaako.
