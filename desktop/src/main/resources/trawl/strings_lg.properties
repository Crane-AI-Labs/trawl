learn_speed_title=Sipiidi y'omulimu
learn_gentle_hint=Emisoso gya purosesa mitono, era tewali kusoma kompyuta eno ng'eri ku batule. Bbugumu ne ddoboozi lya fan bitono; ebipya birindirira caaja.
learn_balanced_hint=Mu ngeri eya bulijjo: enkola yeerondera sipiidi yaayo, ku batule oba si ku batule.
learn_fast_hint=Ewa omulimu emisoso gya purosesa mingi nga bwe giyamba, ne ku batule. Ebugumya era ewulikika nnyo, ate ku kompyuta ezimu teyisa Wakati.
