welcome_point_private_title=Zisigala ku kompyuta eno
welcome_point_private_body=AI etegeera fayiro zo ekolera wano. Trawl tegatta ku yintaneeti: tewali akawunti, tewali kuvugirira, tewali kukuyigga.
