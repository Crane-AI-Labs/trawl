settings_speed_rate_other=Mu kiseera kino: nga fayiro %1$s mu ddakiika.
pause_not_charging_detail=Sipiidi Mpola esoma kompyuta eno yokka ng'eri ku caaja. Okunoonya kukola mu kiseera ekyo.
