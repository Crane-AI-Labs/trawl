privacy_pass_forgot=Trawl tesobola kuzzaawo kigambo eky'ekyama ekyerabiddwa. Bw'okiggwaamu, sangula fayiro privacy.json mu ffolda ya data eya Trawl: kiggyawo okusiba n'obubonero bw'ekyama. Fayiro zo n'okwekenneenya tebikkwatibwako.
