demo_aria=Trawl, enoonya ku kompyuta. Embaga y'amazaalibwa ezuula ebifaananyi bisatu: keeki, omukazi n'ab'omu maka ge, n'omusajja ku mbaga. Password ya wifi ezuula sikrinsyoti ya cati erimu netiwaaka ne password. Risiiti okuva mu dduuka ly'essimu ezuula risiiti eya PDF. Vidiyo y'embwa ez'enseko ezuula vidiyo bbiri ez'embwa. Eddoboozi ku kisale ky'ennyumba lizuula eddoboozi, ku 0:42.
