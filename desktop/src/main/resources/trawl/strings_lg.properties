report_mail_lead=Lipoota yonna eri ku clipboard yange. Nja kugipaste wansi w'olunyiriri luno.
report_mail_opened=Lipoota ekoppeddwa era app yo ya email eggulwawo. Paste lipoota mu email, olyoke ogisindike wekka. Trawl tesindise kintu.
