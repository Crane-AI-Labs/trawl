pause_no_permission_detail_mac=macOS yabuuza oba Trawl esobola okutunula mu ffolda zo, n'eddamu yali nedda. Ggulawo System Settings, oluvannyuma Privacy & Security, oluvannyuma Files & Folders, olyoke ozuukize Trawl. Okusoma kugenda mu maaso kwokka. Okunoonya kukyakola.
