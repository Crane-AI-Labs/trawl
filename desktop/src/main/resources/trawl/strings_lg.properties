addons_intro=Ebyongerwako eby'okwerondera ebifuula Trawl ennungi. Trawl tegenda ku yintaneeti, n'olwekyo buli kimu ye fayiro gy'osooka okukoppa ku kompyuta eno. Downloads y'ekifo ekya bulijjo. Buli kimu kisigala ku kompyuta eno.
