report_card_not_now=Si kaakano
settings_report_open_hint=Ekola lipoota gy'osobola okusoma, n'ogikoppa oba ogitereka. Erimu enkyusa za Trawl n'enkola, obunene bwa kompyuta eno, omuwendo, enteekateeka nga zikola oba tezikola, n'ebiwandiiko by'ebikyamu nga tebirina bubaka. Tewali kisindikibwa wonna.
report_hint=Kino kye kiri mu lipoota yonna. Fayiro zo, ffolda n'ebyo by'onoonya tebirimu.
report_note_hint=Ekiwandiiko kyo kigattibwamu nga bwe kiri, n'olwekyo ssaamu eby'ekyama. Ekintu kyonna ekifaanana ng'ekkubo lya fayiro kiggyibwamu.
report_copy=Koppa lipoota
report_copied=Lipoota ekoppeddwa. Tewali kisindikiddwa wonna.
