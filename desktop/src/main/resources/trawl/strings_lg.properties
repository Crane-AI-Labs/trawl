first_models_title=Modeli
first_models_body=Trawl yeetaaga fayiro ya modeli okutegeera ebifaananyi n'amakulu. Y'emu fayiro eriko omukono essimu gy'ekozesa. Trawl tewanula kintu kyonna: ofuna fayiro mu bulawuza bwo, Trawl n'ekebera omukono gwayo nga tennagikozesa.
first_models_found=Ezudde %1$s mu %2$s (%3$s).
first_models_none=Tewali fayiro ya modeli mu Downloads. Wanula trawl-models.zip, oba londa fayiro gye wafuna.
first_models_none_named=Tewali fayiro ya modeli mu Downloads. Wanula %1$s, oba londa fayiro gye wafuna.
models_choice_standard_body=Okunoonya okusinga mu nnimi zonna, n'ebyogerebwa mu vidiyo ne mu maloboozi.
models_choice_save_body=Ebiwandiiko ne sikrinsyoti bizuulibwa bulungi kyenkana mu Lungereza. Ebifaananyi bizuulibwa mu bigambo ebibirimu byokka, so si mu bye biraga, n'olwekyo ekifaananyi ekitaliiko bigambo kizuulibwa mu linnya lyakyo lyokka. Okunoonya mu Oluganda n'Oswahiri kunafuye, era tewali byogerebwa mu vidiyo wadde mu maloboozi. Ebisigadde osobola okubyongerako oluvannyuma.
models_installed_standard=Modeli eza bulijjo: okunoonya okusinga mu nnimi zonna, n'ebyogerebwa mu vidiyo ne mu maloboozi.
models_installed_save=Modeli z'Okukekkereza data: ebiwandiiko ne sikrinsyoti bizuulibwa bulungi nga mu eza bulijjo mu Lungereza. Ebifaananyi bizuulibwa mu bigambo ebibirimu, so si mu bye biraga. Okunoonya mu Oluganda n'Oswahiri kunafuye, era tewali byogerebwa mu vidiyo wadde mu maloboozi.
models_upgrade_note=Okufuna modeli eza bulijjo (%1$s MB), funa trawl-models.zip ogironde wano. Olukalala lwa fayiro lusigalawo: okunoonya mu linnya lya fayiro kukyakola mu kiseera ekyo. Ebigambo ebiri mu biwandiiko ne mu bifaananyi, n'okunoonya okusinziira ku makulu, biddawo fayiro bw'esomebwa nate.
models_upgraded=Modeli eza bulijjo ziteekeddwamu. Kati Trawl esoma fayiro zo nate ne modeli esinga obulungi. Amannya ga fayiro gakyakola mu kiseera ekyo; ebigambo ebiri mu biwandiiko ne mu bifaananyi biddawo fayiro we zisomebwa.
first_zip_question=Osangule %1$s kaakano? Nnene %2$s era Trawl tekyagyetaaga. Osobola okugiwanula nate oluvannyuma.
first_zip_delete=Gisangule
first_zip_keep=Gireke
first_zip_deleted=%1$s esangiddwa era kifunye ekifo kya %2$s.
first_zip_delete_failed=Trawl tesobodde kusangula %1$s. Osobola okugisangula wekka.
first_models_ready=Modeli ziteekeddwamu. Trawl esoma ebifaananyi n'ebiwandiiko okusinziira ku makulu.
first_models_installing=Ekebera era eteekamu %1$s ku %2$s
first_addons_body=Bino bifuula Trawl ennungi naye si bya kwetaagisa. Nga modeli, buli kimu ye fayiro gy'osooka okukoppa ku kompyuta eno.
first_addons_skip=Bireke kaakano. Osobola okubyongerako oluvannyuma mu Nteekateeka.
