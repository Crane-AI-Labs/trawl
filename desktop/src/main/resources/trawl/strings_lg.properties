privacy_marked_other=Fayiro %1$s zirina akabonero ak'ekyama.
privacy_damaged=Trawl tesobodde kusoma nteekateeka zaayo ez'ekyama, n'olwekyo etandise buggya: okusiba tekukola era tewali kiriko kabonero.
privacy_recovered=Enteekateeka za Trawl ez'ekyama zaali zonoonese. Zizziddwawo okuva ku kopi esembayo ennungi.
