settings_storage_files=Fayiro Trawl z'emanyi: %1$s, %2$s, %3$s
settings_delete_hint=Esangula okwekenneenya Trawl kwe yakola ku fayiro zo: amannya gaazo, ebigambo ebiri mu biwandiiko byo, ebigambo ebisomeddwa mu bifaananyi, n'ebyo AI bye yeetegereza ku buli fayiro. Fayiro zo, enteekateeka zo (ffolda ezibuusiddwa nazo) ne modeli tebikkwatibwako. Oluvannyuma Trawl esoma ffolda zo nate okuva ku ntandikwa.
