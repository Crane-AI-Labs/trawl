settings_startup_label=Tandika Trawl bwe nnyingira
settings_startup_hint=Tekikola okuggyako ng'okizizzaamu. Trawl eggulawo ddirisa lyayo bw'oyingira ku kompyuta eno, n'weyongera okusoma ffolda zo okuva awo.
settings_startup_failed=Kompyuta eno tekkirizza Trawl kukyusa ekyo. Tewali kikyusiddwa.
settings_report_hint=Ekoppa lipoota ey'ekimpimpi mu clipboard: enkyusa za Trawl n'enkola, obunene bwa kompyuta eno, omuwendo gwa fayiro, obunene bw'okwekenneenya, sipiidi y'okusoma esembayo n'ebikyamu ebisembayo. Terina mannya ga fayiro, mannya ga ffolda wadde ebigambo ebiva mu fayiro zo, era tewali kisindikibwa wonna. Lipaste gy'ofuna ekizibu.
