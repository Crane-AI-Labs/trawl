settings_recordings_hint=Amaloboozi, ebikwatiddwa n'eddoboozi ly'ewa vidiyo. Olungereza lwokka lwe luvvuunulwa okufuuka ebigambo.
settings_media_no_ffmpeg=Vidiyo n'amaloboozi byetaaga ffmpeg, era tekiteekeddwa ku kompyuta eno. Giteekemu (okugeza: sudo apt install ffmpeg) Trawl etandike okubisoma.
settings_media_no_decoder=Kompyuta eno terina ngeri Trawl gy'eyinza okuggulamu vidiyo n'amaloboozi. Bisigala ku lukalala naye bibuuka.
settings_media_no_speech=Modeli z'ebyogerebwa tezinnateekebwamu, n'olwekyo amaloboozi n'eddoboozi lya vidiyo bizuulibwa mu bubonero bw'amaloboozi bwokka. Teekamu fayiro ya modeli eya Trawl esinga obuggya okuggulawo ebyogerebwa.
settings_storage_media=Era: %1$s, %2$s
settings_heic_missing_linux=Kompyuta eno tesobola kuggulawo bifaananyi bya HEIC, HEIF oba AVIF (ebika essimu nnyingi ne iPhone by'ekola), n'olwekyo Trawl esobola okubizuula mu mannya gokka. Okubikola, teekamu libheif (porogulaamu ya heif-convert, emirundi mingi mu kibinja libheif-examples) oba ImageMagick ewagira HEIC, olyoke otandike Trawl nate.
settings_heic_missing_windows=Kompyuta eno tesobola kuggulawo bifaananyi bya HEIC, HEIF oba AVIF (ebika essimu nnyingi ne iPhone by'ekola), n'olwekyo Trawl esobola okubizuula mu mannya gokka. Okubikola, yongerako HEIF Image Extensions eza Microsoft ez'obwereere okuva mu Microsoft Store, olyoke otandike Trawl nate.
settings_kinds_all_off=Byonna bizikiddwa, n'olwekyo Trawl tesoma wadde okuzuula kintu. Koleeza ekimu okunoonya nate.
