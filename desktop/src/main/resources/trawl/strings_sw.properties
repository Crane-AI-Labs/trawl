pause_storage_low=Nafasi ya diski inakaribia kujaa
pause_storage_low_detail=Trawl inahitaji nafasi kidogo ili kuhifadhi faharasa yake. Pata nafasi zaidi nayo itaendelea yenyewe. Utafutaji bado unafanya kazi.
pause_no_permission=Inahitaji ufikiaji wa folda zako
pause_no_permission_detail=Kompyuta hii haiiruhusu Trawl kuangalia ndani ya folda ulizochagua. Ruhusu, na usomaji utaendelea wenyewe. Utafutaji bado unafanya kazi kwa kile Trawl ilichojifunza.
pause_no_permission_detail_mac=macOS iliuliza kama Trawl inaweza kuangalia ndani ya folda zako, na jibu lilikuwa hapana. Fungua System Settings, kisha Privacy & Security, kisha Files & Folders, na uwashe Trawl. Usomaji utaendelea wenyewe. Utafutaji bado unafanya kazi.
blocked_system_one=Folda %1$s ndani ya folda ulizochagua imefungwa kwa Trawl (%2$s), kwa hivyo Trawl inairuka. Hakuna kilichomo kinachoondolewa kwenye utafutaji, na kilichobaki kinasomwa kama kawaida.
blocked_system_other=Folda %1$s ndani ya folda ulizochagua zimefungwa kwa Trawl (%2$s), kwa hivyo Trawl inaziruka. Hakuna kilichomo kinachoondolewa kwenye utafutaji, na kilichobaki kinasomwa kama kawaida.
blocked_fix_mac=Ili kuiruhusu Trawl iingie, fungua System Settings, kisha Privacy & Security, kisha Files & Folders (au Full Disk Access), na uwashe Trawl. Kisha chagua Changanua tena.
blocked_fix=Ili kuiruhusu Trawl iingie, badilisha ruhusa za folda hizo ili akaunti yako iweze kuzifungua. Kisha chagua Changanua tena.
blocked_other_one=Folda %1$s haikuweza kufunguliwa sasa hivi (diski iliyoondolewa, au mtandao wa pamoja uliokatika). Trawl inabaki na kile ilichojua kuihusu na itaangalia tena katika uchanganuzi unaofuata.
blocked_other_other=Folda %1$s hazikuweza kufunguliwa sasa hivi (diski iliyoondolewa, au mtandao wa pamoja uliokatika). Trawl inabaki na kile ilichojua kuzihusu na itaangalia tena katika uchanganuzi unaofuata.
