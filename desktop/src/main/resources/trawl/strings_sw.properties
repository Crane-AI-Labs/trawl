privacy_pass_blank=Nenosiri haliwezi kuwa nafasi tupu tu.
privacy_pass_forgot=Trawl haiwezi kurejesha nenosiri lililosahaulika. Ukilipoteza, futa faili privacy.json kwenye folda ya data ya Trawl: hilo huondoa kufunga na alama zako za unyeti. Mafaili yako na faharasa havigusiwi.
privacy_need_proof=Fungua kwanza ili kubadilisha kufunga.
