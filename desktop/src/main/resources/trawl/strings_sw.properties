settings_recordings_hint=Jumbe za sauti, rekodi na sauti ya video. Hotuba ya Kiingereza tu ndiyo hubadilishwa kuwa maneno.
settings_media_no_ffmpeg=Video na rekodi zinahitaji ffmpeg, na haijasakinishwa kwenye kompyuta hii. Isakinishe (kwa mfano: sudo apt install ffmpeg) na Trawl itaanza kuzisoma.
settings_media_no_decoder=Kompyuta hii haina njia ya kufungua video na rekodi kwa ajili ya Trawl. Zinabaki kwenye orodha na kurukwa.
settings_media_no_speech=Modeli za hotuba bado hazijasakinishwa, kwa hivyo rekodi na sauti ya video hupatikana tu kwa lebo za sauti. Sakinisha faili jipya zaidi la modeli za Trawl ili kuwasha hotuba.
settings_storage_media=Pia: %1$s, %2$s
settings_heic_missing_linux=Kompyuta hii haiwezi kufungua picha za HEIC, HEIF au AVIF (aina ambazo simu nyingi na iPhone hutengeneza), kwa hivyo Trawl inaweza kuzipata kwa jina tu. Ili kurekebisha, sakinisha libheif (programu ya heif-convert, mara nyingi kwenye kifurushi cha libheif-examples) au ImageMagick yenye usaidizi wa HEIC, kisha uanzishe Trawl upya.
settings_heic_missing_windows=Kompyuta hii haiwezi kufungua picha za HEIC, HEIF au AVIF (aina ambazo simu nyingi na iPhone hutengeneza), kwa hivyo Trawl inaweza kuzipata kwa jina tu. Ili kurekebisha, ongeza HEIF Image Extensions za bure za Microsoft kutoka Microsoft Store, kisha uanzishe Trawl upya.
settings_kinds_all_off=Kila kitu kimezimwa, kwa hivyo Trawl haisomi wala kupata chochote. Washa kimoja ili kutafuta tena.
settings_excluded_add=Ruka folda
settings_excluded_pick=Chagua folda ya kuruka
settings_excluded_not_inside=Chagua folda iliyo ndani ya moja unayoitafuta tayari.
settings_excluded_is_chosen=Folda hiyo yote inatafutwa. Tumia Ondoa hapo juu ili kuacha kuisoma.
settings_excluded_not_folder=Hiyo si folda.
learn_speed_title=Kasi ya kazi
learn_gentle_hint=Nyuzi chache za kichakataji, na hakuna kusoma kompyuta hii inapotumia betri. Joto na kelele ya feni kidogo zaidi; kila kipya kinasubiri chaja.
learn_balanced_hint=Njia ya kawaida: injini huchagua kasi yake yenyewe, ikiwa kwenye betri au la.
learn_fast_hint=Hupa kazi nyuzi nyingi za kichakataji zinavyosaidia, hata kwenye betri. Huwa na joto na kelele zaidi, na kwenye baadhi ya kompyuta si haraka kuliko Wastani.
settings_speed_rate_one=Kipindi hiki: takriban faili %1$s kwa dakika.
settings_speed_rate_other=Kipindi hiki: takriban mafaili %1$s kwa dakika.
pause_not_charging_detail=Kasi ya Taratibu husoma tu kompyuta hii ikiwa imechomekwa. Utafutaji unafanya kazi wakati huo.
settings_storage_cache=Akiba ya injini
settings_storage_files=Mafaili ambayo Trawl inayajua: %1$s, %2$s, %3$s
settings_delete_hint=Huondoa faharasa ambayo Trawl ilijenga kutoka kwenye mafaili yako: majina yake, maneno yaliyo kwenye hati zako, maandishi yaliyosomwa kwenye picha na kile AI ilichoandika kuhusu kila faili. Mafaili yako, mipangilio yako (pamoja na folda zilizorukwa) na modeli haviguswi. Kisha Trawl inasoma folda zako tena tangu mwanzo.
settings_language_system=Fuata kompyuta yangu
settings_startup_title=Kuanza
settings_startup_label=Anzisha Trawl ninapoingia
settings_startup_hint=Imezimwa isipokuwa ukiiwasha. Trawl hufungua dirisha lake unapoingia kwenye kompyuta hii, na huendelea kusoma folda zako kutoka hapo.
settings_startup_failed=Kompyuta hii haikuruhusu Trawl ibadilishe hilo. Hakuna kilichobadilishwa.
settings_report_hint=Hunakili ripoti fupi kwenye ubao wa kunakili: matoleo ya Trawl na mfumo, ukubwa wa kompyuta hii, hesabu za mafaili, ukubwa wa faharasa, kasi ya mwisho ya usomaji na makosa ya hivi karibuni. Haina majina ya mafaili, majina ya folda wala maandishi kutoka kwenye mafaili yako, na hakuna kinachotumwa popote. Ibandike mahali unaporipoti tatizo.
settings_report_copy=Nakili taarifa za uchunguzi
settings_report_copied=Taarifa za uchunguzi zimenakiliwa. Hakuna kilichotumwa popote.
settings_report_copy_failed=Kompyuta hii haikuipa Trawl ubao wake wa kunakili.
