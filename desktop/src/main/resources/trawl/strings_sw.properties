privacy_blur_needs_pack=Ongeza kifurushi cha Faragha chini ya Viongezi ili kuwasha hili.
privacy_capture_label=Weka Trawl nje ya picha za skrini na kushiriki skrini
privacy_capture_hint_windows=Trawl inapoonyesha vitu vilivyofichwa au nyeti, Windows inaombwa kuweka dirisha nje ya picha za skrini na kushiriki skrini (matoleo ya zamani huliona kama mstatili mweusi).
privacy_capture_hint_mac=Trawl inapoonyesha vitu vilivyofichwa au nyeti, macOS inaombwa kuweka dirisha nje ya picha za skrini. Baadhi ya zana bado zinaweza kuliona.
privacy_capture_hint_linux=Linux haipi programu njia ya kuaminika ya kufanya hivi, kwa hivyo Trawl haijaribu.
privacy_marked_one=Faili %1$s limewekwa alama kuwa nyeti.
privacy_marked_other=Mafaili %1$s yamewekwa alama kuwa nyeti.
privacy_damaged=Trawl haikuweza kusoma mipangilio yake ya faragha, kwa hivyo ilianza upya: kufunga kumezimwa na hakuna kilichowekwa alama.
privacy_recovered=Mipangilio ya faragha ya Trawl iliharibika. Imerejeshwa kutoka nakala nzuri ya mwisho.
privacy_folders_hint=Picha zilizo kwenye folda hizi huchukuliwa kuwa za faragha kila wakati.
privacy_folders_empty=Bado hakuna folda za faragha.
privacy_folders_add=Ongeza folda ya faragha
privacy_folders_pick=Chagua folda ya kuweka faragha
privacy_folders_bad=Chagua folda iliyo ndani ya moja ambayo Trawl inatafuta. Ili kuacha kutafuta folda nzima, iondoe chini ya Folda.
report_card_title=Trawl imesimama bila kutarajiwa. Utume ripoti?
report_card_body=Ripoti haina majina ya mafaili, utafutaji wala maandishi kutoka kwenye mafaili yako. Unaisoma kwanza. Hakuna kinachotumwa: unaikili au kuihifadhi, kisha unaituma mwenyewe.
settings_report_open_hint=Hutengeneza ripoti unayoweza kusoma, kisha kunakili au kuhifadhi. Ina matoleo ya Trawl na mfumo, ukubwa wa kompyuta hii, hesabu, mipangilio kama imewashwa au imezimwa, na ufuatiliaji wa makosa bila jumbe zake. Hakuna kinachotumwa popote.
report_hint=Hiki ndicho kila kitu ambacho ripoti inakishikilia. Mafaili yako, folda zako na utafutaji wako haviko ndani yake.
report_note_hint=Dokezo lako linajumuishwa jinsi unavyoliandika, kwa hivyo acha chochote cha faragha. Chochote chenye umbo la njia ya faili huondolewa.
report_copy=Nakili ripoti
report_copied=Ripoti imenakiliwa. Hakuna kilichotumwa popote.
report_copy_failed=Kompyuta hii haikuipa Trawl ubao wake wa kunakili. Tumia Hifadhi badala yake.
report_mail=Fungua barua pepe
report_mail_lead=Ripoti kamili iko kwenye ubao wangu wa kunakili. Nitaibandika chini ya mstari huu.
report_mail_opened=Ripoti imenakiliwa na programu yako ya barua pepe imefunguliwa. Bandika ripoti kwenye barua pepe, kisha uitume mwenyewe. Trawl haikutuma chochote.
report_mail_opened_not_copied=Programu yako ya barua pepe imefunguliwa, lakini kompyuta hii haikuipa Trawl ubao wake wa kunakili. Tumia Hifadhi kama faili kisha uliambatishe.
report_mail_failed=Trawl haikuweza kufungua programu ya barua pepe. Ripoti imenakiliwa ikiwa ubao wa kunakili uliruhusu: ibandike kwenye barua pepe kwenda %1$s.
