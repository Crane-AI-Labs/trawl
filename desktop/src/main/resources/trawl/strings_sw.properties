lock_offer_body=Uliweka alama kwenye faili kuwa nyeti. Kufunga programu huficha matokeo yako nyuma ya kufungua kwa kompyuta yako au nenosiri unapoondoka. Kunaficha mwonekano tu. Hakusimbi chochote.
