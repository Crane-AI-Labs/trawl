demo_aria=Trawl, ikitafuta kwenye kompyuta. Sherehe ya kuzaliwa inapata picha tatu za sherehe: keki, mwanamke na familia yake, na mwanamume kwenye sherehe. Nenosiri la wifi linapata picha ya skrini ya gumzo yenye mtandao na nenosiri. Risiti ya duka la simu inapata risiti ya PDF. Video ya mbwa wa kuchekesha inapata video mbili za mbwa. Ujumbe wa sauti kuhusu kodi unapata ujumbe wa sauti, saa 0:42.
refusal_not_signed=Hili si faili la modeli za Trawl: halina saini. Pakua trawl-models.zip tena.
refusal_bad_signature=Faili hili halikutiwa saini na Crane AI Labs, au lilibadilishwa baada ya kutiwa saini. Trawl haitalitumia.
refusal_bad_manifest=Faili hili la modeli ni jipya kuliko toleo hili la Trawl linavyoweza kusoma, au limeharibika.
refusal_wrong_class=Faili hili la modeli si la aina ambayo kompyuta hii inaweza kutumia.
refusal_wrong_class_lite=Hiki ni kifurushi cha Standard. Kompyuta hii ina kumbukumbu kidogo na inahitaji kifurushi kidogo.
refusal_damaged=Faili limeharibika au halijakamilika. Lipakue tena.
refusal_already_installed=Modeli hizi tayari zimesakinishwa.
refusal_older_version=Toleo jipya zaidi la modeli, au seti kamili zaidi yake, tayari limesakinishwa. Hakuna kilichobadilishwa.
refusal_no_space=Hakuna nafasi ya kutosha ya modeli.
