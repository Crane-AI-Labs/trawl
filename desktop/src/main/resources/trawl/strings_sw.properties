welcome_point_private_title=Inabaki kwenye kompyuta hii
welcome_point_private_body=AI inayoelewa mafaili yako hufanya kazi hapa. Trawl haiunganishi kamwe na intaneti: hakuna akaunti, hakuna masasisho, hakuna ufuatiliaji.
first_folders_title=Folda za kutafuta
first_folders_body=Trawl husoma tu folda unazochagua hapa. Folda zilizofichwa hazisomwi kamwe.
first_folders_missing=haipatikani kwenye kompyuta hii
first_models_title=Modeli
first_models_body=Trawl inahitaji faili la modeli ili kuelewa picha na maana. Ni faili lile lile lenye saini linalotumiwa na simu. Trawl haipakui chochote: unapata faili kwa kivinjari chako na Trawl inakagua saini yake kabla ya kulitumia.
first_models_found=Imepata %1$s katika %2$s (%3$s).
first_models_none=Hakuna faili la modeli lililopatikana kwenye Vipakuliwa. Pakua trawl-models.zip, au chagua faili ulilopewa.
first_models_none_named=Hakuna faili la modeli lililopatikana kwenye Vipakuliwa. Pakua %1$s, au chagua faili ulilopewa.
models_choice_standard_body=Utafutaji bora zaidi katika kila lugha, pamoja na maneno yaliyo kwenye video na rekodi.
models_choice_save_body=Hati na picha za skrini hupatikana vilevile kwa Kiingereza. Picha hupatikana tu kwa maneno yaliyomo, si kwa kile zinachoonyesha, kwa hivyo picha ya kawaida hupatikana kwa jina lake tu. Utafutaji wa Kiluganda na Kiswahili ni dhaifu zaidi, na hakuna maneno kutoka kwenye video wala rekodi. Unaweza kuongeza vilivyobaki baadaye.
models_installed_standard=Modeli za Standard: utafutaji bora zaidi katika kila lugha, pamoja na maneno yaliyo kwenye video na rekodi.
models_installed_save=Modeli za Okoa data: hati na picha za skrini hupatikana vilevile kama na Standard kwa Kiingereza. Picha hupatikana kwa maneno yaliyomo, si kwa kile zinachoonyesha. Utafutaji wa Kiluganda na Kiswahili ni dhaifu zaidi, na hakuna maneno kutoka kwenye video wala rekodi.
models_upgrade_note=Ili kupata modeli za Standard (%1$s MB), pata trawl-models.zip na uchague hapa. Orodha ya mafaili yako inabaki: kutafuta kwa jina la faili kunaendelea kufanya kazi wakati huo. Maneno yaliyo ndani ya hati na picha, na utafutaji kwa maana, hurudi kadiri kila faili linavyosomwa tena.
models_upgraded=Modeli za Standard zimesakinishwa. Sasa Trawl inasoma mafaili yako tena kwa modeli iliyo bora zaidi. Majina ya mafaili yanaendelea kufanya kazi wakati huo; maneno yaliyo ndani ya hati na picha hurudi kadiri mafaili yanavyosomwa.
first_zip_question=Ufute %1$s sasa? Ni %2$s na Trawl haihitaji tena. Unaweza kuipakua tena baadaye.
first_zip_delete=Lifute
first_zip_keep=Lihifadhi
first_zip_deleted=Imefuta %1$s na kupata nafasi ya %2$s.
first_zip_delete_failed=Trawl haikuweza kufuta %1$s. Unaweza kulifuta mwenyewe.
first_models_ready=Modeli zimesakinishwa. Trawl inasoma picha na hati kwa maana.
first_models_installing=Inakagua na kusakinisha %1$s kati ya %2$s
first_addons_body=Hivi huboresha Trawl lakini si lazima. Kama modeli, kila kimoja ni faili unalonakili kwenye kompyuta hii kwanza.
first_addons_skip=Ruka hivi kwa sasa. Unaweza kuongeza vyovyote baadaye kwenye Mipangilio.
first_models_skip_note=Unaweza kuanza bila modeli. Utafutaji hufanya kazi kwa majina na maneno, na maana huanza ukiziongeza.
first_start_hint=Chagua angalau folda moja ili kuanza.
