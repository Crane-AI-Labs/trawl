settings_about_model=Utafutaji unatumia EmbeddingGemma 2 ya Google (Apache 2.0), wote kwenye kompyuta hii.
licences_intro=%1$s imejengwa juu ya kazi iliyo hapa chini. Notisi hizi zinahitajika na leseni, na pia ndivyo tunavyosema asante.
licences_section_components=Kila kitu kingine katika %1$s
licences_includes=Maktaba: %1$s
dialog_remove_folder_title=Uache kutafuta folda hii?
