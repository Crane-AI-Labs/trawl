dialog_forget_body=Trawl inafuta kile ilichojifunza na kusoma folda zako tena tangu mwanzo. Mafaili yako hayaguswi.
dialog_forget_confirm=Sahau
lock_scope_does=Kufunga huficha matokeo na uhakiki wako kwenye skrini hadi ufungue.
lock_scope_doesnt=Hakusimbi chochote. Yeyote anayeweza kufungua mafaili ya kompyuta hii bado anaweza kusoma faharasa, mipangilio ya Trawl na mafaili yako. Kwa hilo, washa usimbaji wa diski wa kompyuta yako (FileVault, BitLocker au LUKS).
