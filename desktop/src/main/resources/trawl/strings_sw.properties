addons_intro=Vitu vya hiari vinavyoboresha Trawl. Trawl haiingii mtandaoni kamwe, kwa hivyo kila kimoja ni faili unalonakili kwenye kompyuta hii kwanza. Vipakuliwa ndipo pa kawaida. Kila kitu kinabaki kwenye kompyuta hii.
