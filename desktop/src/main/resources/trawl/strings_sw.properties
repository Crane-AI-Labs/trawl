report_saved=Ripoti imehifadhiwa. Hakuna kilichotumwa popote.
report_save_failed=Trawl haikuweza kuhifadhi ripoti hapo.
report_send_to=Ili kuituma, ambatisha faili au bandika maandishi kwenye barua pepe kwenda %1$s.
report_kept=Trawl huhifadhi ripoti zisizozidi 10 za hitilafu kwenye kompyuta hii, takriban 100 KB. "Sahau kila kitu" huzifuta.
