shell_hotkey_portal_none=Trawl iliomba njia ya mkato kutoka eneo-kazi lako, lakini hakuna iliyowekwa bado. Chagua moja kwenye mipangilio ya kibodi ya eneo-kazi lako, au ongeza njia ya mkato inayoendesha "trawl --quick".
