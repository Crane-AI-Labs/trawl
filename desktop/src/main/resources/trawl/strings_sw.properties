shell_hotkey_wayland=Eneo-kazi hili (Wayland) halipi programu njia ya mkato ya kila mahali, kwa hivyo Trawl haiwezi kusikiliza kitufe popote. Fungua utafutaji wa haraka kutoka kwenye ikoni ya trei, au kwenye mipangilio ya kibodi ya mfumo wako ongeza njia ya mkato inayoendesha "trawl --quick".
