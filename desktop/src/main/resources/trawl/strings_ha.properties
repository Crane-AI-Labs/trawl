privacy_pass_blank=Kalmar sirri ba za ta iya zama sarari kawai ba.
privacy_pass_forgot=Trawl ba zai iya dawo da kalmar sirri da aka manta ba. Idan kun rasa ta, goge fayil ɗin privacy.json a folda ɗin bayanan Trawl: hakan yana cire kullin da alamun sirrinku. Ba a taɓa fayilolinku da fihirisar ba.
privacy_need_proof=Buɗe tukuna don canza kullin.
privacy_blur_label=Lulluɓe hotunan da suka yi kama da na sirri
privacy_blur_hint=Ana lulluɓe hoto a jerin da samfoti har sai kun nuna shi. Yana nan a sakamakonku da tsarinsu.
privacy_blur_needs_pack=Ƙara kunshin Sirri a Ƙari don kunna wannan.
privacy_capture_label=Hana Trawl fitowa a hotunan allo da raba allo
privacy_capture_hint_windows=Yayin da Trawl ke nuna abubuwan da aka ɓoye ko na sirri, ana neman Windows ya hana tagar fitowa a hotunan allo da raba allo (tsofaffin sigogi suna nuna ta a matsayin baƙin murabba'i).
privacy_capture_hint_mac=Yayin da Trawl ke nuna abubuwan da aka ɓoye ko na sirri, ana neman macOS ya hana tagar fitowa a hotunan allo. Wasu kayan aiki za su iya ganinta.
privacy_capture_hint_linux=Linux ba ya ba manhajoji hanya mai dogaro don yin wannan, don haka Trawl ba ya ƙoƙari.
privacy_marked_one=An yi wa fayil %1$s alamar sirri.
privacy_marked_other=An yi wa fayiloli %1$s alamar sirri.
privacy_damaged=Trawl bai iya karanta saitunan sirrinsa ba, don haka ya fara daga sabo: kullin yana kashe kuma babu abin da aka yi wa alama.
privacy_recovered=Saitunan sirri na Trawl sun lalace. An dawo da su daga kwafi na ƙarshe mai kyau.
privacy_folders_hint=Ana ɗaukar hotunan da ke cikin waɗannan foldodin a matsayin na sirri a koyaushe.
privacy_folders_empty=Babu folda ta sirri tukuna.
privacy_folders_add=Ƙara folda ta sirri
privacy_folders_pick=Zaɓi folda da za a kiyaye a sirri
privacy_folders_bad=Zaɓi folda da ke cikin wacce Trawl ke bincika. Don daina bincika dukan folda, cire ta a Foldodi.
report_card_title=Trawl ya tsaya ba zato ba tsammani. A bayar da rahoto?
report_card_body=Rahoton ba shi da sunayen fayil, bincike ko rubutu daga fayilolinku. Kuna karanta shi tukuna. Ba a aika komai ba: kuna kwafar sa ko adana shi, ku aika da kanku.
settings_report_open_hint=Yana gina rahoto da za ku karanta, sannan ku kwafa ko adana. Yana ƙunshe da sigogin Trawl da na tsarin kwamfuta, girman wannan kwamfutar, adadi, saituna a matsayin kunne ko kashe, da alamun kurakurai ba tare da saƙonninsu ba. Ba a aika komai ko'ina ba.
report_hint=Wannan shi ne duk abin da rahoton ya ƙunsa. Fayilolinku, foldodinku da bincikenku ba su ciki.
report_note_hint=Ana saka bayaninku yadda kuka rubuta shi, don haka ku bar duk abin da yake na sirri. Duk abin da yake da kamannin hanyar fayil ana cire shi.
report_copy=Kwafi rahoto
report_copied=An kwafi rahoton. Ba a aika komai ko'ina ba.
report_copy_failed=Wannan kwamfutar ba ta ba Trawl allon kwafinta ba. Yi amfani da Adana maimakon haka.
report_mail=Buɗe imel
report_mail_lead=Cikakken rahoton yana kan allon kwafi na. Zan liƙa shi a ƙasan wannan layi.
report_mail_opened=An kwafi rahoton kuma an buɗe manhajar imel ɗinku. Liƙa rahoton a cikin imel ɗin, sannan ku aika da kanku. Trawl bai aika komai ba.
report_mail_opened_not_copied=An buɗe manhajar imel ɗinku, amma wannan kwamfutar ba ta ba Trawl allon kwafinta ba. Yi amfani da Adana a matsayin fayil sannan ku haɗa shi.
report_mail_failed=Trawl bai iya buɗe manhajar imel ba. An kwafi rahoton idan allon kwafi ya bari: liƙa shi a cikin imel zuwa %1$s.
report_save=Adana a matsayin fayil
report_saved=An adana rahoton. Ba a aika komai ko'ina ba.
report_save_failed=Trawl bai iya adana rahoton a can ba.
report_send_to=Don aikawa, haɗa fayil ɗin ko liƙa rubutun a cikin imel zuwa %1$s.
report_kept=Trawl yana ajiye rahotannin faɗuwa 10 a mafi yawa a wannan kwamfutar, kusan 100 KB. "Manta komai" yana goge su.
report_logs=Buɗe folda ɗin rajista
addons_intro=Ƙarin abubuwa na zaɓi da ke sa Trawl ya fi kyau. Trawl ba ya taɓa shiga intanet, don haka kowanne fayil ne da za ku fara kwafa zuwa wannan kwamfutar. Downloads shi ne wurin da aka saba. Komai yana zama a wannan kwamfutar.
