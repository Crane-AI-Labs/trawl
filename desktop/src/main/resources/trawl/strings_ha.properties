settings_forgot_nothing=Trawl bai koya komai ba tukuna, don haka babu abin da za a manta. Ba a taɓa fayilolinku ba.
settings_forget=Manta duk abin da Trawl ya koya
settings_choose_dialog=Zaɓi folda da za a bincika
settings_choose_models_dialog=Zaɓi trawl-models.zip
settings_about_private=Trawl ba shi da lambar sadarwar intanet. Fayilolinku da abin da yake koya daga gare su ba sa barin wannan kwamfutar.
settings_recordings_hint=Saƙonnin murya, rikodi da sautin bidiyo. Magana a Turanci kawai ake mayarwa kalmomi.
settings_media_no_ffmpeg=Bidiyo da rikodi suna buƙatar ffmpeg, kuma ba a shigar da shi a wannan kwamfutar ba. Shigar da shi (misali: sudo apt install ffmpeg) sai Trawl ya fara karanta su.
settings_media_no_decoder=Wannan kwamfutar ba ta da hanyar buɗe bidiyo da rikodi don Trawl. Suna nan a jerin amma ana tsallake su.
settings_media_no_speech=Ba a shigar da samfuran magana ba tukuna, don haka ana samun rikodi da sautin bidiyo ta alamomin sauti kawai. Shigar da sabon fayil ɗin samfuran Trawl don kunna magana.
settings_storage_media=Haka kuma: %1$s, %2$s
settings_heic_missing_linux=Wannan kwamfutar ba za ta iya buɗe hotunan HEIC, HEIF ko AVIF ba (irin da wayoyi da iPhone da yawa ke ɗauka), don haka Trawl yana iya samun su ta suna kawai. Don gyarawa, shigar da libheif (shirin heif-convert, yawanci a cikin kunshin libheif-examples) ko ImageMagick mai tallafin HEIC, sannan ku sake kunna Trawl.
settings_heic_missing_windows=Wannan kwamfutar ba za ta iya buɗe hotunan HEIC, HEIF ko AVIF ba (irin da wayoyi da iPhone da yawa ke ɗauka), don haka Trawl yana iya samun su ta suna kawai. Don gyarawa, ƙara HEIF Image Extensions na Microsoft kyauta daga Microsoft Store, sannan ku sake kunna Trawl.
settings_kinds_all_off=An kashe komai, don haka Trawl ba ya karantawa ko samun komai. Kunna ɗaya don sake bincike.
settings_excluded_add=Tsallake folda
settings_excluded_pick=Zaɓi folda da za a tsallake
settings_excluded_not_inside=Zaɓi folda da ke cikin wacce kuke bincika tuni.
settings_excluded_is_chosen=Ana bincika dukan wannan folda. Yi amfani da Cire a sama don daina karanta ta.
settings_excluded_not_folder=Wannan ba folda ba ne.
learn_speed_title=Saurin aiki
learn_gentle_hint=Ƙananan zaren processor, kuma ba karantawa yayin da wannan kwamfutar ke kan batir. Mafi ƙarancin zafi da hayaniyar fan; duk sabon abu yana jiran caja.
learn_balanced_hint=Hanyar da aka saba: na'urar tana zaɓar saurinta, a kan batir ko ba a kai ba.
learn_fast_hint=Yana ba aikin zaren processor da yawa gwargwadon abin da ke taimakawa, a kan batir ma. Yana yin ɗumi da hayaniya, kuma a wasu kwamfutoci ba ya fi Daidaitacce sauri.
settings_speed_rate_one=A wannan zaman: kusan fayil %1$s a minti.
settings_speed_rate_other=A wannan zaman: kusan fayiloli %1$s a minti.
pause_not_charging_detail=Saurin Sannu a hankali yana karantawa ne kawai yayin da aka haɗa wannan kwamfutar da wuta. Bincike yana aiki a halin yanzu.
settings_storage_cache=Ma'ajiyar na'ura ta wucin-gadi
settings_storage_files=Fayilolin da Trawl ya sani: %1$s, %2$s, %3$s
settings_delete_hint=Yana cire fihirisar da Trawl ya gina daga fayilolinku: sunayensu, kalmomin da ke cikin takardunku, rubutun da aka karanta a hotuna da abin da AI ya lura game da kowane fayil. Fayilolinku na kanku, saitunanku (har da foldodin da aka tsallake) da samfuran ba a taɓa su. Daga nan Trawl yana sake karanta foldodinku tun daga farko.
settings_language_system=Bi kwamfutata
settings_startup_title=Farawa
settings_startup_label=Kunna Trawl idan na shiga
settings_startup_hint=A kashe sai dai idan kun kunna. Trawl yana buɗe tagarsa idan kun shiga wannan kwamfutar, kuma yana ci gaba da karanta foldodinku daga nan.
settings_startup_failed=Wannan kwamfutar ba ta bar Trawl ya canza hakan ba. Ba a canza komai ba.
settings_report_hint=Yana kwafar taƙaitaccen rahoto zuwa allon kwafi: sigogin Trawl da na tsarin kwamfuta, girman wannan kwamfutar, adadin fayiloli, girman fihirisa, saurin karantawa na ƙarshe da kurakuran baya-bayan nan. Ba shi da sunayen fayil ko na folda ko rubutu daga fayilolinku, kuma ba a aika komai ko'ina ba. Liƙa shi a inda kuke bayar da rahoton matsalar.
settings_report_copy=Kwafi bayanan bincike
settings_report_copied=An kwafi bayanan bincike. Ba a aika komai ko'ina ba.
settings_report_copy_failed=Wannan kwamfutar ba ta ba Trawl allon kwafinta ba.
settings_report_logs=Buɗe folda ɗin rajista
settings_report_logs_failed=Ba a iya buɗe folda ɗin rajista ba.
settings_about_runtime=Java runtime: %1$s
settings_about_model=Bincike yana aiki da EmbeddingGemma 2 na Google (Apache 2.0), gaba ɗaya a wannan kwamfutar.
licences_intro=%1$s an gina shi ne a kan aikin da ke ƙasa. Lasisin suna buƙatar waɗannan sanarwa, kuma hanya ce ta gode musu.
licences_section_components=Duk sauran abubuwa a cikin %1$s
