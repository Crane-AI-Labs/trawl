privacy_os_unavailable=Ba a saita %1$s a wannan kwamfutar ba, don haka ana amfani da kalmar sirri.
privacy_os_none=Wannan kwamfutar ba ta da buɗewa ta hannu ko fuska da Trawl zai iya amfani da ita a nan, don haka kullin yana amfani da kalmar sirri.
