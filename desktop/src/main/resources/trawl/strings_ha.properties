welcome_point_private_title=Yana zama a wannan kwamfutar
welcome_point_private_body=AI ɗin da ke fahimtar fayilolinku yana aiki a nan. Trawl ba ya taɓa shiga intanet: babu asusu, babu sabuntawa, babu bin diddigi.
first_folders_title=Foldodin da za a bincika
first_folders_body=Trawl yana karanta foldodin da kuka zaɓa a nan kawai. Ba a taɓa karanta foldodin da aka ɓoye.
first_folders_missing=ba a same shi a wannan kwamfutar ba
first_models_title=Samfuran
first_models_body=Trawl yana buƙatar fayil ɗin samfuran don fahimtar hotuna da ma'ana. Shi ne fayil ɗin da aka sanya wa hannu wanda wayar ke amfani da shi. Trawl ba ya sauke komai: kuna samun fayil ɗin da burauzarku, kuma Trawl yana duba sa hannunsa kafin ya yi amfani da shi.
first_models_found=An samu %1$s a %2$s (%3$s).
first_models_none=Ba a sami fayil ɗin samfuran a Downloads ba. Sauke trawl-models.zip, ko ku zaɓi fayil ɗin da aka ba ku.
first_models_none_named=Ba a sami fayil ɗin samfuran a Downloads ba. Sauke %1$s, ko ku zaɓi fayil ɗin da aka ba ku.
models_choice_standard_body=Mafi kyawun bincike a kowane harshe, da magana a bidiyo da rikodi.
models_choice_save_body=Ana samun takardu da hotunan allo daidai da kyau a Turanci. Ana samun hotuna ne kawai ta kalmomin da ke cikinsu, ba ta abin da suke nunawa ba, don haka ana samun hoto na yau da kullum ta sunansa kawai. Binciken Luganda da Swahili ya fi rauni, kuma babu magana a bidiyo ko rikodi. Za ku iya ƙara sauran daga baya.
models_installed_standard=Samfuran Na al'ada: mafi kyawun bincike a kowane harshe, tare da magana a bidiyo da rikodi.
models_installed_save=Samfuran Adana data: ana samun takardu da hotunan allo kamar yadda ake samu da Na al'ada a Turanci. Ana samun hotuna ta kalmomin da ke cikinsu, ba ta abin da suke nunawa ba. Binciken Luganda da Swahili ya fi rauni, kuma babu magana a bidiyo ko rikodi.
models_upgrade_note=Don samun samfuran Na al'ada (%1$s MB), ku samu trawl-models.zip sannan ku zaɓe shi a nan. Jerin fayilolinku yana nan: bincike ta sunan fayil na ci gaba da aiki a halin yanzu. Kalmomin da ke cikin takardu da hotuna, da bincike ta ma'ana, suna dawowa yayin da ake sake karanta kowane fayil.
models_upgraded=An shigar da samfuran Na al'ada. Yanzu Trawl yana sake karanta fayilolinku da samfuri mafi inganci. Sunayen fayil suna ci gaba da aiki a halin yanzu; kalmomin da ke cikin takardu da hotuna suna dawowa yayin da ake karanta fayilolin.
first_zip_question=A goge %1$s yanzu? Yana da girman %2$s kuma Trawl ba ya buƙatarsa kuma. Kuna iya sake sauke shi daga baya.
first_zip_delete=A goge shi
first_zip_keep=A bar shi
first_zip_deleted=An goge %1$s kuma an samu sarari %2$s.
first_zip_delete_failed=Trawl bai iya goge %1$s ba. Kuna iya goge shi da kanku.
first_models_ready=An shigar da samfuran. Trawl yana karanta hotuna da takardu ta ma'ana.
first_models_installing=Ana dubawa da shigar da %1$s cikin %2$s
first_addons_body=Waɗannan suna sa Trawl ya fi kyau amma ba lallai ba ne. Kamar samfuran, kowanne fayil ne da za ku fara kwafa zuwa wannan kwamfutar.
first_addons_skip=A tsallake waɗannan yanzu. Kuna iya ƙara kowanne daga baya a Saituna.
first_models_skip_note=Kuna iya farawa ba tare da samfuran ba. Bincike zai yi aiki ta suna da kalmomi, ma'ana kuma za ta fara da zarar kun ƙara su.
first_start_hint=Zaɓi folda ɗaya aƙalla don farawa.
