lock_offer_title=A kulle Trawl ma?
lock_offer_body=Kun yi wa fayil alamar sirri. Kullin manhaja yana ɓoye sakamakonku a bayan buɗewar kwamfutarku ko kalmar sirri idan kun tashi. Yana ɓoye abin da ake gani ne kawai. Ba ya ɓoye komai da lambar sirri.
