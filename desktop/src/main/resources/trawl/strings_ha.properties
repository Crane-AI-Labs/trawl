dialog_remove_confirm=A daina bincika ta
dialog_forget_title=A manta komai?
dialog_forget_body=Trawl yana goge abin da ya koya kuma yana sake karanta foldodinku tun daga farko. Ba a taɓa fayilolinku ba.
dialog_forget_confirm=A manta shi
lock_scope_does=Kullin yana ɓoye sakamakonku da samfoti a allo har sai kun buɗe.
lock_scope_doesnt=Ba ya ɓoye komai da lambar sirri. Duk wanda zai iya buɗe fayilolin wannan kwamfutar zai iya karanta fihirisar, saitunan Trawl da fayilolinku. Don haka, kunna ɓoyayyen diski na kwamfutarku (FileVault, BitLocker ko LUKS).
