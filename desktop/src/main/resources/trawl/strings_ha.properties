lock_os_cancelled=An soke. Sake gwadawa, ko ku yi amfani da kalmar sirrinku.
lock_os_denied=Kwamfutarku ba ta karɓa ba. Sake gwadawa, ko ku yi amfani da kalmar sirrinku.
