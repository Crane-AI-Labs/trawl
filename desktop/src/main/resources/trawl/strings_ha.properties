pause_storage_low=Sarari a diski ya kusa cika
pause_storage_low_detail=Trawl yana buƙatar ɗan fili don ajiye fihirisarsa. Samar da sarari sai ya ci gaba da kansa. Bincike yana aiki har yanzu.
pause_no_permission=Yana buƙatar shiga foldodinku
pause_no_permission_detail=Wannan kwamfutar ba ta bar Trawl ya duba cikin foldodin da kuka zaɓa ba. Ba da izini, sai karantawa ya ci gaba da kansa. Bincike yana aiki a kan abin da Trawl ya koya.
pause_no_permission_detail_mac=macOS ya tambaya ko Trawl zai iya duba cikin foldodinku, kuma amsar ita ce a'a. Buɗe System Settings, sannan Privacy & Security, sannan Files & Folders, ku kunna Trawl. Karantawa zai ci gaba da kansa. Bincike yana aiki.
blocked_system_one=Folda %1$s a cikin foldodin da kuka zaɓa a rufe take ga Trawl (%2$s), don haka Trawl yana tsallake ta. Ba a cire komai daga bincike ba, kuma ana karanta sauran kamar yadda aka saba.
blocked_system_other=Foldodi %1$s a cikin foldodin da kuka zaɓa a rufe suke ga Trawl (%2$s), don haka Trawl yana tsallake su. Ba a cire komai daga bincike ba, kuma ana karanta sauran kamar yadda aka saba.
blocked_fix_mac=Don barin Trawl ya shiga, buɗe System Settings, sannan Privacy & Security, sannan Files & Folders (ko Full Disk Access), ku kunna Trawl. Sannan zaɓi Sake dubawa.
blocked_fix=Don barin Trawl ya shiga, canza izinin waɗannan foldodin domin asusunku ya iya buɗe su. Sannan zaɓi Sake dubawa.
blocked_other_one=Ba a iya buɗe folda %1$s ba yanzu (diski da ya tafi, ko hanyar sadarwa da ta katse). Trawl yana riƙe da abin da ya sani game da ita kuma zai sake duba ta a dubawa ta gaba.
blocked_other_other=Ba a iya buɗe foldodi %1$s ba yanzu (diski da ya tafi, ko hanyar sadarwa da ta katse). Trawl yana riƙe da abin da ya sani game da su kuma zai sake duba su a dubawa ta gaba.
