demo_snip_voice=…«hayar» za ta cika ranar Juma'a, don haka…
demo_aria=Trawl, yana bincika kwamfuta. Bikin zagayowar ranar haihuwa ya samo hotunan bikin haihuwa uku: biredi, mace tare da iyalinta, da namiji a wurin biki. Kalmar sirrin wifi ya samo hoton allo na hira mai ɗauke da sunan hanyar sadarwa da kalmar sirri. Rasidi daga shagon waya ya samo rasidin PDF. Bidiyon kare mai ban dariya ya samo bidiyoyin kare biyu. Saƙon murya game da hayar gida ya samo saƙon murya, a 0:42.
refusal_not_signed=Wannan ba fayil ɗin samfuran Trawl ba ne: ba shi da sa hannu. Sake sauke trawl-models.zip.
refusal_bad_signature=Crane AI Labs bai sanya wa wannan fayil hannu ba, ko kuma an canza shi bayan sanya hannu. Trawl ba zai yi amfani da shi ba.
refusal_bad_manifest=Wannan fayil ɗin samfuran ya fi wannan sigar Trawl ƙarfin karantawa, ko kuma ya lalace.
refusal_wrong_class=Wannan fayil ɗin samfuran ba wanda wannan kwamfutar za ta iya amfani da shi ba ne.
refusal_wrong_class_lite=Wannan shi ne kunshin na al'ada. Wannan kwamfutar tana da ƙaramin ƙwaƙwalwa kuma tana buƙatar ƙaramin kunshi.
