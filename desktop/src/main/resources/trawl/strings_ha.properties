addon_problem_bad_files=Fayil ɗin ya lalace ko ba shi ne daidai ba, don haka Trawl bai yi amfani da shi ba. Sake kwafar sa, sannan ku sake gwadawa.
addon_problem_not_signed=Ba a sanya wa wannan fayil hannu ba, don haka Trawl bai yi amfani da shi ba.
