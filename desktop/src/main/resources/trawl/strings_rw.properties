sensitive_folder_off=Reka gufata ubu bubiko nk'ubw'ubuzima bwite
leave_title=Gukura fayiro y'ibanga muri Trawl?
leave_body_one=Iyi fayiro yashyizwe mu by'ibanga. Kuyikoporora, kuyisangiza cyangwa kuyifungurira muri indi porogaramu bituma ivuye hanze y'ifunga rya Trawl.
leave_body_other=Amafayiro %1$s muri aya yashyizwe mu by'ibanga. Kuyakoporora, kuyasangiza cyangwa kuyafungurira muri indi porogaramu bituma avuye hanze y'ifunga rya Trawl.
leave_confirm=Komeza
leave_cancel=Hagarika
lock_offer_title=Funga na Trawl?
lock_offer_body=Washyize fayiro mu by'ibanga. Ifunga rya porogaramu rihisha ibyabonetse inyuma y'ugufungura kwa mudasobwa yawe cyangwa ijambo ry'ibanga iyo uvuyeho. Rihisha gusa ibigaragara. Nta cyo ryanditse mu buryo bw'ibanga (encryption).
lock_offer_set=Shyiraho ifunga
settings_privacy_intro=Hitamo ibyo Trawl ihisha n'ushobora kubona ibyabonetse. Nta kintu cyo hano kivana kuri iyi mudasobwa.
privacy_lock_label=Ifunga rya porogaramu
privacy_lock_hint=Rihisha ibyabonetse n'ibyo wareberaga kugeza ufunguye.
