addons_look_in_downloads=Reba muri Downloads
addons_remove_body=Ibi birekura %1$s kandi bikayizimya. Amanota yari yamaze gukorwa arasibwa, kandi ushobora kuyongera igihe icyo ari cyo cyose.
addons_found_one=Habonetse %1$s muri Downloads.
addons_found_other=Habonetse amafayiro %1$s muri Downloads ashobora kuba iyi nyongera.
addons_declined=Wakuyeho iyi nyongera. Trawl ntizongera kuyongeraho ubwayo.
addons_checked=Buri fayiro isuzumwa ku mukono cyangwa ku ntoki zihamye mbere yo gukoreshwa. Fayiro idahuye irangwa.
addons_update_title=Verisiyo nshya ya %1$s iri mu mafayiro yawe
addons_update_body=Verisiyo %1$s yiteguye kongerwamo. Ufite verisiyo %2$s.
addons_update_install=Vugurura
addon_problem_not_found=Trawl ntiyashoboye kubona iyi nyongera muri Downloads. Koporora fayiro aho, cyangwa uyihitemo, hanyuma wongere ugerageze.
addon_problem_bad_files=Fayiro yangiritse cyangwa si yo, bityo Trawl ntiyayikoresheje. Yongere uyikoporore, hanyuma wongere ugerageze.
addon_problem_not_signed=Iyi fayiro nta mukono ifite, bityo Trawl ntiyayikoresheje.
addon_problem_bad_signature=Umukono w'iyi fayiro ntuhuye. Ishobora kuba yarahinduwe, bityo Trawl yayanze.
