demo_aria=Trawl, ishakisha kuri mudasobwa. Ibirori by'isabukuru bibona amafoto atatu y'isabukuru: umutsima, umugore n'umuryango we, n'umugabo mu birori. Ijambo ry'ibanga rya wifi ribona ifoto ya sikirini y'ibiganiro irimo izina rya murandasi n'ijambo ry'ibanga. Inyemezabwishyu y'iduka rya telefone ibona inyemezabwishyu ya PDF. Videwo y'imbwa isekeje ibona videwo ebyiri z'imbwa. Ubutumwa bw'amajwi ku bukode bw'inzu bibona ubutumwa bw'amajwi, kuri 0:42.
