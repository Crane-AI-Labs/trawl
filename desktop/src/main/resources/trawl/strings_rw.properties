addon_speech_benefit=Ibona ibyavuzwe mu majwi no muri videwo.
addon_speech_cost=%1$s kuri iyi mudasobwa.
addons_status_included=Birimo
addons_bundled_on=Biza muri fayiro ya moderi za Trawl, kandi birakora. Amajwi y'Icyongereza gusa ni yo ahindurwa amagambo.
addons_bundled_off=Biza muri fayiro ya moderi za Trawl, iyi mudasobwa itaragira. Ongeraho fayiro ya moderi iheruka kugira ngo amajwi atangire gukora.
