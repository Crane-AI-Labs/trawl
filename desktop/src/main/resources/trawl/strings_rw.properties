addon_privacy_benefit=Ihuma amafoto agaragara nk'ay'ubuzima bwite kugeza ahisemo kuyerekana.
addon_privacy_cost=%1$s kuri iyi mudasobwa. Nta interineti ikenerwa umaze kubona fayiro.
