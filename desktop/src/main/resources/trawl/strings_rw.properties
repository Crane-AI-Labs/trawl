privacy_os_unavailable=%1$s ntiyashyizweho kuri iyi mudasobwa, bityo hakoreshwa ijambo ry'ibanga.
privacy_os_none=Iyi mudasobwa nta gufungura ukoresheje urutoki cyangwa mu maso Trawl ishobora gukoresha hano, bityo ifunga rikoresha ijambo ry'ibanga.
privacy_pass_new=Ijambo ry'ibanga rishya
privacy_pass_again=Ongera ryandike
privacy_pass_min=Koresha nibura inyuguti %1$s.
privacy_pass_mismatch=Byombi ntibihuye.
privacy_pass_blank=Ijambo ry'ibanga ntirishobora kuba umwanya gusa.
privacy_pass_forgot=Trawl ntishobora kugarura ijambo ry'ibanga wibagiwe. Niba ubuze, siba fayiro privacy.json mu bubiko bw'amakuru bwa Trawl: ibyo bikuraho ifunga n'ibyo washyize mu by'ibanga. Amafayiro yawe n'isesengura ntibikorwaho.
privacy_need_proof=Banza ufungure kugira ngo uhindure ifunga.
privacy_blur_label=Huma amafoto agaragara nk'ay'ubuzima bwite
privacy_blur_hint=Ifoto ihumwa mu rutonde no mu igerageza kugeza uyerekanye. Iguma mu byabonetse no mu murongo wabyo.
privacy_blur_needs_pack=Ongeramo Privacy pack muri Inyongera kugira ngo ubicane.
privacy_capture_label=Hisha Trawl mu mafoto ya sikirini no mu gusangiza ecran
privacy_capture_hint_windows=Mu gihe Trawl yerekana ibyihishe cyangwa iby'ibanga, Windows isabwa guhisha idirishya mu mafoto ya sikirini no mu gusangiza ecran (verisiyo za kera ziryerekana nk'urukiramende rwirabura).
privacy_capture_hint_mac=Mu gihe Trawl yerekana ibyihishe cyangwa iby'ibanga, macOS isabwa guhisha idirishya mu mafoto ya sikirini. Ibikoresho bimwe bishobora kurikomeza kurireba.
privacy_capture_hint_linux=Linux nta buryo yizewe iha porogaramu bwo kubikora, bityo Trawl ntibigerageza.
privacy_marked_one=Fayiro %1$s yashyizwe mu by'ibanga.
privacy_marked_other=Amafayiro %1$s yashyizwe mu by'ibanga.
privacy_damaged=Trawl ntiyashoboye gusoma igenamiterere ryayo ry'ubuzima bwite, bityo yatangiye bundi bushya: ifunga ryarazimye kandi nta cyashyizwe mu by'ibanga.
privacy_recovered=Igenamiterere ry'ubuzima bwite rya Trawl ryangiritse. Ryagaruwe kuri kopi nziza iheruka.
privacy_folders_hint=Amafoto y'ubu bubiko buri gihe afatwa nk'ay'ubuzima bwite.
privacy_folders_empty=Nta bubiko bwite burimo.
privacy_folders_add=Ongeraho ububiko bwite
privacy_folders_pick=Hitamo ububiko bwo gukomeza kuba ubwite
privacy_folders_bad=Hitamo ububiko buri mu bundi Trawl ishakishamo. Kugira ngo uhagarike gushakisha mu bubiko bwose, ubukureho muri Ububiko.
privacy_folders_invalid=Iryo si izina ry'ububiko iyi mudasobwa ishobora gusoma. Hitamo ububiko mu rutonde aho.
report_card_title=Trawl yahagaze ititeguwe. Gutanga raporo?
report_card_body=Raporo nta mazina y'amafayiro, ibyashakishijwe cyangwa inyandiko z'amafayiro yawe irimo. Uyisoma mbere. Nta kintu cyoherezwa: urayikoporora cyangwa ukayibika, maze ukayohereza ubwawe.
settings_report_open_hint=Yubaka raporo ushobora gusoma, hanyuma ukayikoporora cyangwa ukayibika. Irimo verisiyo za Trawl na sisitemu, ingano y'iyi mudasobwa, imibare, igenamiterere nk'ibyaka cyangwa ibizimije, n'inzira z'amakosa zitarimo ubutumwa bwazo. Nta kintu cyoherezwa ahandi.
report_hint=Ibi ni byo byose raporo irimo. Amafayiro yawe, ububiko bwawe n'ibyo washakishije ntibirimo.
report_note_hint=Ibyo wanditse bishyirwamo uko ubyanditse, bityo ntushyiremo ibyo mu buzima bwite. Icyose gisa n'inzira y'ifayiro kiravanwamo.
report_copy=Koporora raporo
report_copied=Raporo yakoporowe. Nta kintu cyoherejwe ahandi.
report_copy_failed=Iyi mudasobwa ntiyahaye Trawl ikibaho cyayo. Koresha Bika aho.
report_mail=Fungura imeri
report_mail_lead=Raporo yuzuye iri ku kibaho cyanjye. Ndayishyira munsi y'uyu murongo.
report_mail_opened=Raporo yakoporowe kandi porogaramu yawe ya imeri irafunguwe. Shyira raporo muri imeri, hanyuma uyohereze ubwawe. Trawl nta cyo yohereje.
report_mail_opened_not_copied=Porogaramu yawe ya imeri irafunguwe, ariko iyi mudasobwa ntiyahaye Trawl ikibaho cyayo. Koresha Bika nk'ifayiro maze uyomekeho.
report_mail_failed=Trawl ntiyashoboye gufungura porogaramu ya imeri. Raporo yakoporowe niba ikibaho cyabyemeye: yishyire muri imeri yandikiwe %1$s.
report_save=Bika nk'ifayiro
report_saved=Raporo yabitswe. Nta kintu cyoherejwe ahandi.
report_save_failed=Trawl ntiyashoboye kubika raporo aho hantu.
report_send_to=Kuyohereza, omekaho ifayiro cyangwa wishyire inyandiko muri imeri yandikiwe %1$s.
report_kept=Trawl ibika raporo zitarenze 10 z'ihagarara kuri iyi mudasobwa, hafi KB 100. “Ibagirwe byose” irazisiba.
report_logs=Fungura ububiko bw'amateka
addons_intro=Inyongera zihitamo zituma Trawl irushaho kuba nziza. Trawl ntijya kuri interineti, bityo buri imwe ni fayiro ubanza gukoporora kuri iyi mudasobwa. Downloads ni ho bisanzwe. Byose biguma kuri iyi mudasobwa.
