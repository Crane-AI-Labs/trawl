settings_data_body=Isesengura ribitswe muri %1$s. Siba ubwo bubiko kugira ngo wibagirwe ibyo Trawl yize byose.
settings_forgot=%1$s byibagiranywe: ibyo Trawl yari yarize kuri %2$s. Irongera gusoma ububiko bwawe uhereye ku ntangiriro. Amafayiro yawe ntiyakozweho.
settings_forgot_nothing=Trawl nta cyo yari yarize, bityo nta cyo kwibagirwa. Amafayiro yawe ntiyakozweho.
settings_forget=Ibagirwe ibyo Trawl yize byose
settings_choose_dialog=Hitamo ububiko bwo gushakishamo
settings_choose_models_dialog=Hitamo trawl-models.zip
settings_about_private=Trawl nta kode ya murandasi ifite. Amafayiro yawe n'ibyo yigaho ntibivana kuri iyi mudasobwa.
group_media=Videwo n'amajwi
group_documents_media=Inyandiko, videwo n'amajwi
settings_recordings_hint=Ubutumwa bw'amajwi, amajwi n'ijwi rya videwo. Ijwi ry'Icyongereza gusa ni ryo ryahindurwamo amagambo.
settings_media_no_ffmpeg=Videwo n'amajwi bikeneye ffmpeg, kandi ntiri kuri iyi mudasobwa. Yishyireho (urugero: sudo apt install ffmpeg) maze Trawl itangire kubisoma.
settings_media_no_decoder=Iyi mudasobwa nta buryo ifite bwo gufungurira Trawl videwo n'amajwi. Bigumaho ariko bisimbuswa.
settings_media_no_speech=Moderi z'amajwi ntizirashyirwamo, bityo amajwi na videwo bibonwa gusa ukurikije amazina y'amajwi. Shyiramo fayiro iheruka ya moderi za Trawl kugira ngo amajwi ashakishwe.
settings_storage_media=Hiyongeraho: %1$s, %2$s
settings_heic_missing_linux=Iyi mudasobwa ntishobora gufungura amafoto ya HEIC, HEIF cyangwa AVIF (ayo telefone nyinshi na iPhone zikora), bityo Trawl ishobora kuyabona ku izina gusa. Kubikosora, shyiraho libheif (porogaramu heif-convert, akenshi iba muri paki libheif-examples) cyangwa ImageMagick ifite HEIC, hanyuma utangire Trawl nanone.
settings_heic_missing_windows=Iyi mudasobwa ntishobora gufungura amafoto ya HEIC, HEIF cyangwa AVIF (ayo telefone nyinshi na iPhone zikora), bityo Trawl ishobora kuyabona ku izina gusa. Kubikosora, ongeraho HEIF Image Extensions ya Microsoft itangirwa ubuntu muri Microsoft Store, hanyuma utangire Trawl nanone.
settings_kinds_all_off=Byose byazimijwe, bityo Trawl nta cyo isoma cyangwa ibona. Cana kimwe kugira ngo ushakishe nanone.
settings_excluded_add=Simbuka ububiko
settings_excluded_pick=Hitamo ububiko bwo gusimbuka
settings_excluded_not_inside=Hitamo ububiko buri mu bundi usanzwe ushakishamo.
settings_excluded_is_chosen=Ubwo bubiko bwose burashakishwa. Koresha Kuraho haruguru kugira ngo uhagarike kubusoma.
settings_excluded_not_folder=Ibyo si ububiko.
learn_speed_title=Umuvuduko w'akazi
learn_gentle_hint=Imirongo mike y'ikoranabuhanga, kandi nta gusoma mudasobwa iri kuri bateri. Ubushyuhe n'urusaku rw'umuyaga bike cyane; ibishya byose bitegereza umuriro.
learn_balanced_hint=Uko bisanzwe: moteri yihitiramo umuvuduko, iri kuri bateri cyangwa itari yo.
learn_fast_hint=Iha akazi imirongo myinshi ishoboka, no kuri bateri. Ishyuha kandi ikavuga cyane, kandi kuri mudasobwa zimwe ntiyihuta kurusha Hagati.
settings_speed_rate_one=Muri iki gihe: hafi fayiro %1$s ku munota.
settings_speed_rate_other=Muri iki gihe: hafi amafayiro %1$s ku munota.
pause_not_charging_detail=Umuvuduko Buhoro usoma gusa mudasobwa iri ku muriro. Gushakisha bikora hagati aho.
settings_storage_cache=Ububiko bw'agateganyo bwa moteri
settings_storage_files=Amafayiro Trawl izi: %1$s, %2$s, %3$s
settings_delete_hint=Bikuraho isesengura Trawl yubatse ku mafayiro yawe: amazina yayo, amagambo ari mu nyandiko zawe, inyandiko yasomye mu mafoto n'ibyo AI yanditse kuri buri fayiro. Amafayiro yawe, igenamiterere ryawe (harimo n'ububiko wasimbutse) na moderi ntibikorwaho. Trawl irongera gusoma ububiko bwawe uhereye ku ntangiriro.
settings_language_system=Kurikiza mudasobwa yanjye
settings_startup_title=Gutangira
settings_startup_label=Tangiza Trawl iyo nyinjiye
settings_startup_hint=Birazimye keretse ubicanye. Trawl ifungura idirishya ryayo iyo winjiye kuri iyi mudasobwa, maze igakomeza gusoma ububiko bwawe.
settings_startup_failed=Iyi mudasobwa ntiyemereye Trawl guhindura ibyo. Nta cyahindutse.
settings_report_hint=Bikoporora raporo ngufi ku kibaho: verisiyo za Trawl na sisitemu, ingano y'iyi mudasobwa, umubare w'amafayiro, ingano y'isesengura, umuvuduko w'isoma riheruka n'amakosa aheruka. Nta mazina y'amafayiro cyangwa y'ububiko, cyangwa inyandiko z'amafayiro yawe birimo, kandi nta kintu cyoherezwa ahandi. Yishyire aho utangirira ikibazo.
settings_report_copy=Koporora amakuru y'ikibazo
settings_report_copied=Amakuru y'ikibazo yakoporowe. Nta kintu cyoherejwe ahandi.
settings_report_copy_failed=Iyi mudasobwa ntiyahaye Trawl ikibaho cyayo.
settings_report_logs=Fungura ububiko bw'amateka
settings_report_logs_failed=Ntibyashoboye gufungura ububiko bw'amateka.
settings_about_runtime=Java runtime: %1$s
settings_about_model=Gushakisha bikoresha EmbeddingGemma 2 ya Google (Apache 2.0), byose kuri iyi mudasobwa.
licences_intro=%1$s yubakiye ku mirimo ikurikira. Ubu butumwa busabwa n'impushya, kandi ni n'uburyo bwo gushimira.
licences_section_components=Ibindi byose muri %1$s
licences_includes=Isomero: %1$s
dialog_remove_folder_title=Guhagarika gushakisha muri ubu bubiko?
dialog_remove_folder_body=Trawl yibagirwa ibyo yize kuri %1$s. Amafayiro ubwayo ntakorwaho.
dialog_remove_confirm=Hagarika gushakisha
dialog_forget_title=Kwibagirwa byose?
dialog_forget_body=Trawl isiba ibyo yize maze ikongera gusoma ububiko bwawe uhereye ku ntangiriro. Amafayiro yawe ntakorwaho.
dialog_forget_confirm=Ibagirwe
lock_scope_does=Ifunga rihisha ibyabonetse n'ibyo wareberaga kuri ecran kugeza ufunguye.
lock_scope_doesnt=Ntirihisha ikintu mu buryo bw'ibanga (encryption). Umuntu wese ushobora gufungura amafayiro ya mudasobwa yawe aracyashobora gusoma isesengura, igenamiterere rya Trawl n'amafayiro yawe. Kuri ibyo, cana encryption y'ububiko bwa mudasobwa yawe (FileVault, BitLocker cyangwa LUKS).
lock_body=Fungura kugira ngo urebe ibyabonetse.
lock_unlock_with=Fungura ukoresheje %1$s
lock_passphrase=Ijambo ry'ibanga
lock_wrong=Iryo si ryo jambo ry'ibanga.
lock_wait=Wagerageje inshuro nyinshi. Ongera ugerageze nyuma y'amasogonda %1$s.
lock_not_set=Nta jambo ry'ibanga ryashyizweho. Zimya ifunga hanyuma uryongere ucane muri Igenamiterere, Ubuzima bwite.
lock_os_cancelled=Byahagaritswe. Ongera ugerageze, cyangwa ukoreshe ijambo ry'ibanga.
lock_os_denied=Mudasobwa yawe ntiyabyemeye. Ongera ugerageze, cyangwa ukoreshe ijambo ry'ibanga.
lock_os_error=Gufungura kwa mudasobwa yawe ntikwakoze. Koresha ijambo ry'ibanga.
lock_os_waiting=Gutegereza %1$s…
lock_use_passphrase=Koresha ijambo ry'ibanga aho
auth_title_reveal=Kwerekana amafoto yihishe?
auth_title_change=Guhindura ifunga?
auth_body_reveal=Emeza ko ari wowe mbere yo kwerekana amafoto yihishe n'amafayiro y'ibanga.
auth_body_change=Emeza ko ari wowe mbere yo guhindura ifunga.
