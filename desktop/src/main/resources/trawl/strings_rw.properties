first_models_title=Moderi
first_models_body=Trawl ikeneye fayiro ya moderi kugira ngo isobanukirwe amafoto n'ibisobanuro. Ni yo fayiro yasinywe telefone ikoresha. Trawl ntikuramo ikintu na kimwe: ufata fayiro ukoresheje mucukumbuzi yawe, maze Trawl igasuzuma umukono wayo mbere yo kuyikoresha.
first_models_found=Habonetse %1$s muri %2$s (%3$s).
first_models_none=Nta fayiro ya moderi iboneka muri Downloads. Kura trawl-models.zip, cyangwa uhitemo fayiro wahawe.
first_models_none_named=Nta fayiro ya moderi iboneka muri Downloads. Kura %1$s, cyangwa uhitemo fayiro wahawe.
models_choice_standard_body=Gushakisha kwiza cyane mu ndimi zose, hamwe n'amajwi yo muri videwo no mu majwi.
models_choice_save_body=Inyandiko n'amafoto ya sikirini biboneka neza kimwe mu Cyongereza. Amafoto aboneka gusa ukurikije amagambo arimo, ntabwo ari ukurikije ibyo yerekana, bityo ifoto isanzwe iboneka ku izina ryayo gusa. Gushakisha mu Luganda no mu Giswahili biri hasi, kandi nta majwi yo muri videwo cyangwa mu majwi. Ibisigaye ushobora kubyongeraho nyuma.
models_installed_standard=Moderi za Standard: gushakisha kwiza cyane mu ndimi zose, hamwe n'amajwi yo muri videwo no mu majwi.
models_installed_save=Moderi za Kuzigama data: inyandiko n'amafoto ya sikirini biboneka neza nka Standard mu Cyongereza. Amafoto aboneka ukurikije amagambo arimo, ntabwo ari ukurikije ibyo yerekana. Gushakisha mu Luganda no mu Giswahili biri hasi, kandi nta majwi yo muri videwo cyangwa mu majwi.
models_upgrade_note=Kugira ngo ubone moderi za Standard (%1$s MB), kura trawl-models.zip maze uyihitemo hano. Urutonde rw'amafayiro yawe ruguma ho: gushakisha ku izina ry'ifayiro bikomeza gukora hagati aho. Amagambo ari mu nyandiko no mu mafoto, no gushakisha ukurikije ibisobanuro, bigaruka uko buri fayiro isomwa nanone.
models_upgraded=Moderi za Standard zashyizwemo. Ubu Trawl yongeye gusoma amafayiro yawe ikoresheje moderi nziza kurushaho. Amazina y'amafayiro akomeza gukora hagati aho; amagambo ari mu nyandiko no mu mafoto agaruka uko amafayiro asomwa.
first_zip_question=Gusiba %1$s ubu? Ingana na %2$s kandi Trawl ntikiyikeneye. Ushobora kongera kuyikura nyuma.
first_zip_delete=Yisibe
first_zip_keep=Yigumemo
first_zip_deleted=%1$s yasibwe, hahawe umwanya wa %2$s.
first_zip_delete_failed=Trawl ntiyashoboye gusiba %1$s. Ushobora kuyisiba ubwawe.
first_models_ready=Moderi zashyizwemo. Trawl isoma amafoto n'inyandiko ikurikije ibisobanuro.
first_models_installing=Gusuzuma no kongeramo %1$s kuri %2$s
first_addons_body=Ibi bituma Trawl irushaho kuba nziza ariko ntibiba ngombwa. Nka moderi, buri kimwe ni fayiro ubanza gukoporora kuri iyi mudasobwa.
first_addons_skip=Simbuka ibi ubu. Ushobora kubyongeramo nyuma muri Igenamiterere.
first_models_skip_note=Ushobora gutangira udafite moderi. Gushakisha bizakora ku mazina n'amagambo, maze ibisobanuro bitangire umaze kuzongeramo.
first_start_hint=Hitamo nibura ububiko bumwe kugira ngo utangire.
