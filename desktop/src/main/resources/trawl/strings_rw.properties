auth_reason_change=Hindura ifunga rya porogaramu ya Trawl
auth_title_unhide=Gusubiza ubu bubiko mu bishakishwa?
auth_body_unhide=Emeza ko ari wowe mbere yo kongera kwerekana amafoto y'ubu bubiko mu byabonetse.
auth_reason_unhide=Subiza ububiko bwite mu bishakishwa muri Trawl
hidden_show=Erekana ibyihishe
hidden_cover=Ongera uhishe
hidden_hint=Trawl yahumye amafoto agaragara nk'ay'ubuzima bwite. Aracyabonwa mu gushakisha. Koresha ijisho kugira ngo werekane rimwe.
