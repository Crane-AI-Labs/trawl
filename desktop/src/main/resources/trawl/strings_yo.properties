pause_no_permission_detail=Kọ̀ǹpútà yìí kò jẹ́ kí Trawl wo inú àwọn fódà tí o yàn. Fààyè gbà á, kíkà yóò sì tẹ̀síwájú fúnra rẹ̀. Wíwá ṣì ń ṣiṣẹ́ lórí ohun tí Trawl ti kọ́.
pause_no_permission_detail_mac=macOS béèrè bóyá Trawl lè wo inú àwọn fódà rẹ, ìdáhùn sì jẹ́ rárá. Ṣí System Settings, lẹ́yìn náà Privacy & Security, lẹ́yìn náà Files & Folders, kí o sì tan Trawl. Kíkà yóò tẹ̀síwájú fúnra rẹ̀. Wíwá ṣì ń ṣiṣẹ́.
blocked_system_one=Fódà %1$s nínú àwọn fódà tí o yàn ni a ti pa mọ́ fún Trawl (%2$s), nítorí náà Trawl fò ó dá. A kò yọ ohunkóhun nínú rẹ̀ kúrò nínú ìwárí, a sì ka ìyókù bí ó ṣe yẹ.
blocked_system_other=Àwọn fódà %1$s nínú àwọn fódà tí o yàn ni a ti pa mọ́ fún Trawl (%2$s), nítorí náà Trawl fò wọ́n dá. A kò yọ ohunkóhun nínú wọn kúrò nínú ìwárí, a sì ka ìyókù bí ó ṣe yẹ.
blocked_fix_mac=Láti jẹ́ kí Trawl wọlé, ṣí System Settings, lẹ́yìn náà Privacy & Security, lẹ́yìn náà Files & Folders (tàbí Full Disk Access), kí o sì tan Trawl. Lẹ́yìn náà yan Tún ṣàyẹ̀wò.
blocked_fix=Láti jẹ́ kí Trawl wọlé, yí àṣẹ àwọn fódà wọ̀nyí padà kí àkọọ́lẹ̀ rẹ lè ṣí wọn. Lẹ́yìn náà yan Tún ṣàyẹ̀wò.
blocked_other_one=Fódà %1$s kò ṣí ní ìsinsin yìí (díìsìkì tí a yọ kúrò, tàbí ibi ìpínpín nẹ́tíwọ́ọ̀kì tó já). Trawl pa ohun tó mọ̀ nípa rẹ̀ mọ́, yóò sì tún wò ó nígbà ìṣàyẹ̀wò tó kàn.
blocked_other_other=Àwọn fódà %1$s kò ṣí ní ìsinsin yìí (díìsìkì tí a yọ kúrò, tàbí ibi ìpínpín nẹ́tíwọ́ọ̀kì tó já). Trawl pa ohun tó mọ̀ nípa wọn mọ́, yóò sì tún wò wọ́n nígbà ìṣàyẹ̀wò tó kàn.
