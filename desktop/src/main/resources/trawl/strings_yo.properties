welcome_point_private_title=Ó wà lórí kọ̀ǹpútà yìí
welcome_point_private_body=AI tó ń lóye àwọn fáìlì rẹ ń ṣiṣẹ́ níbí. Trawl kì í sopọ̀ mọ́ intanẹ́ẹ̀tì láé: kò sí àkọọ́lẹ̀, kò sí ìmúdójúìwọ̀n, kò sí ìtọpa.
first_folders_title=Àwọn fódà láti wá
first_folders_body=Trawl ń ka àwọn fódà tí o yàn níbí nìkan. A kì í ka àwọn fódà tí a fi pamọ́.
first_folders_missing=a kò rí i lórí kọ̀ǹpútà yìí
first_models_title=Àwọn módẹ́lì
first_models_body=Trawl nílò fáìlì módẹ́lì láti lóye àwọn àwòrán àti ìtumọ̀. Ó jẹ́ fáìlì àmì-ìfọwọ́sí kan náà tí fóònù ń lò. Trawl kò gba nǹkan kan sílẹ̀: ìwọ ni o gba fáìlì náà pẹ̀lú aṣàwákiri rẹ, Trawl sì máa ṣàyẹ̀wò àmì-ìfọwọ́sí rẹ̀ kí ó tó lò ó.
first_models_found=Ti rí %1$s nínú %2$s (%3$s).
first_models_none=A kò rí fáìlì módẹ́lì nínú Downloads. Gba trawl-models.zip, tàbí yan fáìlì tí a fún ọ.
first_models_none_named=A kò rí fáìlì módẹ́lì nínú Downloads. Gba %1$s, tàbí yan fáìlì tí a fún ọ.
models_choice_standard_body=Ìwárí tó dára jù ní gbogbo èdè, pẹ̀lú ọ̀rọ̀ ẹnu nínú àwọn fídíò àti àwọn ohùn tí a gbà sílẹ̀.
models_choice_save_body=A rí àwọn àkọsílẹ̀ àti àwòrán ìbòjú dáadáa lédè Gẹ̀ẹ́sì bákan náà. A rí àwọn fọ́tò nípa ọ̀rọ̀ inú wọn nìkan, kì í ṣe nípa ohun tí wọ́n fi hàn, nítorí náà fọ́tò lásán ni a rí nípa orúkọ rẹ̀ nìkan. Ìwárí lédè Luganda àti Swahili kò lágbára tó, kò sì sí ọ̀rọ̀ ẹnu nínú àwọn fídíò tàbí ohùn tí a gbà sílẹ̀. O lè fi ìyókù kún un lẹ́yìn náà.
models_installed_standard=Àwọn módẹ́lì Standard: ìwárí tó dára jù ní gbogbo èdè, pẹ̀lú ọ̀rọ̀ ẹnu nínú àwọn fídíò àti àwọn ohùn tí a gbà sílẹ̀.
models_installed_save=Àwọn módẹ́lì Fi dátà pamọ́: a rí àwọn àkọsílẹ̀ àti àwòrán ìbòjú dáadáa bí ti Standard lédè Gẹ̀ẹ́sì. A rí àwọn fọ́tò nípa ọ̀rọ̀ inú wọn, kì í ṣe nípa ohun tí wọ́n fi hàn. Ìwárí lédè Luganda àti Swahili kò lágbára tó, kò sì sí ọ̀rọ̀ ẹnu nínú àwọn fídíò tàbí ohùn tí a gbà sílẹ̀.
models_upgrade_note=Láti gba àwọn módẹ́lì Standard (%1$s MB), gba trawl-models.zip kí o sì yàn án níbí. Àtòjọ àwọn fáìlì rẹ wà bẹ́ẹ̀: wíwá nípa orúkọ fáìlì ń ṣiṣẹ́ lọ lásìkò yìí. Àwọn ọ̀rọ̀ inú àwọn àkọsílẹ̀ àti àwòrán, àti ìwárí nípa ìtumọ̀, máa padà bí a ṣe ń tún ka fáìlì kọ̀ọ̀kan.
models_upgraded=A ti fi àwọn módẹ́lì Standard sílò. Trawl ń tún ka àwọn fáìlì rẹ báyìí pẹ̀lú módẹ́lì tó dára jù. Orúkọ fáìlì ń ṣiṣẹ́ lọ lásìkò yìí; àwọn ọ̀rọ̀ inú àwọn àkọsílẹ̀ àti àwòrán máa padà bí a ṣe ń ka àwọn fáìlì.
first_zip_question=Pa %1$s rẹ́ báyìí? Ó jẹ́ %2$s, Trawl kò sì nílò rẹ̀ mọ́. O lè tún gbà á sílẹ̀ lẹ́yìn náà.
first_zip_delete=Pa á rẹ́
first_zip_keep=Fi í sílẹ̀
first_zip_deleted=A ti pa %1$s rẹ́, a sì tú %2$s sílẹ̀.
first_zip_delete_failed=Trawl kò lè pa %1$s rẹ́. O lè pa á rẹ́ fúnra rẹ.
first_models_ready=A ti fi àwọn módẹ́lì sílò. Trawl ń ka àwọn àwòrán àti àkọsílẹ̀ nípa ìtumọ̀.
first_models_installing=Ń ṣàyẹ̀wò àti fífi %1$s nínú %2$s sílò
first_addons_body=Wọ́n ń mú Trawl dára sí i ṣùgbọ́n a kò nílò wọn. Bí àwọn módẹ́lì, ọ̀kọ̀ọ̀kan jẹ́ fáìlì tí o kọ́kọ́ dà kọ sórí kọ̀ǹpútà yìí.
first_addons_skip=Fò wọ́n dá fún báyìí. O lè fi èyíkéyìí kún un lẹ́yìn náà nínú Ètò.
first_models_skip_note=O lè bẹ̀rẹ̀ láìsí àwọn módẹ́lì. Wíwá yóò ṣiṣẹ́ lórí orúkọ àti ọ̀rọ̀, ìtumọ̀ yóò sì bẹ̀rẹ̀ nígbà tí o bá fi wọ́n kún un.
first_start_hint=Yan fódà kan ó kéré tán láti bẹ̀rẹ̀.
