demo_meta_voice=Ohùn · WhatsApp · láti ọwọ́ Ama · Oct 3
demo_snip_wifi=Ilé «wifi»: HomeNet-5G «Ọ̀rọ̀ ìwọlé»: blue-teapot-72
demo_snip_receipt=CORNER «ILÉ ÌTAJÀ FÓÒNÙ» · «Ìwé-ẹ̀rí» 0412 · Ààbò ojú fóònù, àpò fóònù, chájì USB-C
demo_snip_voice=…«owó ilé» yóò tó san ní Ọjọ́ Ẹtì, nítorí náà…
demo_aria=Trawl, ń wá nǹkan lórí kọ̀ǹpútà. Ayẹyẹ ọjọ́ ìbí rí fọ́tò ọjọ́ ìbí mẹ́ta: àkàrà, obìnrin pẹ̀lú ẹbí rẹ̀, àti ọkùnrin kan níbi ayẹyẹ. Ọ̀rọ̀ ìwọlé wifi rí àwòrán ìbòjú ìjíròrò pẹ̀lú orúkọ nẹ́tíwọ́ọ̀kì àti ọ̀rọ̀ ìwọlé. Ìwé-ẹ̀rí láti ilé ìtajà fóònù rí ìwé-ẹ̀rí PDF kan. Fídíò ajá alárinrin rí fídíò ajá méjì. Ohùn tí a gbà nípa owó ilé rí ohùn kan tí a gbà sílẹ̀, ní 0:42.
refusal_not_signed=Èyí kì í ṣe fáìlì módẹ́lì Trawl: kò ní àmì-ìfọwọ́sí. Tún gba trawl-models.zip sílẹ̀.
refusal_bad_signature=Crane AI Labs kò fi ọwọ́ sí fáìlì yìí, tàbí a yí i padà lẹ́yìn ìfọwọ́sí. Trawl kò ní lò ó.
refusal_bad_manifest=Fáìlì módẹ́lì yìí tuntun ju ohun tí ẹ̀dà Trawl yìí lè kà, tàbí ó ti bàjẹ́.
refusal_wrong_class=Fáìlì módẹ́lì yìí kì í ṣe èyí tí kọ̀ǹpútà yìí lè lò.
refusal_wrong_class_lite=Èyí ni àpò Standard. Kọ̀ǹpútà yìí ní ìrántí díẹ̀, ó sì nílò àpò kékeré.
refusal_damaged=Fáìlì náà ti bàjẹ́ tàbí kò pé. Tún gbà á sílẹ̀.
refusal_already_installed=A ti fi àwọn módẹ́lì wọ̀nyí sílò tẹ́lẹ̀.
refusal_older_version=A ti fi ẹ̀dà tuntun ti àwọn módẹ́lì, tàbí àpapọ̀ tó kún ju èyí lọ, sílò tẹ́lẹ̀. Kò sí ohun tó yí padà.
refusal_no_space=Àyè òfìfo kò tó fún àwọn módẹ́lì.
refusal_cancelled=A ti dá a dúró.
settings_folders_title=Àwọn fódà
settings_folders_body=Trawl ń ka àwọn fódà wọ̀nyí, ó sì ń ṣọ́ wọn: a máa mú àwọn fáìlì tuntun, tí a yí padà àti tí a pa rẹ́ fúnra rẹ̀.
settings_folders_empty=Kò sí fódà síbẹ̀. Fi ọ̀kan kún un láti wá nínú rẹ̀.
settings_folder_files_one=%1$s fáìlì
settings_watch_title=Ń ṣọ́ àwọn àyípadà
settings_watch_native=Ń ṣọ́ pẹ̀lú ẹ̀rọ: àwọn àyípadà máa hàn láàárín ìṣẹ́jú àáyá díẹ̀.
settings_watch_dirs_one=Ń ṣọ́ fódà %1$s pẹ̀lú ẹ̀rọ: àwọn àyípadà máa hàn láàárín ìṣẹ́jú àáyá díẹ̀.
settings_watch_dirs_other=Ń ṣọ́ àwọn fódà %1$s pẹ̀lú ẹ̀rọ: àwọn àyípadà máa hàn láàárín ìṣẹ́jú àáyá díẹ̀.
settings_watch_polling_one=Ń ṣàyẹ̀wò ní ìṣẹ́jú àáyá kọ̀ọ̀kan.
settings_watch_polling_other=Ń ṣàyẹ̀wò ní ìṣẹ́jú àáyá %1$d kọ̀ọ̀kan.
settings_watch_limit=Ń ṣàyẹ̀wò ní ìṣẹ́jú àáyá %1$d kọ̀ọ̀kan: kọ̀ǹpútà yìí fààyè gba ìṣọ́ %2$s, àwọn fódà sì nílò jù bẹ́ẹ̀ lọ.
settings_models_title=Àwọn módẹ́lì
settings_models_ready=A ti fi sílò: %1$s
settings_models_missing=A kò tíì fi sílò.
settings_models_choose=Yan trawl-models.zip
settings_theme_system=Tẹ̀lé kọ̀ǹpútà mi
settings_ocr_title=Kíkà ọ̀rọ̀ inú àwọn àwòrán
settings_ocr_windows=Ń lo ìmọ̀ ọ̀rọ̀ Windows.
settings_ocr_tesseract=Ń lo Tesseract.
settings_ocr_apple=Ń lo Apple Vision.
settings_ocr_none=Kò sí lórí kọ̀ǹpútà yìí: fi Tesseract sílò láti rí àwọn ọ̀rọ̀ inú àwọn àwòrán ìbòjú.
settings_data_title=Ohun tí Trawl ń pamọ́
settings_data_body=Àtòjọ náà wà nínú %1$s. Pa fódà yẹn rẹ́ láti gbàgbé gbogbo ohun tí Trawl ti kọ́.
settings_forgot=A ti gbàgbé %1$s: ohun tí Trawl ti kọ́ nípa %2$s. Ó ń tún ka àwọn fódà rẹ láti ìbẹ̀rẹ̀. A kò fọwọ́ kan àwọn fáìlì rẹ.
settings_forgot_nothing=Trawl kò tíì kọ́ nǹkankan, nítorí náà kò sí ohun láti gbàgbé. A kò fọwọ́ kan àwọn fáìlì rẹ.
settings_forget=Gbàgbé gbogbo ohun tí Trawl ti kọ́
settings_choose_dialog=Yan fódà láti wá nínú rẹ̀
settings_choose_models_dialog=Yan trawl-models.zip
settings_about_private=Trawl kò ní kóòdù nẹ́tíwọ́ọ̀kì. Àwọn fáìlì rẹ àti ohun tí ó kọ́ láti inú wọn kì í jáde kúrò lórí kọ̀ǹpútà yìí láé.
settings_recordings_hint=Àwọn ohùn tí a gbà sílẹ̀ àti ohùn inú àwọn fídíò. Ọ̀rọ̀ ẹnu lédè Gẹ̀ẹ́sì nìkan ni a ń yí padà sí ọ̀rọ̀ tí a kọ.
settings_media_no_ffmpeg=Àwọn fídíò àti ohùn tí a gbà sílẹ̀ nílò ffmpeg, kò sì sí lórí kọ̀ǹpútà yìí. Fi sílò (fún àpẹẹrẹ: sudo apt install ffmpeg), Trawl yóò sì bẹ̀rẹ̀ sí í kà wọ́n.
settings_media_no_decoder=Kọ̀ǹpútà yìí kò ní ọ̀nà láti ṣí àwọn fídíò àti ohùn tí a gbà sílẹ̀ fún Trawl. Wọ́n wà nínú àtòjọ, a sì fò wọ́n dá.
settings_media_no_speech=A kò tíì fi àwọn módẹ́lì ọ̀rọ̀ ẹnu sílò, nítorí náà a ń rí àwọn ohùn tí a gbà sílẹ̀ àti ohùn fídíò nípa àmì ohùn nìkan. Fi fáìlì módẹ́lì Trawl tuntun jù sílò láti tan ọ̀rọ̀ ẹnu.
settings_storage_media=Àti: %1$s, %2$s
settings_heic_missing_linux=Kọ̀ǹpútà yìí kò lè ṣí àwọn àwòrán HEIC, HEIF tàbí AVIF (irú èyí tí ọ̀pọ̀ fóònù àti iPhone ń ṣe), nítorí náà Trawl lè rí wọn nípa orúkọ nìkan. Láti ṣàtúnṣe rẹ̀, fi libheif sílò (ètò heif-convert, tó sábà wà nínú àpò libheif-examples) tàbí ImageMagick tó ní àtìlẹ́yìn HEIC, lẹ́yìn náà tún Trawl bẹ̀rẹ̀.
settings_heic_missing_windows=Kọ̀ǹpútà yìí kò lè ṣí àwọn àwòrán HEIC, HEIF tàbí AVIF (irú èyí tí ọ̀pọ̀ fóònù àti iPhone ń ṣe), nítorí náà Trawl lè rí wọn nípa orúkọ nìkan. Láti ṣàtúnṣe rẹ̀, fi HEIF Image Extensions ọ̀fẹ́ ti Microsoft kún un láti Microsoft Store, lẹ́yìn náà tún Trawl bẹ̀rẹ̀.
settings_kinds_all_off=Gbogbo nǹkan ti wà ní pípa, nítorí náà Trawl kò kà tàbí rí nǹkankan. Tan ọ̀kan láti tún wá.
settings_excluded_add=Fò fódà kan dá
settings_excluded_pick=Yan fódà láti fò dá
settings_excluded_not_inside=Yan fódà kan tó wà nínú èyí tí o ti ń wá.
settings_excluded_is_chosen=Gbogbo fódà yẹn ni a ń wá nínú rẹ̀. Lo Yọ kúrò lókè láti dẹ́kun kíkà á.
settings_excluded_not_folder=Ìyẹn kì í ṣe fódà.
learn_speed_title=Ìyára iṣẹ́
learn_gentle_hint=Àwọn okùn ẹ̀rọ ìṣiṣẹ́ díẹ̀, kò sì sí kíkà nígbà tí kọ̀ǹpútà yìí bá ń lo bátìrì. Ooru àti ariwo afẹ́fẹ́ kéré jù; ohunkóhun tuntun dúró de chájì.
learn_balanced_hint=Ọ̀nà àtẹ̀yìnwá: ẹ̀rọ náà yan ìyára tirẹ̀, lórí bátìrì tàbí kó má jẹ́ bẹ́ẹ̀.
learn_fast_hint=Ó fún iṣẹ́ náà ní okùn ẹ̀rọ ìṣiṣẹ́ tó pọ̀ bí ó ti lè ṣèrànwọ́, lórí bátìrì pẹ̀lú. Ó máa ń gbóná, ó sì máa ń pariwo jù, lórí àwọn kọ̀ǹpútà kan kò sì yára ju Déédé lọ.
settings_speed_rate_one=Ìgbà yìí: bíi fáìlì %1$s ní ìṣẹ́jú kan.
settings_speed_rate_other=Ìgbà yìí: bíi fáìlì %1$s ní ìṣẹ́jú kan.
pause_not_charging_detail=Ìyára Jẹ́jẹ́ ń kà nìkan nígbà tí a bá ti kọ̀ǹpútà yìí mọ́ iná. Wíwá ń ṣiṣẹ́ lásìkò yìí.
settings_storage_cache=Ibi ìfipamọ́ ìgbà díẹ̀ ti ẹ̀rọ
settings_storage_files=Àwọn fáìlì tí Trawl mọ̀: %1$s, %2$s, %3$s
settings_delete_hint=Ó ń yọ àtòjọ tí Trawl kọ́ láti inú àwọn fáìlì rẹ kúrò: orúkọ wọn, àwọn ọ̀rọ̀ inú àwọn àkọsílẹ̀ rẹ, ọ̀rọ̀ tí a kà nínú àwọn àwòrán àti ohun tí AI kọ sílẹ̀ nípa fáìlì kọ̀ọ̀kan. A kò fọwọ́ kan àwọn fáìlì tìrẹ, àwọn ètò rẹ (pẹ̀lú àwọn fódà tí a fò dá) àti àwọn módẹ́lì. Trawl yóò wá tún ka àwọn fódà rẹ láti ìbẹ̀rẹ̀.
settings_language_system=Tẹ̀lé kọ̀ǹpútà mi
settings_startup_title=Ìbẹ̀rẹ̀
settings_startup_label=Bẹ̀rẹ̀ Trawl nígbà tí mo bá wọlé
settings_startup_hint=Ó wà ní pípa àyàfi tí o bá tan án. Trawl yóò ṣí fèrèsé rẹ̀ nígbà tí o bá wọlé sórí kọ̀ǹpútà yìí, yóò sì máa ka àwọn fódà rẹ láti ibẹ̀.
settings_startup_failed=Kọ̀ǹpútà yìí kò jẹ́ kí Trawl yí èyí padà. Kò sí ohun tó yí padà.
settings_report_hint=Ó ń dà ìjábọ̀ kúkúrú kọ sínú ìgbékalẹ̀ ìdàkọ: àwọn ẹ̀dà Trawl àti ẹ̀rọ, ìwọ̀n kọ̀ǹpútà yìí, iye àwọn fáìlì, ìwọ̀n àtòjọ, ìyára kíkà tó kẹ́yìn àti àwọn àṣìṣe tuntun. Kò ní orúkọ fáìlì, orúkọ fódà tàbí ọ̀rọ̀ láti inú àwọn fáìlì rẹ, a kò sì fi nǹkankan ránṣẹ́ sí ibikíbi. Lẹ̀ ẹ́ sí ibi tí o ti ròyìn ìṣòro náà.
settings_report_copy=Dàkọ àwọn àyẹ̀wò
settings_report_copied=A ti dà àwọn àyẹ̀wò kọ. A kò fi nǹkankan ránṣẹ́ sí ibikíbi.
settings_report_copy_failed=Kọ̀ǹpútà yìí kò fún Trawl ní ìgbékalẹ̀ ìdàkọ rẹ̀.
settings_report_logs=Ṣí fódà àkọsílẹ̀ ìṣẹ̀lẹ̀
settings_report_logs_failed=Kò lè ṣí fódà àkọsílẹ̀ ìṣẹ̀lẹ̀.
settings_about_runtime=Ẹ̀rọ Java: %1$s
settings_about_model=Wíwá ń lo EmbeddingGemma 2 láti ọwọ́ Google (Apache 2.0), pátápátá lórí kọ̀ǹpútà yìí.
licences_intro=%1$s dá lórí àwọn iṣẹ́ tí ó wà nísàlẹ̀ yìí. Àwọn ìwé àṣẹ bèèrè fún àwọn àkíyèsí wọ̀nyí, bẹ́ẹ̀ sì ni a ṣe ń dúpẹ́ pẹ̀lú.
licences_section_components=Gbogbo nǹkan mìíràn nínú %1$s
licences_includes=Àwọn ibi ìkówèé: %1$s
dialog_remove_folder_title=Dẹ́kun wíwá nínú fódà yìí?
dialog_remove_folder_body=Trawl yóò gbàgbé ohun tí ó kọ́ láti inú %1$s. A kò fọwọ́ kan àwọn fáìlì fúnra wọn.
dialog_remove_confirm=Dẹ́kun wíwá nínú rẹ̀
dialog_forget_title=Gbàgbé gbogbo rẹ̀?
dialog_forget_body=Trawl yóò pa ohun tí ó ti kọ́ rẹ́, yóò sì tún ka àwọn fódà rẹ láti ìbẹ̀rẹ̀. A kò fọwọ́ kan àwọn fáìlì rẹ.
dialog_forget_confirm=Gbàgbé rẹ̀
lock_scope_does=Ìtìpa náà ń fi àwọn àbájáde àti àwọn àkọ́yẹ̀wò rẹ pamọ́ lójú ìbòjú títí tí o ó fi ṣí i.
lock_scope_doesnt=Kì í ṣe fífi nǹkan pamọ́ lábẹ́ kóòdù. Ẹnikẹ́ni tó bá lè ṣí àwọn fáìlì kọ̀ǹpútà yìí ṣì lè ka àtòjọ, àwọn ètò Trawl àti àwọn fáìlì rẹ. Fún ìyẹn, tan fífi kóòdù bo díìsìkì kọ̀ǹpútà rẹ (FileVault, BitLocker tàbí LUKS).
lock_body=Ṣí i láti rí àwọn àbájáde rẹ.
lock_unlock_with=Ṣí i pẹ̀lú %1$s
lock_passphrase=Ọ̀rọ̀ ìgbaniwọlé
lock_wrong=Ìyẹn kì í ṣe ọ̀rọ̀ ìgbaniwọlé.
lock_wait=Ìgbìyànjú pọ̀ jù. Gbìyànjú lẹ́ẹ̀kan sí i láàárín ìṣẹ́jú àáyá %1$s.
lock_not_set=Kò sí ọ̀rọ̀ ìgbaniwọlé tí a ṣètò. Pa ìtìpa, kí o sì tún tan án nínú Ètò, Ìpamọ́.
lock_os_cancelled=A ti fagilé e. Gbìyànjú lẹ́ẹ̀kan sí i, tàbí lo ọ̀rọ̀ ìgbaniwọlé rẹ.
lock_os_denied=Kọ̀ǹpútà rẹ kò gbà á. Gbìyànjú lẹ́ẹ̀kan sí i, tàbí lo ọ̀rọ̀ ìgbaniwọlé rẹ.
lock_os_error=Ìbéèrè ṣíṣí kọ̀ǹpútà rẹ kò ṣiṣẹ́. Lo ọ̀rọ̀ ìgbaniwọlé rẹ.
lock_os_waiting=Ń dúró de %1$s…
lock_use_passphrase=Lo ọ̀rọ̀ ìgbaniwọlé dípò rẹ̀
auth_title_reveal=Fi àwọn àwòrán tí a fi pamọ́ hàn?
auth_title_change=Yí ìtìpa padà?
auth_body_reveal=Jẹ́rìí sí i pé ìwọ ni kí a tó fi àwọn àwòrán tí a fi pamọ́ àti àwọn fáìlì ẹlẹgẹ́ hàn.
auth_body_change=Jẹ́rìí sí i pé ìwọ ni kí a tó yí ìtìpa padà.
auth_confirm=Jẹ́rìí sí i
auth_reason_reveal=Fi àwọn àwòrán tí a fi pamọ́ hàn nínú Trawl
auth_reason_change=Yí ìtìpa àpù Trawl padà
auth_title_unhide=Jẹ́ kí fódà yìí ṣeé wá lẹ́ẹ̀kan sí i?
auth_body_unhide=Jẹ́rìí sí i pé ìwọ ni kí a tó tún fi àwọn àwòrán inú fódà yìí hàn nínú àwọn àbájáde.
auth_reason_unhide=Jẹ́ kí fódà àṣírí ṣeé wá nínú Trawl
hidden_show=Fi èyí tí a fi pamọ́ hàn
hidden_cover=Tún fi pamọ́
hidden_hint=Trawl ti mú àwọn àwòrán tó jọ ti àṣírí di bàìbàì. Wíwá ṣì ń rí wọn. Lo ojú láti fi ọ̀kan hàn.
hidden_eye_show=Fi àwòrán yìí hàn
hidden_eye_hide=Fi àwòrán yìí pamọ́
hidden_label=A fi pamọ́ nítorí ó jọ ti àṣírí
hidden_tile=Àwòrán tí a fi pamọ́
hidden_denied=Kọ́kọ́ ṣí Trawl láti fi àwọn àwòrán tí a fi pamọ́ hàn.
hidden_revealed=Ń fi àwọn àwòrán tí a fi pamọ́ hàn títí tí o ó fi kúrò ní Trawl.
sensitive_mark=Sàmì sí i bí ẹlẹgẹ́
sensitive_badge=Ẹlẹgẹ́
sensitive_marked=A ti sàmì sí i bí ẹlẹgẹ́.
sensitive_unmarked=A kò sàmì sí i bí ẹlẹgẹ́ mọ́.
sensitive_folder_on=Kà gbogbo fódà yìí sí àṣírí
sensitive_folder_off=Dẹ́kun kíkà fódà yìí sí àṣírí
leave_title=Mú fáìlì ẹlẹgẹ́ kúrò nínú Trawl?
leave_body_one=A ti sàmì sí fáìlì yìí bí ẹlẹgẹ́. Dídà á kọ, pípín in tàbí ṣíṣí i nínú àpù míì máa mú un jáde kúrò lábẹ́ ìtìpa Trawl.
leave_body_other=A ti sàmì sí %1$s nínú àwọn fáìlì wọ̀nyí bí ẹlẹgẹ́. Dídà wọ́n kọ, pípín wọn tàbí ṣíṣí wọn nínú àpù míì máa mú wọn jáde kúrò lábẹ́ ìtìpa Trawl.
leave_confirm=Tẹ̀síwájú
lock_offer_title=Ti Trawl pa pẹ̀lú?
lock_offer_body=O ti sàmì sí fáìlì kan bí ẹlẹgẹ́. Ìtìpa àpù máa ń fi àwọn àbájáde rẹ pamọ́ lẹ́yìn ṣíṣí kọ̀ǹpútà rẹ tàbí ọ̀rọ̀ ìgbaniwọlé nígbà tí o bá kúrò. Ó kàn ń fi ojú pamọ́ ni. Kì í fi nǹkankan pamọ́ lábẹ́ kóòdù.
lock_offer_set=Ṣètò ìtìpa
settings_privacy_intro=Yan ohun tí Trawl yóò fi pamọ́ àti ẹni tó lè rí àwọn àbájáde rẹ. Kò sí ohun tó wà níbí tó ń jáde kúrò lórí kọ̀ǹpútà yìí.
privacy_lock_label=Ìtìpa àpù
privacy_lock_hint=Ó ń fi àwọn àbájáde àti àwọn àkọ́yẹ̀wò rẹ pamọ́ títí tí o ó fi ṣí i.
privacy_lock_on=Ìtìpa wà ní títàn.
privacy_lock_off=Ìtìpa wà ní pípa.
privacy_lock_enable=Tan ìtìpa
privacy_lock_disable=Pa ìtìpa
privacy_lock_enabled=Ìtìpa wà ní títàn.
privacy_lock_disabled=Ìtìpa wà ní pípa.
privacy_lock_after=Ti pa nígbà tí
privacy_after_0=mo bá kúrò ní Trawl
privacy_after_one=mo bá ti kúrò fún ìṣẹ́jú %1$s
privacy_after_other=mo bá ti kúrò fún ìṣẹ́jú %1$s
privacy_use_os_label=Ṣí i pẹ̀lú %1$s
privacy_os_touchid=Touch ID
privacy_os_hello=Windows Hello
privacy_os_generic=ọ̀nà ṣíṣí kọ̀ǹpútà rẹ
privacy_os_unavailable=%1$s kò ṣètò lórí kọ̀ǹpútà yìí, nítorí náà a ń lo ọ̀rọ̀ ìgbaniwọlé.
privacy_os_none=Kọ̀ǹpútà yìí kò ní ṣíṣí pẹ̀lú ìka ọwọ́ tàbí ojú tí Trawl lè lò níbí, nítorí náà ìtìpa ń lo ọ̀rọ̀ ìgbaniwọlé.
privacy_pass_new=Ọ̀rọ̀ ìgbaniwọlé tuntun
privacy_pass_again=Tún kọ ọ́
privacy_pass_min=Lo àwọn àmì %1$s ó kéré tán.
privacy_pass_mismatch=Àwọn méjèèjì kò jọra.
privacy_pass_blank=Ọ̀rọ̀ ìgbaniwọlé kò lè jẹ́ àyè òfìfo nìkan.
privacy_pass_forgot=Trawl kò lè gba ọ̀rọ̀ ìgbaniwọlé tí a gbàgbé padà. Tí o bá sọ ọ́ nù, pa fáìlì privacy.json rẹ́ nínú fódà dátà Trawl: ìyẹn máa yọ ìtìpa àti àwọn àmì ẹlẹgẹ́ rẹ kúrò. A kò fọwọ́ kan àwọn fáìlì rẹ àti àtòjọ.
privacy_need_proof=Kọ́kọ́ ṣí i láti yí ìtìpa padà.
privacy_blur_label=Mú àwọn àwòrán tó jọ ti àṣírí di bàìbàì
privacy_blur_hint=A mú àwòrán di bàìbàì nínú àtòjọ àti àkọ́yẹ̀wò títí tí o ó fi fi hàn. Ó ṣì wà nínú àwọn àbájáde rẹ àti ní ìpele wọn.
privacy_blur_needs_pack=Fi àpò Ìpamọ́ kún un lábẹ́ Àwọn àfikún láti tan èyí.
privacy_capture_label=Pa Trawl mọ́ kúrò nínú àwòrán ìbòjú àti pípín ìbòjú
privacy_capture_hint_windows=Nígbà tí Trawl bá ń fi àwọn nǹkan tí a fi pamọ́ tàbí ẹlẹgẹ́ hàn, a ń bèèrè lọ́wọ́ Windows láti pa fèrèsé náà mọ́ kúrò nínú àwòrán ìbòjú àti pípín ìbòjú (àwọn ẹ̀dà àtijọ́ máa ń fi hàn bí onígun dúdú).
privacy_capture_hint_mac=Nígbà tí Trawl bá ń fi àwọn nǹkan tí a fi pamọ́ tàbí ẹlẹgẹ́ hàn, a ń bèèrè lọ́wọ́ macOS láti pa fèrèsé náà mọ́ kúrò nínú àwòrán ìbòjú. Àwọn irinṣẹ́ kan ṣì lè rí i.
privacy_capture_hint_linux=Linux kò fún àwọn àpù ní ọ̀nà tó dájú láti ṣe èyí, nítorí náà Trawl kò gbìyànjú.
privacy_marked_one=A ti sàmì sí fáìlì %1$s bí ẹlẹgẹ́.
privacy_marked_other=A ti sàmì sí àwọn fáìlì %1$s bí ẹlẹgẹ́.
privacy_damaged=Trawl kò lè ka àwọn ètò ìpamọ́ rẹ̀, nítorí náà ó bẹ̀rẹ̀ lẹ́ẹ̀kan sí i: ìtìpa wà ní pípa, kò sì sí ohun tí a sàmì sí.
privacy_recovered=Àwọn ètò ìpamọ́ Trawl ti bàjẹ́. A mú wọn padà láti ẹ̀dà tó dára tó kẹ́yìn.
privacy_folders_hint=A máa ń kà àwọn àwòrán inú àwọn fódà wọ̀nyí sí àṣírí nígbà gbogbo.
privacy_folders_empty=Kò sí fódà àṣírí síbẹ̀.
privacy_folders_add=Fi fódà àṣírí kún un
privacy_folders_pick=Yan fódà láti pa mọ́ bí àṣírí
privacy_folders_bad=Yan fódà kan tó wà nínú èyí tí Trawl ń wá. Láti dẹ́kun wíwá nínú gbogbo fódà kan, yọ ọ́ kúrò lábẹ́ Àwọn fódà.
report_card_title=Trawl dẹ́kun láìròtẹ́lẹ̀. Ṣé kí a ròyìn rẹ̀?
report_card_body=Ìjábọ̀ náà kò ní orúkọ fáìlì, àwọn àwárí tàbí ọ̀rọ̀ láti àwọn fáìlì rẹ nínú. Ìwọ yóò kọ́kọ́ kà á. A kò fi nǹkankan ránṣẹ́: ìwọ ni o dà á kọ tàbí o fi pamọ́, o sì fi ránṣẹ́ fúnra rẹ.
settings_report_open_hint=Ó ń pèsè ìjábọ̀ tí o lè kà, lẹ́yìn náà dà kọ tàbí fi pamọ́. Ó ní àwọn ẹ̀dà Trawl àti ẹ̀rọ, ìwọ̀n kọ̀ǹpútà yìí, iye àwọn nǹkan, àwọn ètò bí títàn tàbí pípa, àti àwọn ipa àṣìṣe láìsí àwọn ọ̀rọ̀ wọn. A kò fi nǹkankan ránṣẹ́ sí ibikíbi.
report_hint=Èyí ni gbogbo ohun tí ìjábọ̀ náà ní. Àwọn fáìlì, fódà àti àwárí rẹ kò sí nínú rẹ̀.
report_note_hint=A fi ìkọsílẹ̀ rẹ kún un bí o ṣe kọ ọ́, nítorí náà fi ohunkóhun tó jẹ́ àṣírí sílẹ̀. A yọ ohunkóhun tó rí bí ọ̀nà fáìlì kúrò.
report_copy=Dà ìjábọ̀ kọ
report_copied=A ti dà ìjábọ̀ kọ. A kò fi nǹkankan ránṣẹ́ sí ibikíbi.
report_copy_failed=Kọ̀ǹpútà yìí kò fún Trawl ní ìgbékalẹ̀ ìdàkọ rẹ̀. Lo Fi pamọ́ dípò rẹ̀.
report_mail=Ṣí ímeèlì
report_mail_lead=Gbogbo ìjábọ̀ náà wà lórí ìgbékalẹ̀ ìdàkọ mi. Èmi yóò lẹ̀ ẹ́ sísàlẹ̀ ìlà yìí.
report_mail_opened=A ti dà ìjábọ̀ kọ, a sì ti ṣí àpù ímeèlì rẹ. Lẹ̀ ìjábọ̀ náà sínú ímeèlì, lẹ́yìn náà fi ránṣẹ́ fúnra rẹ. Trawl kò fi nǹkankan ránṣẹ́.
report_mail_opened_not_copied=A ti ṣí àpù ímeèlì rẹ, ṣùgbọ́n kọ̀ǹpútà yìí kò fún Trawl ní ìgbékalẹ̀ ìdàkọ rẹ̀. Lo Fi pamọ́ bí fáìlì kí o sì so ó mọ́ ímeèlì.
report_mail_failed=Trawl kò lè ṣí àpù ímeèlì kan. A ti dà ìjábọ̀ kọ tí ìgbékalẹ̀ ìdàkọ bá gbà: lẹ̀ ẹ́ sínú ímeèlì sí %1$s.
report_save=Fi pamọ́ bí fáìlì
report_saved=A ti fi ìjábọ̀ pamọ́. A kò fi nǹkankan ránṣẹ́ sí ibikíbi.
report_save_failed=Trawl kò lè fi ìjábọ̀ pamọ́ sí ibẹ̀.
report_send_to=Láti fi ránṣẹ́, so fáìlì náà mọ́ ímeèlì tàbí lẹ̀ ọ̀rọ̀ náà sínú ímeèlì sí %1$s.
report_kept=Trawl ń pa ó pọ̀ jù ìjábọ̀ ìdúró láìròtẹ́lẹ̀ 10 mọ́ sórí kọ̀ǹpútà yìí, bíi 100 KB. "Gbàgbé gbogbo rẹ̀" ń pa wọ́n rẹ́.
report_logs=Ṣí fódà àkọsílẹ̀ ìṣẹ̀lẹ̀
addons_intro=Àwọn àfikún àyànfẹ́ tí ó mú Trawl dára sí i. Trawl kì í lọ sí orí ayélujára láé, nítorí náà ọ̀kọ̀ọ̀kan jẹ́ fáìlì tí o kọ́kọ́ dà kọ sórí kọ̀ǹpútà yìí. Downloads ni ibi àtẹ̀yìnwá. Gbogbo nǹkan ló ń wà lórí kọ̀ǹpútà yìí.
addon_privacy_name=Àpò Ìpamọ́
addon_privacy_benefit=Ó ń mú àwọn àwòrán tó jọ ti àṣírí di bàìbàì títí tí o ó fi yàn láti fi wọ́n hàn.
addon_privacy_cost=%1$s lórí kọ̀ǹpútà yìí. Kò nílò intanẹ́ẹ̀tì lẹ́yìn tí o bá ti ní fáìlì náà.
addon_speech_name=Ọ̀rọ̀ ẹnu
addon_speech_benefit=Ó ń rí ohun tí a sọ nínú àwọn ohùn tí a gbà sílẹ̀ àti àwọn fídíò.
addon_speech_cost=%1$s lórí kọ̀ǹpútà yìí.
addons_add_from_file=Yan fáìlì kan…
addons_look_in_downloads=Wò ó nínú Downloads
addons_remove_body=Èyí máa tú %1$s sílẹ̀, ó sì máa pa á. A pa àwọn ìdíwọ̀n tó ti ṣe rẹ́, o sì lè fi kún un nígbàkigbà.
addons_found_one=A rí %1$s nínú Downloads.
addons_found_other=A rí àwọn fáìlì %1$s nínú Downloads tó lè jẹ́ àfikún yìí.
addons_declined=O ti yọ àfikún yìí kúrò. Trawl kò ní fi kún un fúnra rẹ̀ mọ́.
addons_checked=A ṣàyẹ̀wò fáìlì kọ̀ọ̀kan pẹ̀lú àmì-ìfọwọ́sí tàbí àmì ìka tí ó dúró kí a tó lò ó. A kọ fáìlì tí kò bá bá a mu.
addons_update_title=Ẹ̀dà tuntun ti %1$s wà nínú àwọn fáìlì rẹ
addons_update_body=Ẹ̀dà %1$s ti ṣetán láti fi kún un. O ní ẹ̀dà %2$s.
addons_update_install=Ṣe ìmúdójúìwọ̀n
addon_problem_not_found=Trawl kò rí àfikún yìí nínú Downloads. Dà fáìlì náà kọ síbẹ̀, tàbí yan án, lẹ́yìn náà gbìyànjú lẹ́ẹ̀kan sí i.
addon_problem_bad_files=Fáìlì náà ti bàjẹ́ tàbí kì í ṣe èyí tí ó yẹ, nítorí náà Trawl kò lò ó. Dà á kọ lẹ́ẹ̀kan sí i, lẹ́yìn náà gbìyànjú.
addon_problem_not_signed=A kò fi ọwọ́ sí fáìlì yìí, nítorí náà Trawl kò lò ó.
addon_problem_bad_signature=Àmì-ìfọwọ́sí fáìlì yìí kò bá a mu. Ó lè jẹ́ pé a yí i padà, nítorí náà Trawl kọ̀ ọ́.
addon_problem_damaged=Fáìlì náà ti bàjẹ́, nítorí náà Trawl kò lò ó. Dà á kọ lẹ́ẹ̀kan sí i, lẹ́yìn náà gbìyànjú.
addon_problem_not_this_addon=Fáìlì yìí kì í ṣe àfikún yìí.
addon_problem_older_version=Èyí jẹ́ ẹ̀dà àtijọ́ ju èyí tó wà lórí kọ̀ǹpútà yìí tẹ́lẹ̀.
addon_problem_no_space=Àyè òfìfo kò tó lórí kọ̀ǹpútà yìí láti fi kún un.
addon_problem_cancelled=A ti fagilé e.
