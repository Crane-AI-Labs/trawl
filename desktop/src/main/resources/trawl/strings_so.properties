privacy_folders_bad=Dooro gal ku dhex jira mid Trawl raadiyo. Si aad u joojiso raadinta gal dhan, ka saar gudaha Galalka.
report_card_title=Trawl si lama filaan ah ayuu u istaagay. Ma soo sheegtaa?
report_card_body=Warbixintu ma laha magacyo fayl, raadin, ama qoraal faylashaada ka yimid. Marka hore waad akhrisaa. Waxba lama diro: adigaa koobiyeeya ama kaydiya, oo adigaa diraya.
report_card_not_now=Hadda ma aha
settings_report_open_hint=Wuxuu dhisaa warbixin aad akhrin karto, kadibna koobiyeyn ama kaydin karto. Waxay ka kooban tahay noocyada Trawl iyo nidaamka, cabbirka kombuyuutarkan, tirooyin, habayn shidan ama dansan, iyo raadadka khaladaadka iyada oo aan farriimahooda lahayn. Waxba meel lama dirayo.
report_hint=Taasi waa wax kasta oo warbixintu ka kooban tahay. Faylashaada, galalkaaga iyo raadintaada ku ma jiraan.
report_note_hint=Qoraalkaaga waxaa la geliyaa sida aad u qortay, markaa ka tag wax kasta oo gaar ah. Wax kasta oo u eg jidka fayl waa la saaraa.
report_copy=Koobiyee warbixinta
report_copied=Warbixintii waa la koobiyeeyay. Waxba meel lama dirin.
report_copy_failed=Kombuyuutarkani Trawl uma bixin clipboard-kiisa. Isticmaal Kaydi halkii.
report_mail=Fur iimaylka
report_mail_lead=Warbixinta oo dhan waxay ku jirtaa clipboard-kayga. Halkan hoose ayaan ku dhejinayaa.
report_mail_opened=Warbixintii waa la koobiyeeyay oo abka iimaylkaaga waa la furay. Ku dheji warbixinta iimaylka, kadibna adigu dir. Trawl waxba ma dirin.
report_mail_opened_not_copied=Abka iimaylkaaga waa la furay, laakiin kombuyuutarkani Trawl uma bixin clipboard-kiisa. Isticmaal Kaydi sida fayl oo ku lifaaq.
report_mail_failed=Trawl ma furi karin abka iimaylka. Warbixinta waa la koobiyeeyay haddii clipboard-ku oggolaaday: ku dheji iimayl loo dirayo %1$s.
report_save=Kaydi sida fayl
