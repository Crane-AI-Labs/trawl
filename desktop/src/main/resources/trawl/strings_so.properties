settings_about_private=Trawl ma laha koodh shabakadeed. Faylashaada iyo waxa ay ka bartay marnaba kombuyuutarkan kama baxaan.
settings_switch_on=Shidan
settings_recordings_hint=Farriimaha codka, duubisyada iyo codka muuqaallada. Hadalka Ingiriisiga oo keliya ayaa erayo loo beddelaa.
settings_media_no_ffmpeg=Muuqaallada iyo duubisyadu waxay u baahan yihiin ffmpeg, kombuyuutarkanna kuma jiro. Rakib (tusaale: sudo apt install ffmpeg) Trawl-na wuu bilaabayaa inuu akhriyo.
settings_media_no_decoder=Kombuyuutarkani Trawl uma furi karo muuqaallo iyo duubisyo. Waxay ku hadhayaan liiska oo waa laga boodaa.
settings_media_no_speech=Moodooyinka hadalka wali lama rakibin, markaa duubisyada iyo codka muuqaallada waxaa lagu helaa oo keliya summadaha codka. Rakib faylka moodooyinka Trawl ee ugu dambeeyay si hadalka loo shido.
settings_storage_media=Sidoo kale: %1$s, %2$s
settings_heic_missing_linux=Kombuyuutarkani ma furi karo sawirrada HEIC, HEIF ama AVIF (nooca taleefannada iyo iPhone-yada badan sameeyaan), markaa Trawl wuxuu ku heli karaa magacooda oo keliya. Si loo hagaajiyo, rakib libheif (barnaamijka heif-convert, inta badan xirmada libheif-examples) ama ImageMagick oo HEIC taageera, kadibna dib u bilow Trawl.
settings_heic_missing_windows=Kombuyuutarkani ma furi karo sawirrada HEIC, HEIF ama AVIF (nooca taleefannada iyo iPhone-yada badan sameeyaan), markaa Trawl wuxuu ku heli karaa magacooda oo keliya. Si loo hagaajiyo, ku dar HEIF Image Extensions ee bilaashka ah ee Microsoft ka bixiyo Microsoft Store, kadibna dib u bilow Trawl.
settings_kinds_all_off=Wax walba waa dansan yihiin, markaa Trawl waxba ma akhriyo mana helo. Shid mid si aad mar kale u raadiso.
settings_excluded_add=Ka boodo gal
