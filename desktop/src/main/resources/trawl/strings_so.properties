settings_data_body=Diiwaanku wuxuu ku jiraa %1$s. Tirtir galkaas si aad u illowdo wax kasta oo Trawl bartay.
settings_forgot=Waa la illaaway %1$s: waxa Trawl ka bartay %2$s. Wuxuu mar kale ka bilaabay akhrinta galalkaaga. Faylashaada lama taaban.
settings_forgot_nothing=Trawl wali waxba ma baran, markaa wax la illoobo ma jirin. Faylashaada lama taaban.
settings_forget=Illow wax kasta oo Trawl bartay
settings_choose_dialog=Dooro gal la raadinayo
