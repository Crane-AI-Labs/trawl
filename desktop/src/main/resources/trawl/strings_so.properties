learn_speed_title=Xawaaraha shaqada
learn_gentle_hint=Dun processor yar, oo aan wax la akhrin inta kombuyuutarku baytari ku shaqeynayo. Kuleylka iyo codka marawaxadda ugu yar; wax cusub waxay sugayaan dallaca.
learn_balanced_hint=Habka caadiga ah: matoorku wuxuu doortaa xawaarihiisa, baytari ama kale.
learn_fast_hint=Shaqada wuxuu siiyaa dun processor intii caawin karta, baytari ku jirta xitaa. Wuu kuleylaa oo wuu qaylodhaa, kombuyuutaro qaar kuma ka dhaqso badna Dhexdhexaad.
settings_speed_rate_one=Fadhigan: qiyaastii %1$s fayl daqiiqad kasta.
settings_speed_rate_other=Fadhigan: qiyaastii %1$s faylal daqiiqad kasta.
pause_not_charging_detail=Xawaaraha Qabow wuxuu akhriyaa oo keliya marka kombuyuutarku korontada ku xiran yahay. Raadintu intaa way shaqaynaysaa.
settings_storage_cache=Kaydka matoorka
settings_storage_files=Faylasha Trawl yaqaan: %1$s, %2$s, %3$s
settings_delete_hint=Wuxuu tirtiraa diiwaanka Trawl ka sameeyay faylashaada: magacyadooda, erayada dukumentiyadaada ku jira, qoraalka sawirrada laga akhriyay iyo waxa AI-gu ka xusay fayl kasta. Faylashaada, habaynta (oo ay ku jiraan galalka laga booday) iyo moodooyinka lama taabanayo. Trawl kadib wuxuu mar kale ka bilaabaa akhrinta galalkaaga.
