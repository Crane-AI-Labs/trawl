lock_scope_doesnt=Waxba ma sir-qoro. Qof kasta oo fura faylasha kombuyuutarkan wuxuu weli akhrin karaa diiwaanka, habaynta Trawl iyo faylashaada. Taas awgeed, shid sir-qorista diskiga kombuyuutarkaaga (FileVault, BitLocker ama LUKS).
