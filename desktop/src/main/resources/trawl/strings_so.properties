settings_startup_label=Bilow Trawl marka aan soo galo
settings_startup_hint=Waa dansan haddii aadan shidin. Trawl wuxuu furaa daaqaddiisa marka aad kombuyuutarkan soo gasho, wuuna ka sii wadaa akhrinta galalkaaga.
settings_startup_failed=Kombuyuutarkani Trawl uma oggolaan inuu taas beddelo. Waxba lama beddelin.
settings_report_hint=Wuxuu koobiyeeyaa warbixin gaaban clipboard-ka: noocyada Trawl iyo nidaamka, cabbirka kombuyuutarkan, tirada faylasha, cabbirka diiwaanka, xawaaraha akhrinta ugu dambeeyay iyo khaladaadkii ugu dambeeyay. Ma hayso magacyo fayl, magacyo gal, ama qoraal faylashaada ka yimid, waxbana meel lama dirayo. Ku dheji meesha aad dhibaatada ku sheegayso.
settings_report_copy=Koobiyee baaritaanka
settings_report_copied=Baaritaankii waa la koobiyeeyay. Waxba meel lama dirin.
settings_report_copy_failed=Kombuyuutarkani Trawl uma bixin clipboard-kiisa.
