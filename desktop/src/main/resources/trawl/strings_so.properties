privacy_blur_label=Madmadow geli sawirrada u eg kuwa gaar ah
privacy_blur_hint=Sawirka waxaa lagu madmadow gelinayaa liiska iyo horu-aragga ilaa aad muujiso. Wuxuu ku hadhayaa natiijooyinkaaga iyo isku xigga.
privacy_blur_needs_pack=Ku dar xirmada Asturnaanta gudaha Kordhinnada si aad tan u shido.
privacy_capture_label=Ka reeb Trawl shaashad-qaadisyada iyo wadaagista shaashadda
privacy_capture_hint_windows=Marka Trawl muujinayo wax qarsoon ama xasaasi ah, Windows waxaa laga codsadaa inuu daaqadda ka reebo shaashad-qaadisyada iyo wadaagista shaashadda (noocyada hore waxay u muujiyaan afargeeslaha madow).
privacy_capture_hint_mac=Marka Trawl muujinayo wax qarsoon ama xasaasi ah, macOS waxaa laga codsadaa inuu daaqadda ka reebo shaashad-qaadisyada. Qalab qaar weli way arki karaan.
privacy_capture_hint_linux=Linux abka ma siiyo hab la isku halleyn karo oo tan lagu sameeyo, markaa Trawl ma isku dayo.
privacy_marked_one=%1$s fayl waxaa loo calaamadeeyay xasaasi.
privacy_marked_other=%1$s faylal waxaa loo calaamadeeyay xasaasi.
privacy_damaged=Trawl ma akhrin karin habaynta asturnaanteeda, markaa wuxuu dib u bilaabay: qufulku wuu dansan yahay oo waxba lama calaamadeynin.
privacy_recovered=Habaynta asturnaanta ee Trawl waa dhaawacmay. Waxaa lagu soo celiyay nuqulkii ugu dambeeyay ee fiicnaa.
privacy_folders_hint=Sawirrada galalkan ku jira had iyo jeer waxaa loo dhaqmaa sidii kuwo gaar ah.
privacy_folders_empty=Wali gal gaar ah ma jiro.
