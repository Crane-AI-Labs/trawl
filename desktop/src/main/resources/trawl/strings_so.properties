welcome_title=Hel faylashaada waxa ay sheegayaan iyo waxa ay muujinayaan
welcome_point_private_title=Wuxuu ku hadhayaa kombuyuutarkan
welcome_point_private_body=AI-ga fahmaya faylashaada halkan ayuu ka shaqeeyaa. Trawl internetka ma galo weligiis: ma jiraan koonto, cusboonaysiin, ama la socod.
first_folders_title=Galalka la raadinayo
first_folders_body=Trawl wuxuu akhriyaa oo keliya galalka aad halkan ka doorato. Galalka qarsoon marna lama akhriyo.
first_folders_missing=laguma helin kombuyuutarkan
first_models_title=Moodooyinka
first_models_body=Trawl wuxuu u baahan yahay faylka moodooyinka si uu u fahmo sawirrada iyo macnaha. Waa isla fayl la saxiixay ee taleefanku isticmaalo. Trawl waxba soo dejin maayo: faylka biraawsarkaaga ayaad ku heshaa, Trawl wuxuu hubiyaa saxiixiisa ka hor intaanu isticmaalin.
first_models_found=Waxaa la helay %1$s gudaha %2$s (%3$s).
first_models_none=Fayl moodooyin ah lagama helin Downloads. Soo deji trawl-models.zip, ama dooro faylka laguu siiyay.
first_models_none_named=Fayl moodooyin ah lagama helin Downloads. Soo deji %1$s, ama dooro faylka laguu siiyay.
models_choice_standard_body=Raadinta ugu fiican luqad kasta, iyo hadalka muuqaallada iyo duubisyada.
models_choice_save_body=Dukumentiyada iyo shaashad-qaadisyada waxaa lagu helaa si isku mid ah Ingiriisi ahaan. Sawirrada waxaa lagu helaa oo keliya erayada ku jira, ma aha waxa ay muujinayaan, sidaa darteed sawir caadi ah waxaa lagu helaa magaciisa oo keliya. Raadinta Luganda iyo Sawaaxili way ka liidataa, hadal muuqaallada ama duubisyada kuma jiro. Inta kale waad ku dari kartaa dambe.
models_installed_standard=Moodooyinka Standard: raadinta ugu fiican luqad kasta, oo ay la socoto hadalka muuqaallada iyo duubisyada.
models_installed_save=Moodooyinka Badbaadi xogta: dukumentiyada iyo shaashad-qaadisyada waxaa lagu helaa sida Standard Ingiriisi ahaan. Sawirrada waxaa lagu helaa erayada ku jira, ma aha waxa ay muujinayaan. Raadinta Luganda iyo Sawaaxili way ka liidataa, hadal muuqaallada ama duubisyada kuma jiro.
models_upgrade_note=Si aad u hesho moodooyinka Standard (%1$s MB), hel trawl-models.zip oo halkan ka dooro. Liiskaaga faylashu wuu ahaanayaa: raadinta magaca faylka way sii shaqaynaysaa. Erayada dukumentiyada iyo sawirrada ku jira, iyo raadinta macnaha, way soo noqonayaan markii fayl kasta mar kale la akhriyo.
models_upgraded=Moodooyinka Standard waa la rakibay. Trawl hadda wuxuu mar kale akhriyaa faylashaada moodalka ka fiican. Magacyada faylasha way sii shaqaynayaan; erayada dukumentiyada iyo sawirrada ku jira way soo noqonayaan marka faylasha la akhriyo.
first_zip_question=Ma tirtiraa %1$s hadda? Waa %2$s Trawl-na mar dambe uma baahna. Mar dambe ayaad dib u soo dejin kartaa.
first_zip_delete=Tirtir
first_zip_keep=Hay
first_zip_deleted=Waa la tirtiray %1$s oo waxaa la bannaystay %2$s.
first_zip_delete_failed=Trawl ma tirtiri karin %1$s. Adigaa isagu tirtiri kara.
first_models_ready=Moodooyinka waa la rakibay. Trawl wuxuu sawirrada iyo dukumentiyada u akhriyaa macnahooda.
first_models_installing=Waa la hubinayaa oo la rakibayaa %1$s oo ka mid ah %2$s
first_addons_body=Kuwanu waxay Trawl ka dhigaan mid ka fiican laakiin looma baahna. Sida moodooyinka, mid kasta waa fayl aad marka hore ku koobiyeyso kombuyuutarkan.
first_addons_skip=Hadda ka boodo kuwan. Mid kasta waad ku dari kartaa dambe gudaha Habaynta.
first_models_skip_note=Waad bilaabi kartaa moodooyinka la'aantood. Raadintu markaas waxay ku shaqaysaa magac iyo erayo, macnuhuna wuu bilaabmayaa marka aad ku darto.
first_start_hint=Dooro ugu yaraan hal gal si aad u bilowdo.
