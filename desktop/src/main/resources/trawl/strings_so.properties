demo_snip_receipt=CORNER «DUKAANKA TALEEFANNADA» · «Rasiid» 0412 · Ilaaliyaha shaashadda, kiiska taleefanka, dallaca USB-C
demo_snip_voice=…«kirada» waa la bixinayaa Jimce, markaa…
demo_aria=Trawl, oo kombuyuutar raadinaya. Xaflad dhalasho waxay helaysaa saddex sawir oo dhalasho ah: keegga, naag qoyskeeda la jirta, iyo nin xaflad ku jira. Erayga sirta wifi waxay helaysaa shaashad-qaadis sheeko ah oo ay ku jiraan shabakadda iyo erayga sirta. Rasiidka dukaanka taleefannada waxay helaysaa rasiid PDF ah. Muuqaal ey qosol badan waxay helaysaa laba muuqaal oo eyda ah. Farriin cod ah oo ku saabsan kirada waxay helaysaa farriin cod ah, 0:42.
refusal_not_signed=Kanu ma aha fayl moodooyin ah oo Trawl: saxiix ma laha. Mar kale soo deji trawl-models.zip.
refusal_bad_signature=Faylkan Crane AI Labs ma saxiixin, ama wuu la beddelay ka dib saxiixa. Trawl ma isticmaali doono.
refusal_bad_manifest=Faylkan moodooyinka wuu ka cusub yahay nooca Trawl ee la joogo ee uu akhrin karo, ama wuu dhaawacan yahay.
refusal_wrong_class=Faylkan moodooyinka ma aha mid kombuyuutarkan isticmaali karo.
refusal_wrong_class_lite=Kanu waa xirmada standard. Kombuyuutarkani xusuus yar buu leeyahay oo wuxuu u baahan yahay xirmada yar.
refusal_damaged=Faylku waa dhaawacan yahay ama ma dhammaystirna. Mar kale soo deji.
refusal_already_installed=Moodooyinkan mar hore ayaa la rakibay.
refusal_older_version=Nooc ka cusub oo moodooyinka ah, ama urur ka buuxa, mar hore ayaa la rakibay. Waxba lama beddelin.
refusal_no_space=Meel bannaan oo moodooyinka ku filan ma jirto.
