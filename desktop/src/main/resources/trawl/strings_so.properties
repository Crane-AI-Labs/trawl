report_save_failed=Trawl ma kaydin karin warbixinta halkaas.
report_send_to=Si aad u dirto, ku lifaaq faylka ama ku dheji qoraalka iimayl loo dirayo %1$s.
report_kept=Trawl wuxuu kombuyuutarkan ku hayaa ugu badnaan 10 warbixin burbur, qiyaastii 100 KB. "Illow wax walba" way tirtirtaa.
