addons_intro=Dheeraadyo ikhtiyaari ah oo Trawl ka dhiga mid ka fiican. Trawl internetka ma galo weligiis, markaa mid kasta waa fayl aad marka hore ku koobiyeyso kombuyuutarkan. Downloads waa meesha caadiga ah. Wax walba waxay ku hadhayaan kombuyuutarkan.
