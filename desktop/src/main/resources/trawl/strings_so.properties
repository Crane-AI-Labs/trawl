blocked_fix_mac=Si aad Trawl ugu oggolaato, fur Habaynta Nidaamka, kadibna Privacy & Security, kadibna Files & Folders (ama Full Disk Access), oo shid Trawl. Kadib dooro Mar kale iskaan.
