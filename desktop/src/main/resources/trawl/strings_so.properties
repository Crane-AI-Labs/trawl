privacy_pass_forgot=Trawl ma soo celin karo eray sir ah oo la illaaway. Haddii aad luminayso, tirtir faylka privacy.json ee ku jira galka xogta Trawl: taasi waxay saaraysaa qufulka iyo calaamadaha xasaasiga. Faylashaada iyo diiwaanka lama taabanayo.
