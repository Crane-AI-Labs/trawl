privacy_blur_needs_pack=Ajoutez le lot Confidentialité dans Extensions pour activer cette option.
privacy_capture_label=Garder Trawl hors des captures d'écran et du partage d'écran
privacy_capture_hint_windows=Quand Trawl affiche des éléments masqués ou sensibles, Windows est invité à garder la fenêtre hors des captures d'écran et du partage d'écran (les anciennes versions l'affichent comme un rectangle noir).
privacy_capture_hint_mac=Quand Trawl affiche des éléments masqués ou sensibles, macOS est invité à garder la fenêtre hors des captures d'écran. Certains outils peuvent encore la voir.
privacy_capture_hint_linux=Linux ne donne aux applications aucun moyen fiable de le faire, donc Trawl n'essaie pas.
privacy_marked_one=%1$s fichier est marqué comme sensible.
privacy_marked_other=%1$s fichiers sont marqués comme sensibles.
privacy_damaged=Trawl n'a pas pu lire ses paramètres de confidentialité et a donc tout remis à zéro : le verrouillage est désactivé et rien n'est marqué.
privacy_recovered=Les paramètres de confidentialité de Trawl étaient endommagés. Ils ont été restaurés à partir de la dernière bonne copie.
