settings_delete_hint=Supprime l'index que Trawl a construit à partir de vos fichiers : leurs noms, les mots de vos documents, le texte lu dans les images et ce que l'IA a noté sur chaque fichier. Vos propres fichiers, vos paramètres (dossiers ignorés compris) et les modèles ne sont pas touchés. Trawl relit ensuite vos dossiers depuis le début.
