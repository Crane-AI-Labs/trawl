lock_scope_doesnt=Il ne chiffre rien. Toute personne qui peut ouvrir les fichiers de cet ordinateur peut encore lire l'index, les paramètres de Trawl et vos fichiers. Pour cela, activez le chiffrement du disque de votre ordinateur (FileVault, BitLocker ou LUKS).
