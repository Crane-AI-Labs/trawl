learn_gentle_hint=Moins de threads du processeur, et aucune lecture quand cet ordinateur fonctionne sur batterie. Le moins de chaleur et de bruit de ventilateur ; tout ce qui est nouveau attend le chargeur.
learn_balanced_hint=La façon habituelle : le moteur choisit son propre rythme, sur batterie ou non.
learn_fast_hint=Donne au travail autant de threads du processeur que nécessaire, même sur batterie. Chauffe et fait plus de bruit, et sur certains ordinateurs n'est pas plus rapide qu'Équilibré.
