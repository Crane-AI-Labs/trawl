demo_aria=Trawl, recherche sur un ordinateur. « Fête d'anniversaire » trouve trois photos d'anniversaire : un gâteau, une femme avec sa famille et un homme à une fête. « Mot de passe wifi » trouve une capture d'écran d'une discussion avec le réseau et le mot de passe. « Reçu de la boutique de téléphones » trouve un reçu en PDF. « Vidéo de chien drôle » trouve deux vidéos de chiens. « Message vocal sur le loyer » trouve un message vocal, à 0:42.
