settings_media_no_ffmpeg=Les vidéos et les enregistrements ont besoin de ffmpeg, qui n'est pas installé sur cet ordinateur. Installez-le (par exemple : sudo apt install ffmpeg) et Trawl commencera à les lire.
settings_media_no_decoder=Cet ordinateur ne peut pas ouvrir les vidéos et les enregistrements pour Trawl. Ils restent dans la liste et sont ignorés.
settings_media_no_speech=Les modèles de voix ne sont pas encore installés : les enregistrements et le son des vidéos ne sont donc trouvés que par des étiquettes de sons. Installez le dernier fichier de modèles Trawl pour activer la voix.
settings_storage_media=Aussi : %1$s, %2$s
settings_heic_missing_linux=Cet ordinateur ne peut pas ouvrir les images HEIC, HEIF ou AVIF (celles que créent beaucoup de téléphones et d'iPhone) : Trawl ne peut donc les trouver que par leur nom. Pour corriger cela, installez libheif (le programme heif-convert, souvent dans le paquet libheif-examples) ou ImageMagick avec la prise en charge de HEIC, puis redémarrez Trawl.
settings_heic_missing_windows=Cet ordinateur ne peut pas ouvrir les images HEIC, HEIF ou AVIF (celles que créent beaucoup de téléphones et d'iPhone) : Trawl ne peut donc les trouver que par leur nom. Pour corriger cela, ajoutez les extensions d'image HEIF gratuites de Microsoft depuis le Microsoft Store, puis redémarrez Trawl.
settings_kinds_all_off=Tout est désactivé : Trawl ne lit et ne trouve rien. Activez un type pour rechercher de nouveau.
