lock_offer_body=Vous avez marqué un fichier comme sensible. Un verrouillage de l'application masque vos résultats derrière le déverrouillage de votre ordinateur ou une phrase secrète quand vous vous éloignez. Il ne fait que masquer l'affichage. Il ne chiffre rien.
