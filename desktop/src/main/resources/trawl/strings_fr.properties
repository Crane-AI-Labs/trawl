privacy_pass_forgot=Trawl ne peut pas récupérer une phrase secrète oubliée. Si vous la perdez, supprimez le fichier privacy.json dans le dossier de données de Trawl : cela retire le verrouillage et vos marques de fichiers sensibles. Vos fichiers et l'index ne sont pas touchés.
privacy_need_proof=Déverrouillez d'abord pour modifier le verrouillage.
privacy_blur_label=Flouter les images qui semblent privées
