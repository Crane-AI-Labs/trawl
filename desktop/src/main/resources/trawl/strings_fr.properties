pause_storage_low=L'espace disque est presque plein
pause_storage_low_detail=Trawl a besoin d'un peu de place pour conserver son index. Libérez de l'espace et il reprend tout seul. La recherche fonctionne toujours.
pause_no_permission=Accès à vos dossiers requis
pause_no_permission_detail=Cet ordinateur ne laisse pas Trawl regarder dans les dossiers que vous avez choisis. Autorisez-le, et la lecture reprend toute seule. La recherche fonctionne toujours sur ce que Trawl a appris.
pause_no_permission_detail_mac=macOS a demandé si Trawl peut regarder dans vos dossiers, et la réponse était non. Ouvrez Réglages Système, puis Confidentialité et sécurité, puis Fichiers et dossiers, et activez Trawl. La lecture reprend toute seule. La recherche fonctionne toujours.
blocked_system_one=%1$s dossier parmi vos dossiers choisis est fermé à Trawl (%2$s), donc Trawl l'ignore. Rien de ce qu'il contient n'est retiré de la recherche, et le reste est lu comme d'habitude.
blocked_system_other=%1$s dossiers parmi vos dossiers choisis sont fermés à Trawl (%2$s), donc Trawl les ignore. Rien de ce qu'ils contiennent n'est retiré de la recherche, et le reste est lu comme d'habitude.
blocked_fix_mac=Pour laisser entrer Trawl, ouvrez Réglages Système, puis Confidentialité et sécurité, puis Fichiers et dossiers (ou Accès complet au disque), et activez Trawl. Choisissez ensuite Analyser de nouveau.
blocked_fix=Pour laisser entrer Trawl, modifiez les autorisations de ces dossiers afin que votre compte puisse les ouvrir. Choisissez ensuite Analyser de nouveau.
blocked_other_one=%1$s dossier n'a pas pu être ouvert à l'instant (un disque a disparu, ou un partage réseau s'est coupé). Trawl conserve ce qu'il savait à son sujet et regarde de nouveau à la prochaine analyse.
blocked_other_other=%1$s dossiers n'ont pas pu être ouverts à l'instant (un disque a disparu, ou un partage réseau s'est coupé). Trawl conserve ce qu'il savait à leur sujet et regarde de nouveau à la prochaine analyse.
