first_models_title=Les modèles
first_models_body=Trawl a besoin du fichier de modèles pour comprendre les images et le sens. C'est le même fichier signé que celui du téléphone. Trawl ne télécharge rien : vous obtenez le fichier avec votre navigateur, et Trawl vérifie sa signature avant de l'utiliser.
first_models_found=%1$s trouvé dans %2$s (%3$s).
first_models_none=Aucun fichier de modèles trouvé dans Téléchargements. Téléchargez trawl-models.zip, ou choisissez le fichier qu'on vous a donné.
first_models_none_named=Aucun fichier de modèles trouvé dans Téléchargements. Téléchargez %1$s, ou choisissez le fichier qu'on vous a donné.
models_choice_standard_body=La meilleure recherche dans toutes les langues, avec la voix des vidéos et des enregistrements.
models_choice_save_body=Les documents et les captures d'écran se trouvent tout aussi bien en anglais. Les photos ne se trouvent que par les mots qu'elles contiennent, pas par ce qu'elles montrent : une photo sans texte ne se trouve que par son nom. La recherche en luganda et en swahili est moins bonne, et il n'y a pas de voix dans les vidéos ni les enregistrements. Vous pourrez ajouter le reste plus tard.
models_installed_standard=Modèles Standard : la meilleure recherche dans toutes les langues, avec la voix des vidéos et des enregistrements.
models_installed_save=Modèles Économie de données : les documents et les captures d'écran se trouvent aussi bien qu'avec Standard en anglais. Les photos se trouvent par les mots qu'elles contiennent, pas par ce qu'elles montrent. La recherche en luganda et en swahili est moins bonne, et il n'y a pas de voix dans les vidéos ni les enregistrements.
models_upgrade_note=Pour obtenir les modèles Standard (%1$s MB), récupérez trawl-models.zip et choisissez-le ici. Votre liste de fichiers est conservée : la recherche par nom de fichier continue de fonctionner entre-temps. Les mots dans les documents et les images, ainsi que la recherche par sens, reviennent à mesure que chaque fichier est relu.
models_upgraded=Modèles Standard installés. Trawl relit maintenant vos fichiers avec le meilleur modèle. Les noms de fichiers continuent de fonctionner entre-temps ; les mots dans les documents et les images reviennent à mesure que les fichiers sont lus.
first_zip_question=Supprimer %1$s maintenant ? Il pèse %2$s et Trawl n'en a plus besoin. Vous pourrez le télécharger de nouveau plus tard.
first_zip_delete=Le supprimer
first_zip_keep=Le conserver
first_zip_deleted=%1$s supprimé, %2$s libérés.
first_zip_delete_failed=Trawl n'a pas pu supprimer %1$s. Vous pouvez le supprimer vous-même.
first_models_ready=Les modèles sont installés. Trawl lit les images et les documents par sens.
first_models_installing=Vérification et installation de %1$s sur %2$s
first_addons_body=Ils améliorent Trawl mais ne sont pas indispensables. Comme les modèles, chacun est un fichier à copier d'abord sur cet ordinateur.
first_addons_skip=Passez-les pour l'instant. Vous pourrez en ajouter plus tard dans Paramètres.
first_models_skip_note=Vous pouvez commencer sans les modèles. La recherche fonctionne alors sur les noms et les mots, et le sens démarre dès que vous les ajoutez.
first_start_hint=Choisissez au moins un dossier pour commencer.
