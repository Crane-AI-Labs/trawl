settings_startup_failed=Cet ordinateur n'a pas permis à Trawl de changer cela. Rien n'a été modifié.
settings_report_hint=Copie un court rapport dans le presse-papiers : versions de Trawl et du système, taille de cet ordinateur, nombre de fichiers, taille de l'index, dernière vitesse de lecture et dernières erreurs. Il ne contient aucun nom de fichier ni de dossier, ni texte de vos fichiers, et rien n'est envoyé nulle part. Collez-le là où vous signalez le problème.
