privacy_folders_pick=Choisir un dossier à garder privé
privacy_folders_bad=Choisissez un dossier situé dans un dossier que Trawl recherche. Pour arrêter de rechercher un dossier entier, supprimez-le sous Dossiers.
privacy_folders_invalid=Ce n'est pas un nom de dossier que cet ordinateur peut lire. Choisissez plutôt un dossier dans la liste.
report_card_title=Trawl s'est arrêté de façon inattendue. Le signaler ?
report_card_body=Le rapport ne contient aucun nom de fichier, aucune recherche ni aucun texte de vos fichiers. Vous le lisez d'abord. Rien n'est envoyé : vous le copiez ou l'enregistrez, puis vous l'envoyez vous-même.
settings_report_open_hint=Crée un rapport que vous pouvez lire, puis copier ou enregistrer. Il contient les versions de Trawl et du système, la taille de cet ordinateur, des nombres, les paramètres (activés ou désactivés) et les traces d'erreur sans leurs messages. Rien n'est envoyé nulle part.
report_hint=Voici tout ce que contient le rapport. Vos fichiers, vos dossiers et vos recherches n'y figurent pas.
report_note_hint=Votre note est incluse telle que vous l'écrivez, ne mettez donc rien de privé. Tout ce qui ressemble à un chemin de fichier est supprimé.
report_copy=Copier le rapport
report_copied=Rapport copié. Rien n'a été envoyé nulle part.
report_copy_failed=Cet ordinateur n'a pas donné à Trawl l'accès à son presse-papiers. Utilisez Enregistrer à la place.
report_mail=Ouvrir l'e-mail
report_mail_lead=Le rapport complet est dans mon presse-papiers. Je vais le coller sous cette ligne.
report_mail_opened=Rapport copié et application de messagerie ouverte. Collez le rapport dans l'e-mail, puis envoyez-le vous-même. Trawl n'a rien envoyé.
report_mail_opened_not_copied=Application de messagerie ouverte, mais cet ordinateur n'a pas donné à Trawl l'accès à son presse-papiers. Utilisez Enregistrer dans un fichier et joignez-le.
report_mail_failed=Trawl n'a pas pu ouvrir d'application de messagerie. Le rapport est copié si le presse-papiers l'a permis : collez-le dans un e-mail à %1$s.
report_save=Enregistrer dans un fichier
report_saved=Rapport enregistré. Rien n'a été envoyé nulle part.
report_save_failed=Trawl n'a pas pu enregistrer le rapport à cet endroit.
report_send_to=Pour l'envoyer, joignez le fichier ou collez le texte dans un e-mail à %1$s.
report_kept=Trawl conserve au plus 10 rapports de plantage sur cet ordinateur, environ 100 Ko. "Oublier tout" les supprime.
report_logs=Ouvrir le dossier des journaux
addons_intro=Des options facultatives qui améliorent Trawl. Trawl ne se connecte jamais à Internet : chacune est donc un fichier à copier d'abord sur cet ordinateur. Téléchargements est l'endroit habituel. Tout reste sur cet ordinateur.
