settings_heic_missing_linux=Kompiuta man pe twero yabo cal me HEIC, HEIF onyo AVIF (kit ma cim ki iPhone mapol kelo), pi meno Trawl twero nongo gi ki nying keken. Wek ilok, ket libheif (program heif-convert, kare mapol i pack libheif-examples) onyo ImageMagick ma ki HEIC, ci cak Trawl odoco.
settings_heic_missing_windows=Kompiuta man pe twero yabo cal me HEIC, HEIF onyo AVIF (kit ma cim ki iPhone mapol kelo), pi meno Trawl twero nongo gi ki nying keken. Wek ilok, med HEIF Image Extensions pa Microsoft ma pe kigwoko cente i Microsoft Store, ci cak Trawl odoco.
