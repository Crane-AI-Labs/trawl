first_models_title=Model
first_models_body=Trawl mito fayil me model wek niang cal ki te lok. En obedo fayil acel ma kicoyo nying ma cim tiyo kwede. Trawl pe gamo gin mo: igamo fayil ki layeny megi, ci Trawl neno nying ma kicoyo iye macon peya otiyo kwede.
