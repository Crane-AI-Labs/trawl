models_choice_standard_body=Yenyo maber loyo i leb ducu, ki lok ma tye i vidiyo ki rikodi.
models_choice_save_body=Waraga ki screenshot kinongo maber calo nining i leb Munu. Cal kinongo ki lok ma tye iye keken, pe ki gin ma giwaco, pi meno cal ma pe ki lok kinongo ki nying keken. Yenyo i Luganda ki Swahili nok, dok pe tye lok ma tye i vidiyo onyo rikodi. Itwero medo ka dong i ngeye.
models_installed_standard=Model me Standard: yenyo maber loyo i leb ducu, ki lok ma tye i vidiyo ki rikodi.
models_installed_save=Model me Gwok data: waraga ki screenshot kinongo calo ki Standard i leb Munu. Cal kinongo ki lok ma tye iye, pe ki gin ma giwaco. Yenyo i Luganda ki Swahili nok, dok pe tye lok ma tye i vidiyo onyo rikodi.
models_upgrade_note=Wek inong model me Standard (%1$s MB), gam trawl-models.zip ci iyer kany. Kwan me fayil megi pe bal: yenyo ki nying fayil bimede ki tic kare meno. Lok ma tye i waraga ki cal, ki yenyo ki te lok, bidok ka kikwano fayil acel acel doki.
models_upgraded=Model me Standard dong kiketo. Trawl kombedi kwano fayil megi odoco ki model ma ber loyo. Nying fayil bimede ki tic kare meno; lok ma tye i waraga ki cal bidok ka kikwano fayil.
