welcome_point_private_title=يبقى على هذا الكمبيوتر
welcome_point_private_body=الذكاء الاصطناعي الذي يفهم ملفاتك يعمل هنا. لا يتصل Trawl بالإنترنت أبداً: لا حسابات ولا تحديثات ولا تتبّع.
first_folders_title=المجلدات التي سيتم البحث فيها
first_folders_body=يقرأ Trawl المجلدات التي تختارها هنا فقط. لا تتم قراءة المجلدات المخفية أبداً.
