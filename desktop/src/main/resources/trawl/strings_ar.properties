first_models_title=النماذج
first_models_body=يحتاج Trawl إلى ملف النماذج ليفهم الصور والمعنى. هو الملف الموقّع نفسه الذي يستخدمه الهاتف. لا ينزّل Trawl أي شيء: تحصل على الملف عبر المتصفح، ويتحقق Trawl من توقيعه قبل استخدامه.
first_models_found=تم العثور على %1$s في %2$s (%3$s).
first_models_none=لم يتم العثور على ملف النماذج في التنزيلات. نزّل trawl-models.zip، أو اختر الملف الذي أُعطي لك.
first_models_none_named=لم يتم العثور على ملف النماذج في التنزيلات. نزّل %1$s، أو اختر الملف الذي أُعطي لك.
models_choice_standard_body=أفضل بحث بكل اللغات، مع الكلام في مقاطع الفيديو والتسجيلات.
models_choice_save_body=يتم العثور على المستندات ولقطات الشاشة بالجودة نفسها بالإنجليزية. أما الصور فيُعثر عليها بالكلمات الموجودة فيها فقط، لا بما تعرضه، لذلك لا يُعثر على الصورة العادية إلا باسمها. البحث بلغتَي اللوغندية والسواحيلية أضعف، ولا يوجد بحث في الكلام داخل مقاطع الفيديو والتسجيلات. يمكنك إضافة الباقي لاحقاً.
models_installed_standard=النماذج القياسية: أفضل بحث بكل اللغات، مع الكلام في مقاطع الفيديو والتسجيلات.
models_installed_save=نماذج توفير البيانات: يتم العثور على المستندات ولقطات الشاشة بالجودة نفسها كما في القياسي بالإنجليزية. يُعثر على الصور بالكلمات الموجودة فيها، لا بما تعرضه. البحث بلغتَي اللوغندية والسواحيلية أضعف، ولا يوجد بحث في الكلام داخل مقاطع الفيديو والتسجيلات.
models_upgrade_note=للحصول على النماذج القياسية (%1$s MB)، نزّل trawl-models.zip واختره هنا. تبقى قائمة ملفاتك: يستمر البحث باسم الملف خلال ذلك. أما الكلمات داخل المستندات والصور والبحث بالمعنى فتعود كلما أُعيدت قراءة كل ملف.
models_upgraded=تم تثبيت النماذج القياسية. يقرأ Trawl الآن ملفاتك مرة أخرى بالنموذج الأفضل. تستمر أسماء الملفات في العمل خلال ذلك؛ وتعود الكلمات داخل المستندات والصور كلما قُرئت الملفات.
