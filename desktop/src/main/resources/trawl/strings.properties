# Trawl desktop: every word the window shows, in English. Translating the app is adding a file next to this one
# (strings_lg.properties, strings_sw.properties, ...): the app looks the key up in the person's language first and in
# this file second, so a missing translation shows English and never a blank. UTF-8. Placeholders are the phone's: %1$s, %2$d.
# Wording is the phone's wherever the phone says the same thing (app/src/main/res/values/strings*.xml).

