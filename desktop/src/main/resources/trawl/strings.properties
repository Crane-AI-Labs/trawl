models_choice_standard_body=Best search in every language, and speech in videos and recordings.
models_choice_save_body=Documents and screenshots are found just as well in English. Photos are found only by the words in them, not by what they show, so a plain photo is found by its name only. Luganda and Swahili search is weaker, and there is no speech in videos or recordings. You can add the rest later.
