welcome_title=Thola amafayela akho ngalokho akushoyo nalokho akubonisayo
welcome_point_private_title=Ihlala kule khompyutha
welcome_point_private_body=I-AI eqonda amafayela akho isebenza lapha. I-Trawl ayilokothi ixhumeke ku-inthanethi: azikho ama-akhawunti, azikho izibuyekezo, akukho ukulandelwa.
first_folders_title=Amafolda okusesha
first_folders_body=I-Trawl ifunda kuphela amafolda owakhetha lapha. Amafolda afihliwe awafundwa neze.
first_folders_missing=akutholakali kule khompyutha
first_models_title=Amamodeli
first_models_body=I-Trawl idinga ifayela lemodeli ukuze iqonde izithombe nencazelo. Yilona fayela elisayiniwe elisetshenziswa yifoni. I-Trawl ayilandi lutho: ulithola ifayela ngesiphequluli sakho, bese i-Trawl ihlola isignesha yalo ngaphambi kokulisebenzisa.
first_models_found=Kutholwe %1$s ku-%2$s (%3$s).
first_models_none=Akukho fayela lamamodeli elitholwe kokuthi Okulandiwe. Landa trawl-models.zip, noma ukhethe ifayela owanikezwa lona.
first_models_none_named=Akukho fayela lamamodeli elitholwe kokuthi Okulandiwe. Landa %1$s, noma ukhethe ifayela owanikezwa lona.
models_choice_standard_body=Ukusesha okungcono kakhulu ezilimini zonke, nenkulumo emavidiyo nasekuqopheni.
models_choice_save_body=Amadokhumenti nezithombe zesikrini kutholakala kahle ngokufanayo ngesiNgisi. Izithombe zitholakala kuphela ngamagama asezithombeni, hhayi ngalokho ezikubonisa, ngakho isithombe esilula sitholakala ngegama kuphela. Ukusesha ngesiLuganda nesiSwahili kuthambile, futhi akukho nkulumo emavidiyo noma ekuqopheni. Ungangeza okusele kamuva.
models_installed_standard=Amamodeli e-Standard: ukusesha okungcono kakhulu ezilimini zonke, nenkulumo emavidiyo nasekuqopheni.
models_installed_save=Amamodeli ethi Londoloza idatha: amadokhumenti nezithombe zesikrini kutholakala kahle njengakumamodeli e-Standard ngesiNgisi. Izithombe zitholakala ngamagama asezithombeni, hhayi ngalokho ezikubonisa. Ukusesha ngesiLuganda nesiSwahili kuthambile, futhi akukho nkulumo emavidiyo noma ekuqopheni.
models_upgrade_note=Ukuze uthole amamodeli e-Standard (%1$s MB), thola trawl-models.zip bese uyikhetha lapha. Uhlu lwamafayela akho luyahlala: ukusesha ngegama lefayela kuyaqhubeka nokusebenza khona manje. Amagama asemadokhumentini nasezithombeni, nokusesha ngencazelo, kubuya njengoba ifayela ngalinye lifundwa futhi.
models_upgraded=Amamodeli e-Standard afakiwe. I-Trawl manje ifunda amafayela akho futhi ngemodeli engcono. Amagama amafayela aqhubeka nokusebenza khona manje; amagama asemadokhumentini nasezithombeni abuya njengoba amafayela efundwa.
first_zip_question=Susa %1$s manje? Ngu-%2$s futhi i-Trawl ayisayidingi. Ungayilanda futhi kamuva.
first_zip_delete=Susa
first_zip_keep=Yigcine
first_zip_deleted=Kususiwe %1$s futhi kukhululwe %2$s.
first_zip_delete_failed=I-Trawl ayikwazanga ukususa %1$s. Ungasusa wena.
first_models_ready=Amamodeli afakiwe. I-Trawl ifunda izithombe namadokhumenti ngencazelo.
first_models_installing=Ihlola futhi ifaka %1$s kokungu-%2$s
first_addons_body=Lokhu kwenza i-Trawl ibe ngcono kodwa akudingekile. Njengamamodeli, ngalinye lifayela olikopishela kule khompyutha kuqala.
first_addons_skip=Yeqa lokhu okwamanje. Ungangeza noma yikuphi kamuva kokuthi Izilungiselelo.
first_models_skip_note=Ungaqala ngaphandle kwamamodeli. Ukusesha bese kusebenza ngamagama nemibhalo, futhi incazelo iqala uma uwangeza.
first_start_hint=Khetha okungenani ifolda eyodwa ukuze uqale.
