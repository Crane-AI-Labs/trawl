privacy_pass_mismatch=Okubili akufani.
privacy_pass_blank=Ibinzana lokungena alikwazi ukuba yizikhala kuphela.
privacy_pass_forgot=I-Trawl ayikwazi ukululama ibinzana lokungena elikhohliwe. Uma ulilahlekelwa, susa ifayela privacy.json efolda yedatha ye-Trawl: lokho kususa ukukhiya nezimpawu zakho zobucayi. Amafayela akho nohlu azithintwa.
privacy_need_proof=Vula kuqala ukuze ushintshe ukukhiya.
privacy_blur_label=Fiphalisa izithombe ezibukeka ziyimfihlo
privacy_blur_hint=Isithombe siyafiphazwa ohlwini nasekubukeni kuqala uze usibonise. Sihlala emiphumeleni yakho nasendaweni yaso.
privacy_blur_needs_pack=Engeza iphakheji lobumfihlo kokuthi Izithasiselo ukuze uvule lokhu.
privacy_capture_label=Gcina i-Trawl ingabonakali ezithombeni zesikrini nasekwabelaneni ngesikrini
privacy_capture_hint_windows=Ngenkathi i-Trawl ibonisa okufihliwe noma okubucayi, i-Windows icelwa ukuthi igcine iwindi lingabonakali ezithombeni zesikrini nasekwabelaneni ngesikrini (izinguqulo ezindala ziliboniswa njengendawo emnyama).
privacy_capture_hint_mac=Ngenkathi i-Trawl ibonisa okufihliwe noma okubucayi, i-macOS icelwa ukuthi igcine iwindi lingabonakali ezithombeni zesikrini. Amanye amathuluzi asengalibona.
privacy_capture_hint_linux=I-Linux ayinikezi izinhlelo indlela ethembekile yokwenza lokhu, ngakho i-Trawl ayizami.
privacy_marked_one=Ifayela elingu-%1$s limakiwe njengelibucayi.
privacy_marked_other=Amafayela angu-%1$s amakiwe njengabucayi.
privacy_damaged=I-Trawl ayikwazanga ukufunda izilungiselelo zayo zobumfihlo, ngakho iqale kabusha: ukukhiya kucishiwe futhi akukho okumakiwe.
privacy_recovered=Izilungiselelo zobumfihlo ze-Trawl zonakele. Zibuyiselwe kukhophi elungile lokugcina.
privacy_folders_hint=Izithombe zalawa mafolda ziphathwa njengezimfihlo njalo.
privacy_folders_empty=Awekho amafolda angamfihlo okwamanje.
privacy_folders_add=Engeza ifolda eyimfihlo
privacy_folders_pick=Khetha ifolda ozoyigcina iyimfihlo
privacy_folders_bad=Khetha ifolda engaphakathi kweyodwa i-Trawl eyisesha. Ukuze uyeke ukusesha lonke ifolda, yisuse kokuthi Amafolda.
report_card_title=I-Trawl imile ngokungalindelekile. Ibike?
report_card_body=Umbiko awunamagama amafayela, ukusesha noma umbhalo wamafayela akho. Uwufunda kuqala. Akukho okuthunyelwayo: uwukopisha noma uwugcine, bese uwuthumela wena.
settings_report_open_hint=Wakha umbiko ongawufunda, bese uwukopisha noma uwugcine. Unezinguqulo ze-Trawl nesistimu, usayizi wale khompyutha, izibalo, izilungiselelo njengokuvuliwe noma okucishiwe, nemikhondo yamaphutha ngaphandle kwemiyalezo yawo. Akukho okuthunyelwa ndawo.
report_hint=Yilokhu konke umbiko okuphethe. Amafayela akho, amafolda akho nokusesha kwakho akukho kuwo.
report_note_hint=Inothi lakho lifakwa njengoba ulibhala, ngakho shiya noma yini eyimfihlo. Noma yini efana nendlela yefayela iyasuswa.
report_copy=Kopisha umbiko
report_copied=Umbiko ukopishiwe. Akukho okuthunyelwe ndawo.
report_copy_failed=Le khompyutha ayiyinikanga i-Trawl ibhodi layo lokunamathisela. Sebenzisa okuthi Gcina esikhundleni.
report_mail=Vula i-imeyili
report_mail_lead=Umbiko ogcwele usebhodini lami lokunamathisela. Ngizonamathisela ngezansi kwalo mugqa.
report_mail_opened=Umbiko ukopishiwe futhi uhlelo lwakho lwe-imeyili luvuliwe. Namathisela umbiko ku-imeyili, bese uyithumela wena. I-Trawl ayithumelanga lutho.
report_mail_opened_not_copied=Uhlelo lwakho lwe-imeyili luvuliwe, kodwa le khompyutha ayiyinikanga i-Trawl ibhodi layo lokunamathisela. Sebenzisa okuthi Gcina njengefayela bese ulinamathisela.
report_mail_failed=I-Trawl ayikwazanga ukuvula uhlelo lwe-imeyili. Umbiko ukopishiwe uma ibhodi livumile: wunamathisele ku-imeyili eya ku-%1$s.
report_save=Gcina njengefayela
