lock_offer_title=Khiya i-Trawl futhi?
lock_offer_body=Umake ifayela njengelibucayi. Ukukhiya uhlelo kufihla imiphumela yakho ngemuva kokuvula kwekhompyutha yakho noma ibinzana lokungena uma uhamba. Kufihla ukubuka kuphela. Akufihli lutho ngekhodi.
