settings_data_body=Uhlu lugcinwe ku-%1$s. Susa leyo folda ukuze i-Trawl ikhohlwe konke eyakufunda.
settings_forgot=Kukhohliwe %1$s: lokho i-Trawl eyakufunda ngo-%2$s. Ifunda amafolda akho futhi kusukela ekuqaleni. Amafayela akho awathintwanga.
settings_forgot_nothing=I-Trawl yayingakafundi lutho, ngakho kwakungekho okokukhohlwa. Amafayela akho awathintwanga.
