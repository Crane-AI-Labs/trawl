privacy_os_unavailable=I-%1$s ayisethiwe kule khompyutha, ngakho kusetshenziswa ibinzana lokungena.
privacy_os_none=Le khompyutha ayinakho ukuvula ngezigxivizo zeminwe noma ubuso i-Trawl engakusebenzisa lapha, ngakho ukukhiya kusebenzisa ibinzana lokungena.
privacy_pass_new=Ibinzana lokungena elisha
