dialog_forget_title=Khohlwa konke?
dialog_forget_body=I-Trawl isusa lokho eyakufunda bese ifunda amafolda akho futhi kusukela ekuqaleni. Amafayela akho awathintwa.
dialog_forget_confirm=Khohlwa
lock_scope_does=Ukukhiya kufihla imiphumela yakho nokubuka kuqala esikrinini kuze kube yilapho uvula.
lock_scope_doesnt=Akufihli lutho ngekhodi. Noma ubani ongavula amafayela alokhu kompyutha usengafunda uhlu, izilungiselelo ze-Trawl namafayela akho. Ngakho, vula ukufihlwa ngekhodi kwediski yekhompyutha yakho (FileVault, BitLocker noma LUKS).
