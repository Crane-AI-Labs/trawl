blocked_system_other=Amafolda angu-%1$s ngaphakathi kwamafolda owakhethile avalelwe i-Trawl (%2$s), ngakho i-Trawl iyaweqa. Akukho okususwa osesho kuwo, futhi okunye kufundwa njengenjwayelo.
blocked_fix_mac=Ukuze i-Trawl ingene, vula System Settings, bese Privacy & Security, bese Files & Folders (noma Full Disk Access), bese uvula i-Trawl. Bese ukhetha Skena futhi.
blocked_fix=Ukuze i-Trawl ingene, shintsha izimvume zalamafolda ukuze i-akhawunti yakho iwavule. Bese ukhetha Skena futhi.
blocked_other_one=Ifolda elingu-%1$s alikwazanga ukuvulwa manje (idrayivu esusiwe, noma ukwabelana kwenethiwekhi okunqamukile). I-Trawl igcina lokho eyayikwazi ngalo futhi ibheka futhi ekuskeni okulandelayo.
blocked_other_other=Amafolda angu-%1$s awakwazanga ukuvulwa manje (idrayivu esusiwe, noma ukwabelana kwenethiwekhi okunqamukile). I-Trawl igcina lokho eyayikwazi ngawo futhi ibheka futhi ekuskeni okulandelayo.
