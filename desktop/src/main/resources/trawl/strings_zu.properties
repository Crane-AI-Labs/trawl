settings_choose_dialog=Khetha ifolda yokusesha
settings_choose_models_dialog=Khetha trawl-models.zip
settings_about_private=I-Trawl ayinakhodi yenethiwekhi. Amafayela akho nalokho eyakufunda kuwo akuphumi kule khompyutha.
settings_recordings_hint=Amanothi ezwi, ukuqopha nomsindo wamavidiyo. Inkulumo yesiNgisi kuphela eguqulelwa emagameni.
settings_media_no_ffmpeg=Amavidiyo nokuqopha kudinga i-ffmpeg, futhi ayifakiwe kule khompyutha. Yifake (isibonelo: sudo apt install ffmpeg) bese i-Trawl iqala ukukufunda.
settings_media_no_decoder=Le khompyutha ayinayo indlela yokuvula amavidiyo nokuqopha ku-Trawl. Ahlala ohlwini kodwa ayeqiwe.
settings_media_no_speech=Amamodeli enkulumo awakafakwa, ngakho ukuqopha nomsindo wevidiyo kutholakala ngamalebula omsindo kuphela. Faka ifayela lamamodeli le-Trawl lakamuva ukuze uvule inkulumo.
settings_storage_media=Futhi: %1$s, %2$s
settings_heic_missing_linux=Le khompyutha ayikwazi ukuvula izithombe ze-HEIC, HEIF noma AVIF (uhlobo olwenziwa amafoni amaningi ne-iPhone), ngakho i-Trawl ingazithola ngegama kuphela. Ukuze lokhu kulungiswe, faka i-libheif (uhlelo lwe-heif-convert, ngokuvamile kuphakheji elithi libheif-examples) noma i-ImageMagick ene-HEIC, bese uqala kabusha i-Trawl.
settings_heic_missing_windows=Le khompyutha ayikwazi ukuvula izithombe ze-HEIC, HEIF noma AVIF (uhlobo olwenziwa amafoni amaningi ne-iPhone), ngakho i-Trawl ingazithola ngegama kuphela. Ukuze lokhu kulungiswe, engeza i-HEIF Image Extensions yamahhala ye-Microsoft ku-Microsoft Store, bese uqala kabusha i-Trawl.
settings_kinds_all_off=Konke kucishiwe, ngakho i-Trawl ayifundi futhi ayitholi lutho. Vula okukodwa ukuze usesha futhi.
settings_excluded_add=Yeqa ifolda
settings_excluded_pick=Khetha ifolda ozoyeqa
settings_excluded_not_inside=Khetha ifolda engaphakathi kweyodwa osuvele uyisesha.
settings_excluded_is_chosen=Lonke ifolda liyaseshwa. Sebenzisa okuthi Susa ngenhla ukuze uyeke ukulifunda.
settings_excluded_not_folder=Lokho akuyona ifolda.
learn_speed_title=Isivinini somsebenzi
learn_gentle_hint=Imicu yeprosesa encane, futhi akukho kufunda uma le khompyutha isebenza ngebhethri. Ukushisa nomsindo womlindi kuncane; noma yini entsha ilinda ishaja.
learn_balanced_hint=Indlela evamile: injini izikhethela isivinini sayo, ngebhethri noma kungenjalo.
learn_fast_hint=Inika umsebenzi imicu yeprosesa eminingi ngangokunokwenzeka, nasebhethrini. Ishisa kakhulu futhi inomsindo, futhi kwezinye izikhompyutha ayisheshi kuno-Olinganiselwe.
settings_speed_rate_one=Kulesi sikhathi: cishe ifayela elingu-%1$s ngomzuzu.
settings_speed_rate_other=Kulesi sikhathi: cishe amafayela angu-%1$s ngomzuzu.
pause_not_charging_detail=Isivinini esithi Buthule sifunda kuphela uma le khompyutha ixhunywe kugesi. Ukusesha kuyasebenza ngalesi sikhathi.
settings_storage_cache=Inqolobane yenjini
settings_storage_files=Amafayela i-Trawl eyawaziyo: %1$s, %2$s, %3$s
settings_delete_hint=Isusa uhlu i-Trawl eyalakha emafayeleni akho: amagama awo, amagama asemadokhumentini akho, umbhalo ofundwe ezithombeni nalokho i-AI eyakubhala ngefayela ngalinye. Amafayela akho, izilungiselelo zakho (kuhlanganise namafolda eqiwe) namamodeli awathintwa. I-Trawl bese ifunda amafolda akho futhi kusukela ekuqaleni.
settings_language_system=Landela ikhompyutha yami
settings_startup_title=Ukuqala
settings_startup_label=Qala i-Trawl uma ngingena
settings_startup_hint=Icishiwe ngaphandle kokuthi uyivule. I-Trawl ivula iwindi layo uma ungena kule khompyutha, bese iqhubeka nokufunda amafolda akho kusuka lapho.
settings_startup_failed=Le khompyutha ayiyivumelanga i-Trawl ukuthi ishintshe lokho. Akukho okushintshiwe.
settings_report_hint=Kopisha umbiko omfushane ebhodini lokunamathisela: izinguqulo ze-Trawl nesistimu, usayizi wale khompyutha, izibalo zamafayela, usayizi wohlu, isivinini sokufunda sokugcina namaphutha amasha. Awunamagama amafayela, amagama amafolda noma umbhalo wamafayela akho, futhi akukho okuthunyelwa ndawo. Unamathisele lapho ubika khona inkinga.
settings_report_copy=Kopisha ukuhlolwa
settings_report_copied=Ukuhlolwa kukopishiwe. Akukho okuthunyelwe ndawo.
settings_report_copy_failed=Le khompyutha ayiyinikanga i-Trawl ibhodi layo lokunamathisela.
settings_report_logs=Vula ifolda yamalogi
settings_report_logs_failed=Ayikwazanga ukuvula ifolda yamalogi.
settings_about_runtime=I-Java runtime: %1$s
settings_about_model=Ukusesha kusebenza ku-EmbeddingGemma 2 ye-Google (Apache 2.0), kuyo yonke kule khompyutha.
licences_intro=I-%1$s yakhiwe phezu komsebenzi ongezansi. Lezi zaziso zidingwa amalayisense, futhi yiwo nendlela esithi ngayo ngiyabonga.
