report_save_failed=I-Trawl ayikwazanga ukugcina umbiko lapho.
report_send_to=Ukuze uwuthumele, namathisela ifayela noma umbhalo ku-imeyili eya ku-%1$s.
report_kept=I-Trawl igcina imibiko yokuphahlazeka engafika ku-10 kule khompyutha, cishe ama-KB angu-100. Okuthi "Khohlwa konke" kuyayisusa.
