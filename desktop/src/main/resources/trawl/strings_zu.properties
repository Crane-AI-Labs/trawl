addons_intro=Okungeziwe okungakhethwa okwenza i-Trawl ibe ngcono. I-Trawl ayilokothi ibe ku-inthanethi, ngakho ngalinye lifayela olikopishela kule khompyutha kuqala. Okulandiwe yindawo evamile. Konke kuhlala kule khompyutha.
