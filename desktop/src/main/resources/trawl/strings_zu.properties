demo_snip_receipt=CORNER «ISITOLO SEFONI» · «Irisidi» 0412 · Isivikeli sesikrini, ikesi lefoni, ishaja ye-USB-C
demo_snip_voice=…«irenti» kufanele ikhokhwe ngoLwesihlanu, ngakho…
demo_aria=I-Trawl, isesha ikhompyutha. Umcimbi wosuku lokuzalwa uthola izithombe ezintathu zosuku lokuzalwa: ikhekhe, owesifazane nomkhaya wakhe, nendoda emcimbini. Iphasiwedi ye-wifi ithola isithombe sesikrini sengxoxo enenethiwekhi nephasiwedi. Irisidi lesitolo sefoni lithola irisidi le-PDF. Ividiyo yenja ehlekisayo ithola amavidiyo amabili enja. Inothi lezwi mayelana nerenti lithola inothi lezwi, ku-0:42.
