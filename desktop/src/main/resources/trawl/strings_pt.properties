learn_gentle_hint=Menos threads do processador e nenhuma leitura enquanto este computador usa a bateria. Menos calor e ruído do ventilador; o que for novo espera o carregador.
learn_balanced_hint=O jeito habitual: o motor escolhe o próprio ritmo, na bateria ou não.
learn_fast_hint=Dá ao trabalho quantas threads do processador ajudarem, também na bateria. Esquenta e faz mais barulho, e em alguns computadores não é mais rápido que o Equilibrado.
