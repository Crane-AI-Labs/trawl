blocked_fix_mac=Para deixar o Trawl entrar, abra Ajustes do Sistema, depois Privacidade e Segurança, depois Arquivos e Pastas (ou Acesso Total ao Disco), e ligue o Trawl. Depois escolha Verificar de novo.
blocked_fix=Para deixar o Trawl entrar, mude as permissões dessas pastas para que sua conta possa abri-las. Depois escolha Verificar de novo.
blocked_other_one=%1$s pasta não pôde ser aberta agora (um disco que sumiu ou uma pasta de rede que caiu). O Trawl guarda o que sabia dela e olha de novo na próxima verificação.
blocked_other_other=%1$s pastas não puderam ser abertas agora (um disco que sumiu ou uma pasta de rede que caiu). O Trawl guarda o que sabia delas e olha de novo na próxima verificação.
