first_folders_body=O Trawl lê apenas as pastas que você escolher aqui. Pastas ocultas nunca são lidas.
first_folders_missing=não encontrada neste computador
first_models_title=Os modelos
first_models_body=O Trawl precisa do arquivo de modelos para entender imagens e significado. É o mesmo arquivo assinado que o celular usa. O Trawl não baixa nada: você obtém o arquivo pelo navegador e o Trawl confere a assinatura antes de usá-lo.
first_models_found=Encontrado: %1$s em %2$s (%3$s).
first_models_none=Nenhum arquivo de modelos encontrado em Downloads. Baixe o trawl-models.zip ou escolha o arquivo que você recebeu.
first_models_none_named=Nenhum arquivo de modelos encontrado em Downloads. Baixe %1$s ou escolha o arquivo que você recebeu.
models_choice_standard_body=A melhor busca em todos os idiomas, além de fala em vídeos e gravações.
models_choice_save_body=Documentos e capturas de tela são encontrados igualmente bem em inglês. As fotos são encontradas só pelas palavras que contêm, não pelo que mostram, então uma foto simples só é encontrada pelo nome. A busca em luganda e suaíli é mais fraca, e não há fala em vídeos nem gravações. Você pode adicionar o resto depois.
models_installed_standard=Modelos Padrão: a melhor busca em todos os idiomas, com fala em vídeos e gravações.
models_installed_save=Modelos Economizar dados: documentos e capturas de tela são encontrados tão bem quanto com o Padrão, em inglês. As fotos são encontradas pelas palavras que contêm, não pelo que mostram. A busca em luganda e suaíli é mais fraca, e não há fala em vídeos nem gravações.
models_upgrade_note=Para obter os modelos Padrão (%1$s MB), pegue o trawl-models.zip e escolha-o aqui. Sua lista de arquivos continua: a busca por nome de arquivo segue funcionando enquanto isso. As palavras dentro de documentos e imagens e a busca por significado voltam conforme cada arquivo é lido de novo.
models_upgraded=Modelos Padrão instalados. O Trawl agora lê seus arquivos novamente com o modelo melhor. Os nomes de arquivo seguem funcionando enquanto isso; as palavras dentro de documentos e imagens voltam conforme os arquivos são lidos.
first_zip_question=Apagar %1$s agora? Ele tem %2$s e o Trawl não precisa mais dele. Você pode baixá-lo de novo depois.
first_zip_delete=Apagar
first_zip_keep=Manter
first_zip_deleted=Apagado: %1$s. Espaço liberado: %2$s.
first_zip_delete_failed=O Trawl não conseguiu apagar %1$s. Você mesmo pode apagá-lo.
first_models_ready=Os modelos estão instalados. O Trawl lê imagens e documentos por significado.
first_models_installing=Verificando e instalando %1$s de %2$s
first_addons_body=Estas deixam o Trawl melhor, mas não são necessárias. Como os modelos, cada uma é um arquivo que você copia para este computador antes.
first_addons_skip=Pule por enquanto. Você pode adicionar qualquer uma depois em Configurações.
first_models_skip_note=Você pode começar sem os modelos. A busca funciona então por nomes e palavras, e o significado começa quando você os adicionar.
first_start_hint=Escolha pelo menos uma pasta para começar.
