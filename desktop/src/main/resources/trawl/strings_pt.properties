settings_heic_missing_linux=Este computador não consegue abrir imagens HEIC, HEIF ou AVIF (as que muitos celulares e iPhones fazem), então o Trawl só as encontra pelo nome. Para resolver, instale o libheif (o programa heif-convert, geralmente no pacote libheif-examples) ou o ImageMagick com suporte a HEIC e reinicie o Trawl.
settings_heic_missing_windows=Este computador não consegue abrir imagens HEIC, HEIF ou AVIF (as que muitos celulares e iPhones fazem), então o Trawl só as encontra pelo nome. Para resolver, adicione as Extensões de Imagem HEIF gratuitas da Microsoft na Microsoft Store e reinicie o Trawl.
