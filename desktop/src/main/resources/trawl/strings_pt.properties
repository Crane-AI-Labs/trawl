report_card_title=O Trawl parou de repente. Relatar?
report_card_body=O relatório não tem nomes de arquivos, buscas nem texto dos seus arquivos. Você o lê primeiro. Nada é enviado: você o copia ou salva e envia por conta própria.
settings_report_open_hint=Cria um relatório que você pode ler, depois copiar ou salvar. Ele contém versões do Trawl e do sistema, o porte deste computador, contagens, configurações como ligadas ou desligadas e registros de erro sem as mensagens. Nada é enviado a lugar nenhum.
