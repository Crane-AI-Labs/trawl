welcome_title=Encontre seus arquivos pelo que dizem e mostram
welcome_point_private_title=Fica neste computador
welcome_point_private_body=A IA que entende seus arquivos roda aqui. O Trawl nunca se conecta à internet: sem contas, sem atualizações, sem rastreamento.
