demo_aria=Trawl, buscando em um computador. Festa de aniversário encontra três fotos de aniversário: um bolo, uma mulher com a família e um homem em uma festa. Senha do wifi encontra uma captura de tela de uma conversa com a rede e a senha. Recibo da loja de celular encontra um recibo em PDF. Vídeo engraçado de cachorro encontra dois vídeos de cachorro. Nota de voz sobre o aluguel encontra uma nota de voz, em 0:42.
